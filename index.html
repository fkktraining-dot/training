<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chemical Fundamentals Training Programme Malaysia</title>
<style>
:root{
  --brand:#0b6b53; --brand-2:#12a37f; --brand-3:#e6f4ef;
  --ink:#10241e; --muted:#657b74; --bg:#f2f6f4; --card:#fff;
  --line:#dde7e3; --ok:#1e7d4f; --warn:#b7791f; --bad:#c0392b;
  --radius:14px; --shadow:0 1px 2px rgba(16,36,30,.06),0 10px 30px rgba(16,36,30,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0 0 .45rem;line-height:1.25}
h1{font-size:1.1rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0 0 .7rem}
a{color:var(--brand)}
small,.muted{color:var(--muted)}
#splash{position:fixed;inset:0;background:radial-gradient(1200px 600px at 8% -10%,rgba(18,163,127,.35),transparent),radial-gradient(900px 500px at 110% 8%,rgba(11,107,83,.45),transparent),linear-gradient(160deg,#0b6b53 0%,#063a2c 100%);display:grid;place-items:center;z-index:99999;transition:opacity .25s}
#splash.hide{opacity:0;pointer-events:none}
.spinner{width:56px;height:56px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-text{color:#fff;font-weight:600;font-size:.9rem;text-align:center;letter-spacing:.02em}
.splash-sub{color:rgba(255,255,255,.7);font-size:.75rem;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:.4rem;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--ink);padding:.55rem .9rem;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none;font-family:inherit}
.btn:hover{border-color:#c3d4ce;background:#f7faf9}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:#095a46;border-color:#095a46}
.btn-danger{background:#fff;border-color:#e8c4bf;color:var(--bad)}
.btn-sm{padding:.34rem .6rem;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%;padding:.9rem;font-size:1rem;font-weight:700}
.iconbtn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:.85rem}

.login-split-screen{min-height:100vh;display:flex;position:relative;background-image:url('https://lh3.googleusercontent.com/d/1fYUfUcjS7-0LzkvjET0-xOtsR00-5Uz3');background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
.login-split-screen::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(11,59,47,0.80) 0%,rgba(11,107,83,0.50) 50%,rgba(6,58,44,0.88) 100%);z-index:0;pointer-events:none}
.login-left{flex:1.1;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:60px;color:#fff;overflow:hidden}
.login-left-content{position:relative;z-index:2;max-width:520px}
.login-left-header .login-logo-large{width:74px;height:74px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.32);backdrop-filter:blur(12px);color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:24px;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.login-left-header h1{font-size:34px;color:#fff;line-height:1.15;margin-bottom:12px;font-weight:800;letter-spacing:-0.5px;text-shadow:0 2px 20px rgba(0,0,0,0.35)}
.login-left-header .login-subtitle{font-size:18px;color:rgba(255,255,255,0.82);margin-bottom:24px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,0.3)}
.login-divider{width:70px;height:3px;background:#12a37f;margin-bottom:20px;border-radius:2px;box-shadow:0 0 12px rgba(18,163,127,0.7)}
.login-tagline{font-size:15px;color:rgba(255,255,255,0.88);font-style:italic;font-weight:600;letter-spacing:0.5px;text-shadow:0 1px 8px rgba(0,0,0,0.35)}
.login-left-bottom{position:absolute;bottom:40px;left:60px;z-index:2}
.knowledge-text{font-family:'Brush Script MT','Dancing Script',cursive,sans-serif;font-size:42px;color:rgba(255,255,255,0.78);line-height:1.05;transform:rotate(-6deg);text-shadow:2px 2px 20px rgba(0,0,0,0.55);letter-spacing:1px}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;z-index:1;background:transparent}
.login-card{width:min(100%,480px);padding:40px;border-radius:24px;background:rgba(255,255,255,0.98);backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,0.35),0 0 0 1px rgba(255,255,255,0.15);border:1px solid #eef2f0;position:relative}
.login-lang{position:absolute;top:24px;right:24px;z-index:5}
.login-card-brand{display:flex;align-items:center;gap:16px;margin-bottom:32px;margin-top:10px}
.login-card-brand .logo-square{width:54px;height:54px;border-radius:14px;background:linear-gradient(140deg,#12a37f,#0b6b53);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;box-shadow:0 6px 18px rgba(11,107,83,0.35)}
.login-card-brand h2{font-size:18px;color:#0b6b53;margin:0 0 4px;line-height:1.2}
.login-card-brand p{font-size:12px;color:#657b74;margin:0}
.login-field{margin-bottom:20px}
.login-field label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#10241e;margin-bottom:8px}
.login-field label svg{color:#0b6b53}
.login-input{width:100%;padding:14px 16px;border:1px solid #dde7e3;border-radius:12px;font-size:15px;color:#10241e;background:#fff;transition:border-color 0.2s,box-shadow 0.2s}
.login-input:focus{outline:none;border-color:#12a37f;box-shadow:0 0 0 3px rgba(18,163,127,0.1)}
.login-input::placeholder{color:#94a39d}
.password-wrapper{position:relative}
.password-wrapper .login-input{padding-right:48px}
.pwd-toggle{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a39d;padding:0;display:flex;align-items:center;justify-content:center}
.pwd-toggle:hover{color:#0b6b53}
.login-btn{width:100%;padding:16px;background:#0b6b53;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background 0.2s,transform 0.1s;margin-top:10px}
.login-btn:hover{background:#095a46}
.login-btn:active{transform:scale(0.98)}
.login-switch{text-align:center;margin-top:24px;font-size:14px;color:#657b74}
.login-switch a{color:#0b6b53;font-weight:700;cursor:pointer;text-decoration:none}
.login-switch a:hover{text-decoration:underline}
@media (max-width:900px){.login-split-screen{flex-direction:column;background-attachment:scroll}.login-left{flex:none;padding:40px 20px 20px;min-height:auto;align-items:center;text-align:center}.login-left-content{margin-top:0;display:flex;flex-direction:column;align-items:center}.login-left-header h1{font-size:24px}.login-left-header .login-subtitle{font-size:15px}.login-left-bottom{display:none}.login-right{padding:16px 16px 32px;background:transparent}.login-card{padding:28px 20px;background:rgba(255,255,255,0.97)}}

.field{margin-bottom:.85rem}
.field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:.3rem;color:#2b3f39}
.input,.select,.textarea{width:100%;padding:.58rem .7rem;border:1px solid var(--line);border-radius:10px;font-size:.9rem;font-family:inherit;background:#fff;color:var(--ink)}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--brand-3);border-color:var(--brand-2)}
.textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.shell{display:flex;min-height:100vh}
.sidebar{width:264px;flex:0 0 auto;background:#0b3b2f;color:#dff0ea;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.sidebar .brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.sidebar .brand strong{display:block;font-size:.9rem;color:#fff}
.sidebar .brand span{display:block;font-size:.66rem;color:#9ec6b8;line-height:1.25}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:14px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:9px;background:transparent;border:0;color:#c6e2d8;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--brand-2);color:#04281f}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:8px}
.userchip{display:flex;gap:9px;align-items:center;margin-bottom:8px;padding:6px 4px;border-radius:9px;cursor:pointer;transition:.15s}
.userchip:hover{background:rgba(255,255,255,.08)}
.userchip strong{display:block;font-size:.8rem;color:#fff}
.userchip span{display:block;font-size:.7rem;color:#9ec6b8}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:linear-gradient(140deg,var(--brand-2),#0d8a6b);color:#fff;font-weight:800;font-size:.78rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:1rem;margin:0}
.topbar .tb-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-block;padding:.2rem .6rem;border-radius:999px;background:var(--brand-3);color:var(--brand);font-size:.74rem;font-weight:700}
#view{padding:22px;max-width:1240px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-head h2{margin:0}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.stat .value{font-size:1.7rem;font-weight:800;line-height:1.15;margin-top:4px;color:var(--brand)}
.stat .sub{font-size:.76rem;color:var(--muted)}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.86rem;background:#fff}
th,td{padding:.6rem .7rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f4f9f7;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f9fcfb}
.badge{display:inline-block;padding:.18rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;white-space:nowrap}
.badge.ok{background:#e3f5ec;color:var(--ok)}
.badge.warn{background:#fdf3e0;color:var(--warn)}
.badge.bad{background:#fdecea;color:var(--bad)}
.badge.draft{background:#eef0f0;color:#5c6b66}
.badge.info{background:#e6f0fb;color:#1f5fa8}
.progress{height:8px;border-radius:999px;background:#e8efec;overflow:hidden}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:999px;transition:width .3s ease}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fbfdfc}
.q-text{margin:0 0 .6rem;font-weight:600}
.opt{display:flex;gap:.55rem;align-items:flex-start;padding:.4rem .55rem;border-radius:8px;cursor:pointer;font-size:.88rem}
.opt:hover{background:#eef7f3}
.opt input{margin-top:.28rem;accent-color:var(--brand)}
.opt.correct{background:#e3f5ec}
.opt.wrong{background:#fdecea}
.modal-backdrop{position:fixed;inset:0;background:rgba(9,30,24,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:92vh;overflow-y:auto;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.modal.modal-lg{width:min(880px,100%)}
.modal.modal-xl{width:min(1100px,100%)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.info-box{background:#f0f7ff;border-left:4px solid #3b82f6;padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:.85rem;color:#1e3a8a}
.info-box h4{margin:0 0 4px;font-size:.9rem}
.info-box ul{margin:0;padding-left:16px}
.info-box li{margin-bottom:4px}
.info-box.ok{background:#e8f5ec;border-left-color:var(--ok);color:#14532d}
.info-box.warn{background:#fef6e7;border-left-color:var(--warn);color:#78350f}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#123a2f;color:#fff;padding:.7rem 1.1rem;border-radius:11px;font-size:.86rem;font-weight:600;z-index:300;transition:.25s;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:#8f2b20}
.toast.warn{background:#8a5a0f}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:.9rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.meta-item{background:#f7fbf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.meta-item .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.meta-item .v{font-size:.9rem;font-weight:600;margin-top:2px}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.87rem}
.quiz-builder{display:flex;flex-direction:column;gap:10px}
.quiz-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfdfc}
.quiz-item-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:6px}
.quiz-options{list-style:none;padding:0;margin:0;font-size:.84rem}
.quiz-options li{padding:2px 0;color:var(--muted)}
.quiz-options li.correct{color:var(--ok);font-weight:700}
.qopt-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.qopt-row .qopt-marker{width:28px;text-align:center;font-weight:800;color:var(--muted);font-size:.8rem}
.qopt-row input[type="radio"]{accent-color:var(--brand);flex:0 0 auto}
.qopt-row .input{flex:1}
.bank-list{display:grid;gap:12px}
.bank-item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.bank-item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}
.bank-item .question-text{font-weight:600;margin-bottom:8px;font-size:.92rem}
.bank-item .opts{display:grid;gap:4px;font-size:.85rem}
.bank-item .opts span{padding:3px 8px;border-radius:6px;background:#f4f9f7}
.bank-item .opts span.correct{background:#e3f5ec;color:var(--ok);font-weight:700}
.bank-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.picker-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.picker-toolbar .input,.picker-toolbar .select{flex:1;min-width:140px}
.picker-list{max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.picker-item{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.picker-item:hover{background:#f7fbf9}
.picker-item input{margin-top:3px;accent-color:var(--brand)}
.picker-item:last-child{border-bottom:0}
.rubric-builder{display:flex;flex-direction:column;gap:12px}
.rubric-criterion-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfdfc}
.rubric-levels-table{width:100%;font-size:12px;border-collapse:collapse}
.rubric-levels-table th{background:#f4f9f7;text-align:left;padding:6px 4px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.rubric-levels-table td{padding:4px}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.module-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.module-card .m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.module-card .m-title{font-weight:800;font-size:1rem;line-height:1.3;color:var(--ink)}
.module-card .m-desc{font-size:.83rem;color:var(--muted);flex:1}
.module-card .m-stats{display:flex;gap:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:.78rem}
.module-card .m-stats div strong{color:var(--brand);font-size:1.05rem;display:block;line-height:1.1}
.module-card .m-stats div span{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
.module-card.enrolled{border-color:var(--brand-2);background:linear-gradient(180deg,#fbfefc,#fff)}
.pending-quiz-card{background:linear-gradient(135deg,#fff9e6,#fff);border:1px solid #f0d98a;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pending-quiz-card .pq-title{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pending-quiz-card .pq-meta{font-size:.78rem;color:var(--muted);margin-top:2px}
.status-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.status-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fbfdfc}
.status-card.active{border-color:var(--brand-2);background:#f2fbf7}
.status-card .sc-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-bottom:4px}
.status-card .sc-value{font-size:.9rem;font-weight:700}
.status-card .sc-actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.material-list{display:flex;flex-direction:column;gap:8px}
.material-item{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfc}
.material-item .mat-icon{font-size:1.4rem;flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;background:var(--brand-3);border-radius:9px}
.material-item .mat-body{flex:1;min-width:0}
.material-item .mat-name{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.material-item .mat-meta{font-size:.75rem;color:var(--muted);margin-top:2px}
.material-item .mat-desc{font-size:.78rem;color:var(--muted);margin-top:2px;font-style:italic}
.upload-zone{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;background:#fbfdfc;transition:.15s;cursor:pointer}
.upload-zone:hover{border-color:var(--brand-2);background:#f2fbf7}
.upload-zone.dragover{border-color:var(--brand-2);background:#e6f4ef;border-style:solid}
.upload-zone .uz-icon{font-size:2.4rem;display:block;margin-bottom:6px}
.upload-zone .uz-title{font-weight:700;font-size:.92rem;margin-bottom:3px;color:var(--ink)}
.upload-zone .uz-hint{font-size:.78rem;color:var(--muted)}
.file-preview{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#f4f9f7;font-size:.83rem}
.file-preview strong{color:var(--brand)}
.timetable-list{display:flex;flex-direction:column;gap:14px}
.tt-day{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdfc}
.tt-day-head{font-weight:800;font-size:.92rem;color:var(--brand);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tt-entry{display:flex;gap:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px;align-items:flex-start}

async function driveAPI(action, data) {
  const body = Object.assign({ action, apiKey: DRIVE_API_KEY || undefined }, data || {});

  const tid = setTimeout(() => ctl.abort(), DRIVE_TIMEOUT_MS);

      body: JSON.stringify(body),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      redirect: 'follow',

    clearTimeout(tid);

/* PASSWORD STRENGTH */
function assessPassword(pw) {
  const s = String(pw || '');
  const checks = {
    length: s.length >= 8,
    lower: /[a-z]/.test(s),
    upper: /[A-Z]/.test(s),
    number: /[0-9]/.test(s),
    special: /[^A-Za-z0-9]/.test(s)
  };
  const metCount = Object.values(checks).filter(Boolean).length;
  const allMet = metCount === 5;
  let strength = 0;
  if (checks.length) strength += 20;
  if (s.length >= 12) strength += 10;
  if (s.length >= 16) strength += 10;
  if (checks.lower) strength += 15;
  if (checks.upper) strength += 15;
  if (checks.number) strength += 15;
  if (checks.special) strength += 15;
  strength = Math.min(100, strength);
  return { checks, metCount, allMet, strength };
}
function pwdClass(strength) {
  if (strength < 40) return 'weak';
  if (strength < 60) return 'fair';
  if (strength < 80) return 'good';
  return 'strong';
}
function pwdLabelText(strength) {
  if (strength === 0) return '—';
  if (strength < 40) return t('pwd_strength_weak');
  if (strength < 60) return t('pwd_strength_fair');
  if (strength < 80) return t('pwd_strength_good');
  return t('pwd_strength_strong');
}
function updatePasswordMeter(pwValue, scope) {
  const meter = document.getElementById('pwdMeter-' + scope);
  if (!meter) return;
  const res = assessPassword(pwValue);
  const bar = meter.querySelector('.pwd-bar > span');
  const label = meter.querySelector('.pwd-label');
  const reqs = meter.querySelectorAll('.pwd-reqs li');
  if (bar) { bar.style.width = res.strength + '%'; bar.className = pwdClass(res.strength); }
  if (label) { label.textContent = t('pwd_strength_label') + ': ' + pwdLabelText(res.strength); label.className = 'pwd-label ' + pwdClass(res.strength); }
  reqs.forEach(li => { if (res.checks[li.dataset.req]) li.classList.add('met'); else li.classList.remove('met'); });
}
function passwordMeterHtml(scope) {
  return `<div class="pwd-meter" id="pwdMeter-${scope}">
    <div class="pwd-bar"><span></span></div>
    <div class="pwd-label">${t('pwd_strength_label')}: —</div>
    <ul class="pwd-reqs">
      <li data-req="length">${t('pwd_req_length')}</li>
      <li data-req="lower">${t('pwd_req_lower')}</li>
      <li data-req="upper">${t('pwd_req_upper')}</li>
      <li data-req="number">${t('pwd_req_number')}</li>
      <li data-req="special">${t('pwd_req_special')}</li>
    </ul>
  </div>`;
}

function fileTypeFromName(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'pdf') return 'pdf';
  if (['doc','docx'].includes(ext)) return 'word';
  if (['ppt','pptx'].includes(ext)) return 'powerpoint';
  if (['xls','xlsx','csv'].includes(ext)) return 'excel';
  if (['jpg','jpeg','png','gif','bmp','webp','svg','ico','tif','tiff'].includes(ext)) return 'image';
  if (['txt','md','json','xml','html','css','js','log'].includes(ext)) return 'text';
  return 'other';
}
function fileIcon(type) {
  if (type === 'pdf') return '📄';
  if (type === 'word') return '📝';
  if (type === 'powerpoint') return '📊';
  if (type === 'excel') return '📈';
  if (type === 'image') return '🖼️';
  if (type === 'text') return '📃';
  if (type === 'link') return '🔗';
  return '📎';
}
function fileTypeLabel(type) {
  if (type === 'pdf') return 'PDF';
  if (type === 'word') return 'Word';
  if (type === 'powerpoint') return 'PowerPoint';
  if (type === 'excel') return 'Excel';
  if (type === 'image') return t('file_type_image');
  if (type === 'text') return 'Text';
  if (type === 'link') return 'Link';
  return t('file_type_other');
}
function formatFileSize(bytes) {
  if (!bytes && bytes !== 0) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}
function base64ToBlob(dataUrl) {
  const parts = dataUrl.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

let saveTimer = null, saveInFlight = false, savePending = false;
let pendingSaveSince = 0;

function updateBeforeUnload() {
  if (pendingSaveSince > 0 || saveInFlight || saveTimer) {
    window.onbeforeunload = function(e) {
      try {
        if (navigator.sendBeacon) {
          const blob = new Blob([JSON.stringify({ action: 'saveState', state: DB })], { type: 'text/plain;charset=utf-8' });
          navigator.sendBeacon(DRIVE_API_URL, blob);
        } else {
          fetch(DRIVE_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'saveState', state: DB }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            keepalive: true
          }).catch(() => {});
        }
      } catch (err) {}
      const msg = t('sync_beforeunload_msg');
      e.preventDefault();
      e.returnValue = msg;
      return msg;
    };
  } else {
    window.onbeforeunload = null;
  }
}

function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch(e) { console.error(e); }
  if (!pendingSaveSince) pendingSaveSince = Date.now();
  updateBeforeUnload();
  scheduleServerSave();
}

function scheduleServerSave() {
  if (saveTimer) clearTimeout(saveTimer);
  if (saveInFlight) { savePending = true; return; }
  const b = document.getElementById('syncBadge');
  if (b) { b.textContent = '⟳'; b.style.background = '#fdf3e0'; b.style.color = '#b7791f'; b.title = 'Saving…'; }
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    if (saveInFlight) { savePending = true; return; }
    saveInFlight = true;
    try {
      const res = await driveAPI('saveState', { state: DB });
      if (!res.ok) throw new Error(res.error || 'Save failed');
      pendingSaveSince = 0;
      updateBeforeUnload();
      const b2 = document.getElementById('syncBadge');
      if (b2) { b2.textContent = '✓'; b2.style.background = '#e8f5ec'; b2.style.color = '#1e7d4f'; b2.title = 'Synced ' + new Date().toLocaleTimeString(); }
    } catch (err) {
      console.warn('Save failed:', err);
      const b2 = document.getElementById('syncBadge');
      if (b2) { b2.textContent = '⚠'; b2.style.background = '#fdecea'; b2.style.color = '#c0392b'; b2.title = 'Save failed: ' + err.message; }
    } finally {
      saveInFlight = false;
      if (savePending) { savePending = false; scheduleServerSave(); }
    }
  }, 1200);
}

async function forceSaveNow() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  if (saveInFlight) {
    let waited = 0;
    while (saveInFlight && waited < 8000) {
      await new Promise(r => setTimeout(r, 200));
      waited += 200;
    }
  }
  if (!pendingSaveSince && !savePending && !saveInFlight) {
    return { ok: true, skipped: true };
  }
  saveInFlight = true;
  savePending = false;
  try {
    const res = await driveAPI('saveState', { state: DB });
    if (!res.ok) throw new Error(res.error || 'Save failed');
    pendingSaveSince = 0;
    updateBeforeUnload();
    const b2 = document.getElementById('syncBadge');
    if (b2) { b2.textContent = '✓'; b2.style.background = '#e8f5ec'; b2.style.color = '#1e7d4f'; b2.title = 'Synced ' + new Date().toLocaleTimeString(); }
    return { ok: true };
  } catch (err) {
    return { ok: false, error: err.message };
  } finally {
    saveInFlight = false;
    updateBeforeUnload();
  }
}

async function serverPullInBackground() {
  if (firstSyncPromise) return firstSyncPromise;
  firstSyncPromise = (async () => {
    try {
      const res = await driveAPI('loadState');
      if (res.ok && res.state && Array.isArray(res.state.users) && res.state.users.length) {
        const before = JSON.stringify(DB);
        DB = res.state;
        if (!Array.isArray(DB.questionBank) || !DB.questionBank.length) DB.questionBank = seedQuestionBank();
        migrateDB();
        try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch(e) {}
        const sid = localStorage.getItem(SESSION_KEY);
        if (sid) state.user = DB.users.find(u => u.id === sid) || null;
        if (JSON.stringify(DB) !== before) {
          if (!checkStandaloneFinal() && !checkStandaloneQuiz()) render();
        }
      } else if (res.ok) {
        try {
          const sr = await driveAPI('saveState', { state: DB });
          if (sr.ok) console.log('✅ Seed pushed.');
        } catch(e) { console.error('❌ Seed push failed:', e); }
      }
    } catch(e) {
      console.warn('Background sync failed:', e);
    } finally {
      firstSyncDone = true;
    }
  })();
  return firstSyncPromise;
}

function migrateDB() {
  if (Array.isArray(DB.users)) {
    const takenUsernames = new Set();
    DB.users.forEach(u => { if (u.username) takenUsernames.add(String(u.username).toLowerCase()); });
    DB.users.forEach(u => {
      if (!u.username) {
        let base = (String(u.email || 'user').split('@')[0] || 'user').replace(/[^a-z0-9_]/gi, '').toLowerCase() || 'user';
        let candidate = base;
        let i = 1;
        while (takenUsernames.has(candidate)) { candidate = base + i; i++; }
        u.username = candidate;
        takenUsernames.add(candidate);
      }
      if (!u.createdAt) u.createdAt = nowISO();
      if (u.phone === undefined) u.phone = '';
      if (!u.status) u.status = 'approved';
    });
  }
  (DB.activities || []).forEach(a => {
    (a.rubric || []).forEach(c => {
      if (!c.levels) {
        const mx = c.maxMarks ?? c.weight ?? 10;
        c.levels = [{ label:t('rb_level_good'), mark:mx, description:c.description||'' }, { label:t('rb_level_fail'), mark:0, description:'' }];
        c.weight = mx; delete c.maxMarks; delete c.description;
      }
    });
    if (a.quizOpenAt === undefined) a.quizOpenAt = null;
    if (a.quizCloseAt === undefined) a.quizCloseAt = null;
    if (a.quizDuration === undefined) a.quizDuration = null;
  });
  if (!Array.isArray(DB.modules) || !DB.modules.length) {
    const nameMap = new Map();
    (DB.activities || []).forEach(a => { if (a.module && !nameMap.has(a.module)) nameMap.set(a.module, a.trainerId || 'u_tr1'); });
    DB.modules = []; let idx = 0;
    nameMap.forEach((trainerId, name) => {
      idx++; DB.modules.push({ id:'mod_'+idx, name, description:'', trainerId, facilitatorId:null, createdBy:'u_admin', createdAt:nowISO(), updatedAt:nowISO(), published:true, materials: [] });
    });
    (DB.activities || []).forEach(a => { const m = DB.modules.find(mm => mm.name === a.module); if (m) a.moduleId = m.id; });
  }
  (DB.modules || []).forEach(m => {
    if (!Array.isArray(m.materials)) m.materials = [];
    if (m.facilitatorId === undefined) m.facilitatorId = null;
  });
  (DB.activities || []).forEach(a => { const m = (DB.modules || []).find(mm => mm.id === a.moduleId); if (m) a.trainerId = m.trainerId; });
  if (!Array.isArray(DB.enrollments)) {
    DB.enrollments = []; const seen = new Set();
    const ensure = (mid, pid) => { if (!mid || !pid) return; const k = mid+':'+pid; if (seen.has(k)) return; seen.add(k); DB.enrollments.push({ id:uid('en'), moduleId:mid, participantId:pid, enrolledBy:'system', enrolledAt:nowISO(), status:'Aktif' }); };
    const m = new Map();
    (DB.attempts||[]).forEach(x => { if (!m.has(x.participantId)) m.set(x.participantId, new Set()); m.get(x.participantId).add(x.activityId); });
    (DB.attendance||[]).forEach(x => { if (!m.has(x.participantId)) m.set(x.participantId, new Set()); m.get(x.participantId).add(x.activityId); });
    (DB.practical||[]).forEach(x => { if (!m.has(x.participantId)) m.set(x.participantId, new Set()); m.get(x.participantId).add(x.activityId); });
    m.forEach((actIds, pid) => actIds.forEach(aid => { const a = (DB.activities||[]).find(x => x.id === aid); if (a && a.moduleId) ensure(a.moduleId, pid); }));
  }
  if (!Array.isArray(DB.rubrics)) DB.rubrics = [];
  (DB.rubrics || []).forEach(rb => {
    if (rb.approvalStatus === undefined) rb.approvalStatus = 'approved';

let syncProgressInterval = null;
function showSyncModal(opts) {
  opts = opts || {};
  const title = opts.title || t('sync_upload_title');
  const desc = opts.desc || t('sync_upload_desc');
  const onSkip = opts.onSkip || null;
  const showSkip = !!onSkip;
  const html = `<div class="sync-overlay">
    <div class="sync-modal" id="syncModalBox">

      <div class="sync-status" id="syncStatus">${esc(t('sync_upload_status_connecting'))}</div>
      <div class="sync-detail" id="syncDetail"></div>
      <div class="sync-actions" id="syncActions">
        ${showSkip ? `<button class="btn" id="syncSkipBtn">${esc(t('sync_skip_logout'))}</button>` : ''}
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  if (showSkip) {
    const btn = document.getElementById('syncSkipBtn');
    if (btn) btn.addEventListener('click', () => { try { onSkip(); } catch(e){} }, { once: true });
  }
  let pct = 0;
  const texts = [t('sync_upload_status_connecting'), t('sync_upload_status_sending'), t('sync_upload_status_verifying')];
  syncProgressInterval = setInterval(() => {
    const bar = document.getElementById('syncProgressBar');
    const status = document.getElementById('syncStatus');
    if (!bar || !status) { clearInterval(syncProgressInterval); syncProgressInterval = null; return; }
    pct = Math.min(88, pct + Math.random() * 12 + 2);
    bar.style.width = pct + '%';
    status.textContent = texts[Math.floor(pct / 30)] || texts[texts.length - 1];
  }, 400);
  return {
    done(success, msg) {
      if (syncProgressInterval) { clearInterval(syncProgressInterval); syncProgressInterval = null; }
      const box = document.getElementById('syncModalBox');
      const bar = document.getElementById('syncProgressBar');
      const status = document.getElementById('syncStatus');
      const detail = document.getElementById('syncDetail');
      const actions = document.getElementById('syncActions');
      const icon = box ? box.querySelector('.sync-icon') : null;
      if (bar) bar.style.width = '100%';
      if (box) box.classList.add(success ? 'ok' : 'err');
      if (icon) icon.textContent = success ? '✅' : '⚠️';
      if (status) { status.textContent = msg || (success ? t('sync_upload_status_success') : t('sync_upload_status_failed')); status.style.color = success ? 'var(--ok)' : 'var(--bad)'; status.style.fontWeight = '700'; }
      if (detail) detail.textContent = '';
      if (actions) {
        actions.innerHTML = `<button class="btn btn-primary" id="syncCloseBtn">${esc(t('btn_close'))}</button>`;
        const cb = document.getElementById('syncCloseBtn');
        if (cb) cb.addEventListener('click', () => this.close(), { once: true });
      }
    },
    close() {
      const overlay = document.querySelector('.sync-overlay');
      if (overlay) overlay.remove();
      if (syncProgressInterval) { clearInterval(syncProgressInterval); syncProgressInterval = null; }
    }
  };
}

function handleLogoutClick() {
  const hasPending = pendingSaveSince > 0 || saveInFlight || !!saveTimer;
  if (!hasPending) {
    doLogout();
    return;
  }
  const modal = showSyncModal({
    title: t('sync_upload_title'),
    desc: t('sync_upload_desc'),
    onSkip: () => {
      modal.close();
      doLogout();
    }
  });
  forceSaveNow().then(res => {
    if (res.ok) {
      modal.done(true);
      setTimeout(() => { modal.close(); doLogout(); }, 900);
    } else {
      modal.done(false, (res.error || '') + ' — ' + t('msg_invalid_login'));
      setTimeout(() => { modal.close(); doLogout(); }, 2600);
    }
  });
}

function doLogout() {
  if (state.user) logAudit('Logout', 'Sesi', state.user.id, state.user.name);
  pendingSaveSince = 0;
  savePending = false;
  saveInFlight = false;
  updateBeforeUnload();
  state.user = null;
  state.view = 'dashboard';
  state.params = {};
  state.loginMode = 'login';
  localStorage.removeItem(SESSION_KEY);
  try { sessionStorage.removeItem('cftpmy_login_draft'); } catch(e) {}
  lastPushedStateKey = null;
  try { history.replaceState(null, ''); } catch(e) {}
  render();
}

  if (status) { status.textContent = success ? t('dl_complete') : (t('dl_failed') + (errMsg ? ' — ' + errMsg : '')); status.style.color = success ? 'var(--ok)' : 'var(--bad)'; status.style.fontWeight = '700'; }
  if (actions) actions.style.display = 'flex';

}

async function downloadWithProgress(url, filename, logInfo) {
  const id = showDownloadModal(filename);
  try {
    const response = await fetch(url, { credentials: 'omit' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const contentLength = response.headers.get('Content-Length');
    const total = contentLength ? parseInt(contentLength, 10) : 0;
    if (response.body && response.body.getReader) {
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total > 0) updateDownloadProgress(id, Math.round(received / total * 100), received, total);
        else updateDownloadProgress(id, null, received, total);
      }
      const blob = new Blob(chunks);
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);
    } else {
      const blob = await response.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1500);
    }
    finishDownloadModal(id, true);
    if (logInfo) logAudit('Download File', logInfo.entity, logInfo.entityId, logInfo.details);
    return true;
  } catch (err) {
    console.warn('Download via fetch failed, falling back to link:', err);
    try {
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.target = '_blank'; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      finishDownloadModal(id, true);
      if (logInfo) logAudit('Download File', logInfo.entity, logInfo.entityId, logInfo.details);
      return true;
    } catch (e2) {
      finishDownloadModal(id, false, err.message);
      return false;
    }
  }
}

    app.innerHTML = `<div class="standalone-wrap"><div class="standalone-card"><div class="quiz-header"><div class="logo">CF</div><div style="flex:1"><h1>${tce(act.title)}</h1><p class="muted" style="margin:0">${tce(moduleName(act.moduleId))} · ${tce(state.user.name)}</p></div></div>${retestBanner}<div class="info-box warn"><h4>🔒 ${t('quiz_closed')}</h4><p style="margin:0">${t('quiz_closed_notice', act.quizCloseAt ? fmtDT(act.quizCloseAt) : '—')}</p></div><div class="tab-actions"><button class="btn" onclick="window.close()">${t('btn_close_tab')}</button></div></div></div>`; return;
  }
  const hasTimer = quizHasTimer(act);
  const durationMs = hasTimer ? (Number(act.quizDuration) * 60 * 1000) : 0;
  let remainingMs = 0;
  if (hasTimer) {
    const key = startKeyFor(act.id, pid);
    let startedAt = Number(localStorage.getItem(key)) || 0;
    const now = Date.now();
    if (!startedAt || startedAt < (w.open || 0) || startedAt > now) { startedAt = now; try { localStorage.setItem(key, String(startedAt)); } catch(e) {} }
    remainingMs = durationMs - (now - startedAt);
    if (remainingMs <= 0) { autoSubmitQuiz(act, pid); return; }
  }
  app.innerHTML = `<div class="standalone-wrap"><div class="standalone-card">
    ${retestBanner}
    <div class="quiz-header"><div class="logo">CF</div><div style="flex:1;min-width:220px"><h1>${tce(act.title)}</h1><p class="muted" style="margin:0">${tce(moduleName(act.moduleId))} · ${act.quiz.length} ${t('lbl_questions')} · ${tce(state.user.name)}</p></div>${hasTimer ? `<div class="quiz-timer" id="quizTimer"><span class="timer-label">${t('quiz_time')}</span><span class="timer-value" id="timerText">--:--</span></div>` : ''}</div>
    <div class="info-box ${hasTimer ? 'warn' : 'ok'}" style="margin-bottom:16px"><h4>${hasTimer ? '⏱️ ' + t('quiz_timed') : '📝 ' + t('quiz_ready')}</h4><p style="margin:0">${hasTimer ? t('quiz_timed_body', act.quizDuration) : t('quiz_ready_body')}</p>${act.quizCloseAt ? `<p style="margin:6px 0 0;font-size:.82rem">${t('quiz_close_hint', fmtDT(act.quizCloseAt))}</p>` : ''}</div>
    <form id="standalone-quiz-form">${act.quiz.map((q, qi) => `<div class="q"><p class="q-text">${qi+1}. ${tce(q.q)}</p>${q.options.map((o, oi) => `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${oi === 0 ? 'required' : ''} /><span><strong>${'ABCD'[oi]}.</strong> ${tce(o)}</span></label>`).join('')}</div>`).join('')}<div class="tab-actions"><button type="button" class="btn" onclick="window.close()">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_submit')}</button></div></form>
  </div></div>`;
  document.getElementById('standalone-quiz-form').addEventListener('submit', (e) => { e.preventDefault(); handleStandaloneQuizSubmit(act, pid, e.target); });
  if (hasTimer) startQuizTimer(act, pid, remainingMs);
}

function handleSaveProfile(form) {
  const u = state.user; if (!u) return;
  const name = form.name.value.trim();
  const username = form.username.value.trim();
  const email = form.email.value.trim().toLowerCase();
  const ic = form.ic.value.trim(), org = form.org.value.trim();
  const phone = form.phone ? form.phone.value.trim() : '';
  if (!name || !username || !email) { toast(t('msg_required'), 'bad'); return; }
  if (!/^[A-Za-z0-9_]{3,}$/.test(username)) { toast(t('username_invalid'), 'bad'); return; }
  const dupU = DB.users.find(x => x.id !== u.id && String(x.username||'').toLowerCase() === username.toLowerCase());
  if (dupU) { toast(t('username_taken'), 'bad'); return; }
  const dupE = DB.users.find(x => x.id !== u.id && x.email.toLowerCase() === email);
  if (dupE) { toast(t('msg_email_taken'), 'bad'); return; }

  saveDB(); logAudit('Update Profile', 'Pengguna', u.id, name); toast('✅ ' + t('profile_updated')); render();

function handleChangePassword(form) {
  const u = state.user; if (!u) return;
  const cur = form.currentPassword.value;
  const np = form.newPassword.value;
  const cp = form.confirmPassword.value;
  if (cur !== u.password) { toast(t('current_password_wrong'), 'bad'); return; }
  if (!assessPassword(np).allMet) { toast(t('pwd_format_invalid'), 'bad'); return; }
  if (np !== cp) { toast(t('password_mismatch'), 'bad'); return; }
  u.password = np; saveDB(); logAudit('Change Password', 'Pengguna', u.id, u.name);
  toast('✅ ' + t('password_changed')); form.reset();
}

async function handleLogin(form) {
  const btn = form.querySelector('button[type="submit"]');
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Memeriksa…'; }
  const doLogin = () => {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
    const idInput = String(form.email.value || '').trim().toLowerCase();
    const passInput = String(form.password.value || '').trim();
    if (!idInput || !passInput) { toast(t('msg_required'), 'bad'); return; }
    const u = DB.users.find(x => {
      const xUser = String(x.username || '').trim().toLowerCase();
      const xEmail = String(x.email || '').trim().toLowerCase();
      const xPass = String(x.password ?? '').trim();
      return (xUser === idInput || xEmail === idInput) && xPass === passInput;
    });
    if (!u) { toast(t('msg_invalid_login'), 'bad'); return; }
    if (u.status === 'pending') { toast('⏳ ' + t('msg_account_pending'), 'warn'); return; }
    if (u.status === 'rejected') { toast('⛔ ' + t('msg_account_rejected'), 'bad'); return; }
    state.user = u; state.view = 'dashboard'; state.params = {};
    localStorage.setItem(SESSION_KEY, u.id);
    try { sessionStorage.removeItem('cftpmy_login_draft'); } catch(e) {}
    logAudit('Login', 'Sesi', u.id, u.name);
    try { history.replaceState({ view: 'dashboard', params: {}, cftp: true }, ''); lastPushedStateKey = stateKeyOf('dashboard', {}); } catch(e) {}
    render();
  };
  if (firstSyncDone || !firstSyncPromise) doLogin();
  else { if (btn) btn.textContent = '⏳ Sinkronisasi…'; Promise.race([firstSyncPromise, new Promise(r => setTimeout(r, 12000))]).then(doLogin); }
}

function handleRegister(form) {
  const name = form.name.value.trim();
  const username = form.username.value.trim();
  const email = form.email.value.trim().toLowerCase();
  const org = form.org ? form.org.value.trim() : '';
  const pass = form.password.value;
  const cp = form.confirmPassword.value;
  if (!name || !username || !email || !pass) { toast(t('msg_required'), 'bad'); return; }
  if (!/^[A-Za-z0-9_]{3,}$/.test(username)) { toast(t('username_invalid'), 'bad'); return; }
  if (!assessPassword(pass).allMet) { toast(t('pwd_format_invalid'), 'bad'); return; }
  if (pass !== cp) { toast(t('password_mismatch'), 'bad'); return; }
  if (DB.users.find(x => String(x.username||'').toLowerCase() === username.toLowerCase())) { toast(t('username_taken'), 'bad'); return; }
  if (DB.users.find(x => String(x.email||'').toLowerCase() === email)) { toast(t('msg_email_taken'), 'bad'); return; }
  const nu = { id: uid('u'), username, name, email, password: pass, role: 'participant', org, ic: '', phone: '', status: 'pending', createdAt: nowISO() };
  DB.users.push(nu); saveDB();
  state.loginMode = 'login';
  try { sessionStorage.removeItem('cftpmy_register_draft'); } catch(e) {}
  logAudit('Register (Pending Approval)', 'Pengguna', nu.id, name);
  toast('✅ ' + t('register_pending_success')); render();
}

function renderApprovalCard(pa) {
  const isPending = pa.status === 'pending';
  let typeLabel = '', targetLabel = '', rubric = [], current = null;
  if (pa.type === 'practical') {
    const act = getActivity(pa.activityId);
    if (!act) return '';
    typeLabel = '📏 ' + t('act_practical_eval');
    targetLabel = `${tce(act.title)} · ${tce(moduleName(act.moduleId))}`;
    rubric = getRubricCriteria(act);
    current = getPractical(pa.activityId, pa.participantId);
  } else if (pa.type === 'final-practical') {
    const fe = getFinalExam(pa.finalId);
    if (!fe) return '';
    typeLabel = '🎓 ' + t('fe_type_practical');
    targetLabel = `${tce(fe.title)} · ${tce(feModulesLabel(fe))}`;
    const rb = getRubricById(fe.rubricId);
    rubric = rb ? rb.criteria : [];
    current = fePracticalFor(pa.finalId, pa.participantId);
  }
  const pName = userName(pa.participantId);
  const subBy = userName(pa.submittedBy);
  const statusBadge = pa.status === 'pending' ? `<span class="badge warn">⏳ ${t('pa_pending')}</span>` : pa.status === 'approved' ? `<span class="badge ok">✓ ${t('pa_approved')}</span>` : `<span class="badge bad">✖ ${t('pa_rejected')}</span>`;
  const curTotal = current ? current.total : null;
  const newTotal = pa.data.total;
  const diffHtml = `<div class="ap-diff"><div class="ap-box"><div class="ap-k">${t('pa_current_value')}</div><div class="ap-v">${curTotal !== null ? curTotal.toFixed(1) + '%' : '—'}</div></div><div class="ap-box"><div class="ap-k">${t('pa_new_value')}</div><div class="ap-v">${newTotal.toFixed(1)}%</div></div></div>`;
  let critHtml = '';
  if (rubric.length && pa.data.scores) {
    critHtml = `<table class="ap-crit-table"><thead><tr><th style="text-align:left">${t('rb_col_name')}</th><th style="text-align:center">${t('pa_current_value')}</th><th style="text-align:center">${t('pa_new_value')}</th></tr></thead><tbody>${rubric.map((c, i) => { const curMark = current && current.scores ? current.scores[i] : null; const newMark = pa.data.scores[i]; return `<tr><td>${tce(c.name)}</td><td style="text-align:center">${curMark !== null && curMark !== undefined ? curMark : '—'}</td><td style="text-align:center"><strong>${newMark}</strong></td></tr>`; }).join('')}</tbody></table>`;
  }
  const actions = isPending ? `<div class="ap-actions"><button class="btn btn-sm btn-danger" data-act="pa-reject" data-id="${pa.id}">✖ ${t('pa_reject')}</button><button class="btn btn-sm btn-primary" data-act="pa-approve" data-id="${pa.id}">✅ ${t('pa_approve')}</button></div>` : (pa.reviewRemarks ? `<div style="font-size:.78rem;color:var(--muted);margin-top:8px"><strong>${t('pa_reject_reason')}:</strong> ${tce(pa.reviewRemarks)}</div>` : '');
  return `<div class="approval-card" style="${!isPending ? 'border-color:var(--line);background:#fbfdfc' : ''}">
    <div class="ap-head">
      <div><div class="ap-title">${typeLabel} — ${tce(pName)}</div><div class="ap-meta">${targetLabel}</div><div class="ap-meta">📤 ${t('pa_submitted_by')}: <strong>${tce(subBy)}</strong> · ${fmtDateTime(pa.submittedAt)}</div></div>
      <div>${statusBadge}</div>
    </div>
    ${diffHtml}
    ${critHtml}
    ${pa.data.remarks ? `<div style="font-size:.82rem;margin:8px 0"><strong>${t('pf_remarks')}:</strong> ${tce(pa.data.remarks)}</div>` : ''}
    ${actions}
  </div>`;
}
function approvalsView() {
  if (!['admin','trainer'].includes(state.user.role)) return `<div class="card"><div class="empty">${t('msg_no_access')}</div></div>`;
  const isAdmin = state.user.role === 'admin';
  const myModIds = (isAdmin ? DB.modules : DB.modules.filter(m => m.trainerId === state.user.id)).map(m => m.id);
  const all = (DB.pendingApprovals || []).filter(x => isAdmin || myModIds.includes(x.moduleId));
  const pending = all.filter(x => x.status === 'pending').sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
  const history = all.filter(x => x.status !== 'pending').sort((a,b) => new Date(b.reviewedAt||b.submittedAt) - new Date(a.reviewedAt||a.submittedAt)).slice(0, 20);
  return `<div class="card"><div class="card-head"><div><h2>📥 ${t('pa_title')}</h2><small class="muted">${t('pa_sub')}</small></div><span class="badge ${pending.length ? 'warn' : 'ok'}">${pending.length} ${t('pa_pending')}</span></div>
    ${pending.length ? pending.map(renderApprovalCard).join('') : `<div class="empty">${t('pa_no_pending')}</div>`}
  </div>
  ${history.length ? `<div class="card"><div class="card-head"><h2>📜 ${t('pa_history')}</h2></div>${history.map(renderApprovalCard).join('')}</div>` : ''}`;
}
function approvePendingApproval(paId) {
  const pa = (DB.pendingApprovals || []).find(x => x.id === paId);
  if (!pa || pa.status !== 'pending') return;
  if (pa.type === 'practical') {
    let rec = DB.practical.find(x => x.activityId === pa.activityId && x.participantId === pa.participantId);
    if (rec) { Object.assign(rec, pa.data, { by: state.user.id, at: nowISO() }); }
    else DB.practical.push(Object.assign({ id: uid('pr'), activityId: pa.activityId, participantId: pa.participantId, by: state.user.id, at: nowISO() }, pa.data));
  } else if (pa.type === 'final-practical') {
    let rec = DB.fePractical.find(x => x.finalId === pa.finalId && x.participantId === pa.participantId);
    if (rec) { Object.assign(rec, pa.data, { by: state.user.id, at: nowISO() }); }
    else DB.fePractical.push(Object.assign({ id: uid('fep'), finalId: pa.finalId, participantId: pa.participantId, by: state.user.id, at: nowISO() }, pa.data));
  }
  pa.status = 'approved'; pa.reviewedBy = state.user.id; pa.reviewedAt = nowISO();
  saveDB();
  logAudit('Approve Correction', 'Penilaian', pa.type + ':' + pa.id, userName(pa.participantId));
  toast('✅ ' + t('pa_approved_msg')); render();
}
function rejectPendingApproval(paId, reason) {
  const pa = (DB.pendingApprovals || []).find(x => x.id === paId);
  if (!pa || pa.status !== 'pending') return;
  pa.status = 'rejected'; pa.reviewedBy = state.user.id; pa.reviewedAt = nowISO(); pa.reviewRemarks = reason || '';
  saveDB();
  logAudit('Reject Correction', 'Penilaian', pa.type + ':' + pa.id, userName(pa.participantId) + (reason ? ' — ' + reason : ''));
  toast(t('pa_rejected_msg')); render();
}

function renderMaterialsSection(m, canEdit) {
  const mats = m.materials || [];
  return `<div class="card"><div class="card-head"><div><h2>📎 ${t('mat_title')} (${mats.length})</h2><small class="muted">${t('mat_sub')}</small></div>${canEdit ? `<button class="btn btn-sm btn-primary" data-act="upload-material" data-mid="${m.id}">${t('mat_upload')}</button>` : ''}</div><p class="muted" style="font-size:.78rem;margin-top:-8px">${t('mat_drive_note')}</p>${mats.length ? `<div class="material-list">${mats.map(mat => `<div class="material-item"><div class="mat-icon">${fileIcon(mat.type)}</div><div class="mat-body"><div class="mat-name">${tce(mat.name)}</div><div class="mat-meta">${fileTypeLabel(mat.type)}${mat.size ? ' · ' + formatFileSize(mat.size) : ''} · ${fmtDate(mat.uploadedAt)}${mat.uploadedBy ? ' · ' + tce(userName(mat.uploadedBy)) : ''}${mat.fileId ? ' · ☁️ Drive' : ''}</div>${mat.description ? `<div class="mat-desc">${tce(mat.description)}</div>` : ''}</div><div class="toolbar"><button class="btn btn-sm" data-act="view-material" data-mid="${m.id}" data-matid="${mat.id}" title="${t('btn_view')}">👁️</button><button class="btn btn-sm" data-act="download-material" data-mid="${m.id}" data-matid="${mat.id}" title="${t('btn_download')}">⬇️</button>${canEdit ? `<button class="btn btn-sm btn-danger" data-act="delete-material" data-mid="${m.id}" data-matid="${mat.id}" title="${t('btn_delete')}">🗑️</button>` : ''}</div></div>`).join('')}</div>` : `<div class="empty">${canEdit ? t('mat_no_materials_admin') : t('mat_no_materials_trainer')}</div>`}</div>`;
}

function renderTimetableSection(m, canEdit) {
  const entries = moduleTimetable(m.id);
  const byDate = {};
  entries.forEach(e => { if (!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); });
  const dates = Object.keys(byDate).sort();
  return `<div class="card"><div class="card-head"><div><h2>📅 ${t('tt_title')} (${entries.length})</h2><small class="muted">${t('tt_sub')}</small></div>${canEdit ? `<button class="btn btn-sm btn-primary" data-act="new-timetable" data-mid="${m.id}">${t('tt_add')}</button>` : ''}</div>${entries.length ? `<div class="timetable-list">${dates.map(date => `<div class="tt-day"><div class="tt-day-head">${fmtDateLong(date)} ${isTodayDate(date) ? `<span class="badge ok">${t('tt_today')}</span>` : ''}</div>${byDate[date].map(e => `<div class="tt-entry ${isTodayDate(e.date) ? 'today' : ''}"><div class="tt-time">${esc(e.startTime)} — ${esc(e.endTime)}</div><div class="tt-body"><div class="tt-topic">${tce(e.title)}</div>${(e.instructor || e.location) ? `<div class="tt-meta">${e.instructor ? '👤 ' + tce(e.instructor) : ''}${e.instructor && e.location ? ' · ' : ''}${e.location ? '📍 ' + tce(e.location) : ''}</div>` : ''}${e.notes ? `<div class="tt-notes">${tce(e.notes)}</div>` : ''}</div>${canEdit ? `<div class="toolbar" style="flex-wrap:nowrap"><button class="btn btn-sm" data-act="edit-timetable" data-tid="${e.id}" title="${t('btn_edit')}">✏️</button><button class="btn btn-sm btn-danger" data-act="delete-timetable" data-tid="${e.id}" title="${t('btn_delete')}">🗑️</button></div>` : ''}</div>`).join('')}</div>`).join('')}</div>` : `<div class="empty">${canEdit ? t('tt_no_entries_admin') : t('tt_no_entries')}</div>`}</div>`;
}

/* =========================================================
   VIP MODULE DETAIL (READ-ONLY)

        </tr></thead><tbody>${scores.map(({ p, s }) => `<tr>
          <td>${tce(p.name)}</td>

function moduleDetailView() {
  const m = getModule(state.params.moduleId);
  if (!m) return `<div class="card"><div class="empty">${t('msg_not_found')}</div></div>`;
  const isAdmin = state.user.role === 'admin';
  const isVip = state.user.role === 'vip';
  const isOwner = m.trainerId === state.user.id;
  const isFac = m.facilitatorId === state.user.id && !isOwner;
  const isParticipant = state.user.role === 'participant';
  if (!isAdmin && !isOwner && !isFac && !isParticipant && !isVip) return `<div class="card"><div class="empty">${t('msg_no_access')}</div></div>`;

  if (isVip) return vipModuleDetailView(m);

  const modActs = moduleActivitiesList(m.id);
  const participants = enrolledParticipants(m.id);
  const enrolled = isParticipant ? isEnrolled(m.id, state.user.id) : false;
  const canEdit = isAdmin || isOwner;
  const canEditMaterial = isAdmin || isOwner || isFac;
  const canEditTT = canManageTimetable(m.id);
  if (isParticipant) {
    if (!enrolled) return `<div class="card"><div class="card-head"><h2>${tce(m.name)}</h2><button class="btn btn-sm" data-act="nav" data-view="programs">←</button></div><p>${t('modules_no_modules_enrolled')}</p><button class="btn btn-primary" data-act="enroll-module" data-id="${m.id}">${t('modules_enroll_now')}</button></div>`;
    const myActs = modActs.filter(a => a.published);
    return `<div class="card"><div class="card-head"><div><h2>${tce(m.name)}</h2><small class="muted">${trainerFacilitatorLine(m)}</small></div><div class="toolbar"><button class="btn btn-sm" data-act="nav" data-view="programs">←</button><span class="badge ok">✓ ${t('lbl_enrolled')}</span></div></div><p>${tce(m.description || '')}</p><h3>${t('modules_activity_section')} (${myActs.length})</h3>${myActs.length ? `<div class="table-wrap"><table><thead><tr><th>${t('lbl_activity')}</th><th>${t('lbl_date')}</th><th>${t('lbl_quiz')}</th><th>${t('lbl_practical')}</th><th>${t('lbl_status')}</th><th></th></tr></thead><tbody>${myActs.map(a => { const s = scoreFor(a, state.user.id); return `<tr><td><strong>${tce(a.title)}</strong></td><td>${fmtDate(a.date)}</td><td>${quizBadge(a, state.user.id)}</td><td>${practicalBadge(a, state.user.id)}</td><td>${badgeStatus(s.overall)}</td><td><button class="btn btn-sm btn-primary" data-act="open-activity" data-id="${a.id}">${t('btn_open')}</button></td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty">${t('modules_no_activities')}</div>`}</div>${renderMaterialsSection(m, false)}${renderTimetableSection(m, canEditTT)}`;
  }
  const drafts = modActs.filter(a => !a.published);
  const finals = moduleFinalExams(m.id);
  return `<div class="card"><div class="card-head"><div><h2>${tce(m.name)} ${isFac ? `<span class="facilitator-tag">🧑‍🏫 ${t('lbl_facilitator')}</span>` : ''}</h2><small class="muted">${trainerFacilitatorLine(m)} · ${m.published ? t('lbl_active') : t('lbl_draft')}</small></div><div class="toolbar"><button class="btn btn-sm" data-act="nav" data-view="modules">←</button>${isAdmin ? `<button class="btn btn-sm" data-act="edit-module" data-id="${m.id}">✏️</button>` : ''}${canEdit ? `<button class="btn btn-sm btn-primary" data-act="new-activity" data-module="${m.id}">➕ ${t('lbl_activity')}</button>` : ''}</div></div><p>${tce(m.description || '')}</p><div class="meta-grid"><div class="meta-item"><div class="k">${t('lbl_activities')}</div><div class="v">${modActs.length}</div></div><div class="meta-item"><div class="k">${t('lbl_participants')}</div><div class="v">${participants.length}</div></div><div class="meta-item"><div class="k">📅 ${t('tt_title')}</div><div class="v">${moduleTimetable(m.id).length}</div></div><div class="meta-item"><div class="k">🎓 ${t('fe_title')}</div><div class="v">${finals.length}</div></div><div class="meta-item"><div class="k">${t('lbl_materials')}</div><div class="v">${(m.materials||[]).length}</div></div><div class="meta-item"><div class="k">${t('lbl_draft')}</div><div class="v" style="${drafts.length ? 'color:var(--warn)' : ''}">${drafts.length}</div></div></div>${drafts.length ? `<div class="info-box warn" style="margin-bottom:0"><h4>⚠️ ${t('modules_draft_warn', drafts.length)}</h4><p style="margin:4px 0 0">${t('modules_draft_hint')}</p></div>` : ''}</div>
  ${renderTimetableSection(m, canEditTT)}
  ${renderMaterialsSection(m, canEditMaterial)}
  <div class="card"><div class="card-head"><h2>${t('modules_activity_section')} (${modActs.length})</h2><div class="toolbar">${drafts.length && canEdit ? `<button class="btn btn-sm btn-primary" data-act="publish-all-module" data-id="${m.id}">${t('act_publish_all')} (${drafts.length})</button>` : ''}${canEdit ? `<button class="btn btn-sm btn-primary" data-act="new-activity" data-module="${m.id}">➕</button>` : ''}</div></div>${modActs.length ? `<div class="table-wrap"><table><thead><tr><th>${t('lbl_activity')}</th><th>${t('lbl_date')}</th><th>${t('lbl_quiz')}</th><th>${t('lbl_status')}</th><th style="width:340px">${t('lbl_actions')}</th></tr></thead><tbody>${modActs.map(a => `<tr><td><strong>${tce(a.title)}</strong></td><td>${fmtDate(a.date)}</td><td><span class="badge info">${(a.quiz||[]).length}</span> ${a.quizDuration ? `<small class="muted">⏱️ ${a.quizDuration}m</small>` : ''}</td><td>${a.published ? `<span class="badge ok">${t('lbl_published')}</span>` : `<span class="badge warn">⚠️ ${t('lbl_draft')}</span>`}</td><td><div class="toolbar"><button class="btn btn-sm" data-act="open-activity" data-id="${a.id}">${t('btn_view')}</button>${canEdit ? `<button class="btn btn-sm ${a.published ? '' : 'btn-primary'}" data-act="toggle-publish" data-id="${a.id}">${a.published ? t('btn_unpublish') : '✅ ' + t('btn_publish')}</button>` : ''}${a.quiz && a.quiz.length && a.published ? `<button class="btn btn-sm" data-act="open-quiz-tab" data-id="${a.id}" title="${t('quiz_preview')}">👁️</button>` : ''}<button class="btn btn-sm" data-act="edit-rubric-builder" data-id="${a.id}" title="${t('rb_edit')}">📏</button>${canEdit ? `<button class="btn btn-sm" data-act="edit-quiz-builder" data-id="${a.id}" title="${t('qb_title')}">🗂️</button>` : ''}</div></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">${t('modules_no_activities')}</div>`}</div>
  <div class="card"><div class="card-head"><h2>🎓 ${t('fe_title')} (${finals.length})</h2>${canEdit ? `<button class="btn btn-sm btn-primary" data-act="new-final-exam" data-module="${m.id}">➕ ${t('fe_new')}</button>` : ''}</div>${finals.length ? `<div class="table-wrap"><table><thead><tr><th>${t('lbl_title')}</th><th>${t('fe_type')}</th><th>${t('fe_open_at')}</th><th>${t('lbl_status')}</th><th></th></tr></thead><tbody>${finals.map(fe => { const w = feWindowStatus(fe); return `<tr><td><strong>${tce(fe.title)}</strong></td><td><span class="badge ${fe.type === 'theory' ? 'info' : 'ok'}">${fe.type === 'theory' ? t('fe_type_theory') : t('fe_type_practical')}</span></td><td>${fe.openAt ? fmtDT(fe.openAt) : '—'}</td><td><span class="badge ${!fe.published ? 'draft' : w.state === 'open' ? 'ok' : w.state === 'not-open' ? 'draft' : 'bad'}">${!fe.published ? t('lbl_draft') : w.state === 'open' ? t('fe_status_open') : w.state === 'not-open' ? t('fe_status_not_open') : t('fe_status_closed')}</span></td><td>${canEdit ? `<button class="btn btn-sm" data-act="edit-final-exam" data-id="${fe.id}">✏️</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty">${t('fe_no_exams')}</div>`}</div>
  <div class="card"><div class="card-head"><h2>${t('modules_participant_section')} (${participants.length})</h2>${canEdit ? `<button class="btn btn-sm btn-primary" data-act="enroll-participants-modal" data-id="${m.id}">➕ ${t('btn_enroll')}</button>` : ''}</div>${participants.length ? `<div class="table-wrap"><table><thead><tr><th>${t('lbl_name')}</th><th>${t('lbl_email')}</th><th>${t('lbl_date')}</th><th></th></tr></thead><tbody>${participants.map(({ enroll, user }) => `<tr><td><strong>${tce(user.name)}</strong></td><td>${esc(user.email)}</td><td>${fmtDate(enroll.enrolledAt)}</td><td>${canEdit ? `<button class="btn btn-sm btn-danger" data-act="unenroll-module" data-mid="${m.id}" data-pid="${user.id}">${t('btn_unenroll')}</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">${t('modules_no_participants')}</div>`}</div>`;
}

/* =========================================================
   TIMETABLE FORMS
   ========================================================= */
function openTimetableForm(mid, entryId) {
  const m = getModule(mid);
  if (!m) { toast(t('msg_not_found'), 'bad'); return; }
  if (!canManageTimetable(mid)) { toast(t('msg_no_access'), 'bad'); return; }
  const isEdit = !!entryId;
  const e = isEdit ? DB.timetables.find(x => x.id === entryId) : null;
  if (isEdit && !e) { toast(t('msg_not_found'), 'bad'); return; }
  const v = isEdit ? e : { date: todayISO(), startTime: '09:00', endTime: '10:30', title: '', instructor: userName(m.trainerId) || '', location: '', notes: '' };
  openModal(`<h2>${isEdit ? t('tt_edit') : t('tt_new')}</h2><p class="muted">${tce(m.name)}</p>
    <form data-form="timetable" data-mid="${mid}" data-tid="${isEdit ? e.id : ''}">
      <div class="grid2"><div class="field"><label>${t('tt_date')} *</label><input class="input" type="date" name="date" required value="${esc(v.date)}" /></div><div class="field"><label>${t('tt_instructor')}</label><input class="input" name="instructor" value="${esc(v.instructor || '')}" /></div><div class="field"><label>${t('tt_start')} *</label><input class="input" type="time" name="startTime" required value="${esc(v.startTime)}" /></div><div class="field"><label>${t('tt_end')} *</label><input class="input" type="time" name="endTime" required value="${esc(v.endTime)}" /></div></div>

function handleSaveTimetable(form) {
  const mid = form.dataset.mid, tid = form.dataset.tid;
  const m = getModule(mid);
  if (!m) { toast(t('msg_not_found'), 'bad'); return; }
  if (!canManageTimetable(mid)) { toast(t('msg_no_access'), 'bad'); return; }
  const date = form.date.value, startTime = form.startTime.value, endTime = form.endTime.value, title = form.title.value.trim();
  if (!date) { toast(t('tt_date_required'), 'bad'); return; }
  if (!title) { toast(t('tt_topic_required'), 'bad'); return; }
  if (endTime <= startTime) { toast(t('tt_invalid_time'), 'bad'); return; }
  const data = { moduleId: mid, date, startTime, endTime, title, instructor: form.instructor.value.trim(), location: form.location.value.trim(), notes: form.notes.value.trim(), updatedAt: nowISO() };
  if (tid) { const e = DB.timetables.find(x => x.id === tid); if (e) Object.assign(e, data); logAudit('Update Timetable', 'Jadual', tid, title); toast(t('tt_updated')); }
  else { const ne = Object.assign({ id: uid('tt'), createdBy: state.user.id, createdAt: nowISO() }, data); DB.timetables.push(ne); logAudit('Create Timetable', 'Jadual', ne.id, title); toast(t('tt_added')); }
  saveDB(); closeModal(); render();
}
function deleteTimetableEntry(tid) {
  const e = DB.timetables.find(x => x.id === tid);
  if (!e) { toast(t('msg_not_found'), 'bad'); return; }
  if (!canManageTimetable(e.moduleId)) { toast(t('msg_no_access'), 'bad'); return; }
  if (!confirm(t('tt_confirm_delete'))) return;
  DB.timetables = DB.timetables.filter(x => x.id !== tid);

}

   FINAL EXAM — MULTI-MODULE
   ========================================================= */
function finalExamsView() {
  if (state.user.role === 'participant') return participantFinalView();
  const isAdmin = state.user.role === 'admin';
  const isVip = state.user.role === 'vip';
  const allExams = (DB.finalExams || []).slice().sort((a, b) => (a.openAt || '').localeCompare(b.openAt || ''));
  let exams = allExams;
  if (!isAdmin && !isVip) {
    exams = allExams.filter(fe => feModuleIds(fe).some(mid => canTrainerAccessModule(mid)));
  }
  const getMyModuleProgress = (fe) => {
    if (isAdmin || isVip) return null;
    const mine = (fe.moduleConfigs || []).filter(mc => {
      const m = getModule(mc.moduleId);
      return m && (m.trainerId === state.user.id || m.facilitatorId === state.user.id);
    });
    if (!mine.length) return null;
    const count = mine.reduce((s, mc) => s + (mc.questions||[]).length, 0);
    const target = mine.reduce((s, mc) => s + (mc.questionCount||0), 0);
    const pending = mine.filter(mc => !mc.submitted && (mc.questionCount||0) > 0).length;
    return { count, target, pending, modules: mine.length };
  };
  return `<div class="card">
    <div class="card-head">
      <div><h2>🎓 ${t('fe_title')}</h2><small class="muted">${t('fe_sub')}</small></div>
      <div class="toolbar">
        ${isAdmin ? `<button class="btn btn-primary" data-act="new-final-exam">${t('fe_new')}</button>` : ''}
        ${isVip ? `<span class="badge info">${t('vip_read_only')}</span>` : ''}
      </div>
    </div>
    <div class="info-box" style="font-size:.82rem"><p style="margin:0">💡 ${t('fe_multi_module_hint')}</p></div>
    ${exams.length ? `<div class="table-wrap"><table><thead><tr>
      <th>${t('lbl_title')}</th>
      <th>${t('fe_modules_included')}</th>
      <th>${t('fe_type')}</th>
      <th>${t('fe_open_at')}</th>
      <th>${t('fe_preparation')}</th>
      <th>${t('lbl_status')}</th>
      <th style="width:420px">${t('lbl_actions')}</th>
    </tr></thead><tbody>${exams.map(fe => {
      const w = feWindowStatus(fe);
      const mods = fe.moduleConfigs || [];
      const submitted = feSubmittedModulesCount(fe);
      const total = mods.length;
      const qs = feTotalQuestions(fe);
      const expected = feTotalExpected(fe);
      const statusCls = !fe.published ? 'draft' : w.state === 'open' ? 'ok' : w.state === 'not-open' ? 'draft' : w.state === 'closed' ? 'bad' : 'info';
      const statusLbl = !fe.published ? '⚠️ ' + t('lbl_draft') : w.state === 'open' ? t('fe_status_open') : w.state === 'not-open' ? t('fe_status_not_open') : w.state === 'closed' ? t('fe_status_closed') : '—';
      const myProg = (!isAdmin && !isVip && fe.type === 'theory') ? getMyModuleProgress(fe) : null;
      let prepCell;
      if (fe.type === 'practical') {
        prepCell = `<span class="badge ok">✓ ${t('rb_title')}</span>`;
      } else if (myProg) {
        prepCell = `<span class="badge ${myProg.pending > 0 ? 'warn' : 'ok'}">${myProg.count} / ${myProg.target} ${t('lbl_questions')}</span>${myProg.pending > 0 ? `<br><small class="muted">📝 ${myProg.pending} ${t('fe_module_pending')}</small>` : `<br><small class="muted">✓ ${t('fe_module_submitted')}</small>`}`;
      } else {
        prepCell = `<span class="badge ${submitted === total ? 'ok' : 'warn'}">${t('fe_modules_submitted', submitted, total)}</span><br><small class="muted">${qs} / ${expected} ${t('lbl_questions')}</small>`;
      }
      const myPending = myProg ? myProg.pending : 0;
      return `<tr>
        <td><strong>${tce(fe.title)}</strong>${fe.description ? `<br><small class="muted">${tce(fe.description)}</small>` : ''}</td>
        <td><small class="muted">${tce(feModulesLabel(fe))}</small></td>
        <td><span class="badge ${fe.type === 'theory' ? 'info' : 'ok'}">${fe.type === 'theory' ? '📝 ' + t('fe_type_theory') : '📏 ' + t('fe_type_practical')}</span></td>
        <td>${fe.openAt ? fmtDT(fe.openAt) : '—'}${fe.closeAt ? `<br><small class="muted">→ ${fmtDT(fe.closeAt)}</small>` : ''}</td>
        <td>${prepCell}</td>
        <td><span class="badge ${statusCls}">${statusLbl}</span></td>
        <td><div class="toolbar">
          ${isVip ? `<button class="btn btn-sm btn-primary" data-act="vip-final-scores" data-id="${fe.id}">${t('vip_view_scores')}</button>` : ''}
          ${isAdmin ? `<button class="btn btn-sm" data-act="edit-final-exam" data-id="${fe.id}">✏️</button>` : ''}
          ${!isVip && fe.type === 'theory' && (isAdmin || (myProg && myProg.modules > 0)) ? `<button class="btn btn-sm ${(!isAdmin && myPending > 0) ? 'btn-primary' : ''}" data-act="fe-questions-overview" data-id="${fe.id}" title="${t('fe_questions')}">🗂️ ${isAdmin ? feTotalQuestions(fe) + '/' + feTotalExpected(fe) : (myProg ? myProg.count + '/' + myProg.target : '—')}${(!isAdmin && myPending > 0) ? ' 📝' : ''}</button>` : ''}

        </div></td>
      </tr>`;
    }).join('')}</tbody></table></div>` : `<div class="empty">${t('fe_no_exams')}</div>`}
  </div>`;
}

function handleSaveFinalExam(form) {
  const id = form.dataset.id;
  const type = form.type.value;
  const list = document.getElementById('moduleConfigsList');
  const rows = list ? list.querySelectorAll('[data-mc-row]') : [];
  const moduleConfigs = [];
  rows.forEach((row, i) => {
    const sel = row.querySelector(`[data-mc-select="${i}"]`);
    const cnt = row.querySelector(`[data-mc-count="${i}"]`);
    if (!sel) return;
    const moduleId = sel.value;
    const prev = (state.tempModuleConfigs || []).find(x => x.moduleId === moduleId) || {};
    const newQCount = type === 'practical' ? 0 : (cnt ? Number(cnt.value) || 0 : (prev.questionCount || 0));
    const prevQuestions = prev.questions || [];
    const isSubmitted = type === 'practical' ? true : (newQCount === 0 || prevQuestions.length >= newQCount);
    moduleConfigs.push({
      moduleId,
      questionCount: newQCount,
      questions: prevQuestions,
      submitted: isSubmitted,
      submittedAt: isSubmitted ? (prev.submittedAt || nowISO()) : null,
      submittedBy: isSubmitted ? (prev.submittedBy || state.user.id) : null
    });
  });
  if (!form.title.value.trim()) { toast(t('msg_required'), 'bad'); return; }
  if (!moduleConfigs.length) { toast(t('msg_required'), 'bad'); return; }
  if (form.openAt.value && form.closeAt.value && form.openAt.value >= form.closeAt.value) { toast(t('qb_duration_mismatch'), 'bad'); return; }
  const data = {
    title: form.title.value.trim(),
    description: form.description.value.trim(),
    type,
    moduleConfigs,
    openAt: form.openAt.value || null,
    closeAt: form.closeAt.value || null,
    duration: form.duration.value && Number(form.duration.value) > 0 ? Number(form.duration.value) : null,
    rubricId: type === 'practical' && form.rubricId ? (form.rubricId.value || null) : null,
    published: form.published.value === 'true',
    updatedAt: nowISO()
  };
  if (id) {
    const fe = getFinalExam(id);

function deleteFinalExam(id) {

  DB.finalExams = DB.finalExams.filter(x => x.id !== id);
  DB.feAttempts = (DB.feAttempts || []).filter(x => x.finalId !== id);
  DB.fePractical = (DB.fePractical || []).filter(x => x.finalId !== id);
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => !(x.type === 'final-practical' && x.finalId === id));
  saveDB(); logAudit('Delete Final Exam', 'Peperiksaan', id, fe.title); toast(t('fe_deleted')); render();

function toggleFinalPublish(id) {
  const fe = getFinalExam(id); if (!fe) return;
  if (!fe.published && fe.type === 'theory') {
    const submitted = feSubmittedModulesCount(fe);
    const total = (fe.moduleConfigs || []).length;
    const qs = feTotalQuestions(fe);
    if (submitted < total) {
      if (!confirm(t('fe_confirm_publish_incomplete', submitted, total, qs))) return;
    } else if (qs === 0) {
      if (!confirm(t('fe_confirm_publish_incomplete', submitted, total, 0))) return;
    }
  }
  if (!fe.published && fe.type === 'practical' && !fe.rubricId) {
    toast('⚠️ ' + t('grad_no_rubric'), 'bad'); return;
  }
  fe.published = !fe.published; fe.updatedAt = nowISO(); saveDB();
  logAudit(fe.published ? 'Publish Final' : 'Unpublish Final', 'Peperiksaan', id, fe.title);
  toast(fe.published ? t('fe_published') : t('fe_unpublished')); render();
}

function handleSaveFinalPractical(form) {
  const feid = form.dataset.feid, pid = form.dataset.pid;
  const fe = getFinalExam(feid); if (!fe) return;
  const rb = getRubricById(fe.rubricId);
  const rubric = rb ? (rb.criteria || []) : [];
  const scores = rubric.map((c, i) => { const sel = form.querySelector(`input[name="c${i}"]:checked`); return sel ? Number(sel.value) : 0; });
  let tw = 0, ts = 0;
  rubric.forEach((c, i) => { const mark = scores[i]; const mx = Math.max(...c.levels.map(l => l.mark)); tw += c.weight; ts += mx > 0 ? (mark / mx) * c.weight : 0; });
  const totalPct = tw > 0 ? (ts / tw) * 100 : 0;
  const remarks = form.remarks.value.trim();
  const data = { scores, total: totalPct, remarks };
  const examMids = feModuleIds(fe);
  const isFac = state.user.role === 'facilitator' || examMids.some(mid => isFacilitatorOf(mid, state.user.id));
  const shouldSubmitForApproval = state.user.role === 'facilitator' || (state.user.role === 'trainer' && isFac);
  const firstMid = examMids[0] || null;
  if (shouldSubmitForApproval) {
    let pa = (DB.pendingApprovals || []).find(x => x.type === 'final-practical' && x.finalId === feid && x.participantId === pid && x.status === 'pending');
    if (pa) { pa.data = data; pa.submittedAt = nowISO(); }
    else { if (!Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = []; DB.pendingApprovals.push({ id: uid('pa'), type: 'final-practical', moduleId: firstMid, finalId: feid, participantId: pid, data, submittedBy: state.user.id, submittedAt: nowISO(), status: 'pending', reviewedBy: null, reviewedAt: null, reviewRemarks: '' }); }
    saveDB(); logAudit('Submit Final Practical (Pending Approval)', 'Peperiksaan', `${feid}:${pid}`, `${userName(pid)}: ${totalPct.toFixed(1)}%`);
    closeModal(); toast('⏳ ' + t('pa_submitted_for_approval'), 'warn'); render(); return;
  }
  let rec = (DB.fePractical || []).find(x => x.finalId === feid && x.participantId === pid);
  if (rec) { rec.scores = scores; rec.total = totalPct; rec.remarks = remarks; rec.by = state.user.id; rec.at = nowISO(); }
  else DB.fePractical.push({ id: uid('fep'), finalId: feid, participantId: pid, scores, total: totalPct, remarks, by: state.user.id, at: nowISO() });
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => !(x.type === 'final-practical' && x.finalId === feid && x.participantId === pid && x.status === 'pending'));
  saveDB(); logAudit('Final Practical Marks', 'Peperiksaan', `${feid}:${pid}`, `${userName(pid)}: ${totalPct.toFixed(1)}%`);
  closeModal(); toast(t('pf_saved')); render();
}
