function participantPracticalEvaluationView() {
  const me = state.user;
  const modules = participantModules(me.id);
  const practicalRows = [];

  modules.forEach(mod => {
    accessibleActivities(me.id)
      .filter(act => act.moduleId === mod.id && act.published && getRubricCriteria(act).length > 0)
      .forEach(act => {
        const rubric = getRubricCriteria(act);
        const result = getPractical(act.id, me.id);
        practicalRows.push({ mod, act, rubric, result });
      });
  });

  if (!practicalRows.length) {
    return `<div class="card">
      <div class="card-head"><h2>📏 ${t('title_practical_evaluation')}</h2></div>
      <div class="empty">${currentLang === 'ms'
        ? 'Tiada Practical Test dengan rubrik penilaian untuk modul yang anda sertai pada masa ini.'
        : 'There are currently no Practical Tests with assessment rubrics in the modules you have joined.'}</div>
    </div>`;
  }

  const assessed = practicalRows.filter(r => !!r.result);
  const average = assessed.length
    ? Math.round(avg(assessed.map(r => Number(r.result.total) || 0)))
    : null;

  const cards = practicalRows.map(({ mod, act, rubric, result }) => {
    const total = result ? Math.round(Number(result.total) || 0) : null;
    const detailRows = result ? rubric.map((criterion, index) => {
      const mark = Number((result.scores || [])[index] ?? 0);
      const maxMark = Math.max(0, ...criterion.levels.map(level => Number(level.mark) || 0));
      const weighted = maxMark > 0 ? Math.round((mark / maxMark) * Number(criterion.weight || 0)) : 0;
      return `<tr>
        <td><strong>${tce(criterion.name)}</strong></td>
        <td style="text-align:center">${Number(criterion.weight) || 0}%</td>
        <td style="text-align:center">${mark}</td>
        <td style="text-align:center">${maxMark}</td>
        <td style="text-align:center"><strong>${weighted}%</strong></td>
      </tr>`;
    }).join('') : '';

    return `<article class="card participant-practical-card">
      <div class="card-head">
        <div>
          <h3 style="margin-bottom:4px">${tce(act.title)}</h3>
          <small class="muted">📦 ${tce(mod.name)} · 📅 ${fmtDate(act.date)}</small>
        </div>
        ${result
          ? `<span class="badge ${total >= 70 ? 'ok' : 'warn'}">${total}%</span>`
          : `<span class="badge draft">${currentLang === 'ms' ? 'Belum dinilai' : 'Not yet assessed'}</span>`}
      </div>
      ${act.objectives ? `<p class="muted" style="margin:0 0 13px">${tce(act.objectives)}</p>` : ''}
      <div class="toolbar" style="margin-bottom:12px">
        <span class="pill">📏 ${t('act_practical_eval')}</span>
        ${result && result.at ? `<span class="pill">🕒 ${fmtDateTime(result.at)}</span>` : ''}
      </div>
      ${result ? `
        <div class="practical-evaluation-summary">
          <div><span class="muted">${currentLang === 'ms' ? 'Jumlah markah' : 'Total score'}</span><strong>${total}%</strong></div>
          <div><span class="muted">${currentLang === 'ms' ? 'Status penilaian' : 'Evaluation status'}</span><strong>${total >= 70 ? (currentLang === 'ms' ? 'Memuaskan' : 'Satisfactory') : (currentLang === 'ms' ? 'Perlu penambahbaikan' : 'Needs improvement')}</strong></div>
        </div>
        <h4 style="margin:16px 0 9px">${currentLang === 'ms' ? 'Pecahan Penilaian Rubrik' : 'Rubric Evaluation Breakdown'}</h4>
        <div class="table-wrap"><table>
          <thead><tr>
            <th>${t('rb_col_name')}</th>
            <th style="text-align:center">${t('rb_weights')}</th>
            <th style="text-align:center">${currentLang === 'ms' ? 'Markah' : 'Marks'}</th>
            <th style="text-align:center">${currentLang === 'ms' ? 'Maksimum' : 'Maximum'}</th>
            <th style="text-align:center">${currentLang === 'ms' ? 'Sumbangan' : 'Contribution'}</th>
          </tr></thead>
          <tbody>${detailRows}
            <tr style="background:#f4f9f7">
              <td><strong>${currentLang === 'ms' ? 'Jumlah' : 'Total'}</strong></td>
              <td style="text-align:center"><strong>100%</strong></td>
              <td colspan="2" style="text-align:center">—</td>
              <td style="text-align:center"><strong>${total}%</strong></td>
            </tr>
          </tbody>
        </table></div>
        ${result.remarks ? `<div class="info-box" style="margin-top:12px"><strong>${t('lbl_remarks')}:</strong><p style="margin:4px 0 0">${tce(result.remarks)}</p></div>` : ''}
      ` : `
        <div class="info-box warn" style="margin:0">
          <p style="margin:0">${currentLang === 'ms'
            ? 'Penilaian Practical Test ini belum direkodkan oleh jurulatih.'
            : 'The trainer has not recorded this Practical Test evaluation yet.'}</p>
        </div>
        <h4 style="margin:16px 0 9px">${currentLang === 'ms' ? 'Kriteria Penilaian' : 'Assessment Criteria'}</h4>
        <div class="table-wrap"><table>
          <thead><tr><th>#</th><th>${t('rb_col_name')}</th><th>${t('rb_weights')}</th></tr></thead>
          <tbody>${rubric.map((criterion, index) => `<tr>
            <td>${index + 1}</td><td><strong>${tce(criterion.name)}</strong></td><td>${Number(criterion.weight) || 0}%</td>
          </tr>`).join('')}</tbody>
        </table></div>
      `}
    </article>`;
  }).join('');

  return `<section class="participant-practical-evaluation">
    <div class="grid grid-3" style="margin-bottom:18px">
      <div class="stat"><div class="label">${currentLang === 'ms' ? 'Jumlah Practical Test' : 'Total Practical Tests'}</div><div class="value">${practicalRows.length}</div></div>
      <div class="stat"><div class="label">${currentLang === 'ms' ? 'Telah Dinilai' : 'Evaluated'}</div><div class="value">${assessed.length}</div></div>
      <div class="stat"><div class="label">${currentLang === 'ms' ? 'Purata Markah' : 'Average Score'}</div><div class="value">${average === null ? '—' : average + '%'}</div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div><h2>📏 ${t('title_practical_evaluation')}</h2>
        <p class="muted" style="margin:5px 0 0">${currentLang === 'ms'
          ? 'Semakan keputusan dan pecahan markah Practical Test bagi setiap modul yang anda sertai.'
          : 'Review Practical Test results and rubric score breakdowns for every module you have joined.'}</p></div>
        <span class="badge info">${practicalRows.length}</span>
      </div>
      ${cards}
    </div>
  </section>`;
}

function activityDetailView() {
  const act = getActivity(state.params.activityId);
  if (!act) return `<div class="card"><div class="empty">${t('msg_not_found')}</div></div>`;
  const isParticipant = state.user.role === 'participant';
  const isAdmin = state.user.role === 'admin';
  const isVip = state.user.role === 'vip';
  const isOwner = !!getModule(act.moduleId) && moduleHasTrainer(getModule(act.moduleId), state.user.id);
  if (isVip) return vipActivityDetailView(act);
  if ((state.user.role === 'trainer' || state.user.role === 'facilitator') && !canTrainerAccessActivity(act.id)) return `<div class="card"><div class="empty">${t('msg_no_access')}</div></div>`;
  if (isParticipant) { if (!act.published) return `<div class="card"><div class="empty">${t('msg_not_published')}</div></div>`; if (!isEnrolled(act.moduleId, state.user.id)) return `<div class="card"><div class="empty">${t('msg_not_enrolled')}</div></div>`; }
  const canEdit = isAdmin || isOwner;
  const canEditRubric = ['admin','trainer','facilitator'].includes(state.user.role);
  const rubric = getRubricCriteria(act);
  const rubricObj = getRubric(act);
  const pendingRetest = isParticipant ? hasPendingRetest(act.id, state.user.id) : false;
  const attempt = isParticipant ? getAttempt(act.id, state.user.id) : null;
  const prac = isParticipant ? getPractical(act.id, state.user.id) : null;
  const mod = getModule(act.moduleId);
  let quizSection = '';
  if (act.quiz && act.quiz.length) {
    if (isParticipant) {
      const w = quizWindowStatus(act);
      if (attempt && !pendingRetest) { const rr = getRetestRequest(act.id, state.user.id); const rrPending = rr && rr.status === 'pending'; const rrStatus = rr ? (rr.status === 'pending' ? `<div class="info-box warn"><p style="margin:0">⏳ ${t('rr_pending')}</p></div>` : rr.status === 'approved' ? `<div class="info-box ok"><p style="margin:0">✅ ${t('rr_approved')}</p></div>` : `<div class="info-box warn"><p style="margin:0">✖ ${t('rr_rejected')}${rr.reviewRemarks ? ': ' + tce(rr.reviewRemarks) : ''}</p></div>`) : ''; quizSection = `<div class="card"><div class="card-head"><h2>📝 ${t('lbl_quiz')} — ${t('quiz_completed')}</h2><span class="badge ${attempt.score/attempt.total >= 0.7 ? 'ok' : 'warn'}">${attempt.score}/${attempt.total} (${Math.round(attempt.score/attempt.total*100)}%)</span></div><p class="muted">${fmtDateTime(attempt.at)}${attempt.auto ? ' · ⏱️ ' + t('quiz_auto_submitted') : ''}</p>${rrStatus}<div class="toolbar"><button class="btn btn-primary" data-act="open-quiz-tab" data-id="${act.id}">📝 ${t('quiz_view_tab')}</button>${!rrPending && !(rr && rr.status === 'approved' && hasPendingRetest(act.id,state.user.id)) ? `<button class="btn" data-act="request-retest" data-aid="${act.id}">🔄 ${t('rr_request')}</button>` : ''}</div></div>`; }

function isPracticalActivityMethod(method) {
  const m = String(method || '').toLowerCase();
  return m === 'practical test' || m.includes('praktikal') || m.includes('practical');
}
function canonicalActivityMethod(method) {
  return isPracticalActivityMethod(method) ? 'Practical Test' : 'Quiz';
}

function downloadActivityQuizTemplate() {
  if (!ensureXLSX()) return;
  const headers = ['Question','Option A','Option B','Option C','Option D','Correct Answer','Category','Difficulty'];
  const sample = ['What is the function of a pump?','Move fluid','Measure temperature','Filter gas','Store pressure','A','Fluid Mechanics','Easy'];
  const ws = XLSX.utils.aoa_to_sheet([
    ['QUIZ QUESTION TEMPLATE'],
    ['Instructions: Enter one question per row. Correct Answer must be A/B/C/D or 1/2/3/4. Delete the sample row before uploading if not needed.'],
    [], headers, sample
  ]);
  ws['!cols'] = [{wch:42},{wch:28},{wch:28},{wch:28},{wch:28},{wch:18},{wch:22},{wch:16}];
  ws['!autofilter'] = {ref:'A4:H5'};
  const guide = XLSX.utils.aoa_to_sheet([
    ['Field','Required','Instructions'],
    ['Question','Yes','Full question text. One question per row.'],
    ['Option A–D','At least 2','Provide at least two answer choices.'],
    ['Correct Answer','Yes','Use A, B, C, D or 1, 2, 3, 4.'],
    ['Category','No','Optional category/topic.'],
    ['Difficulty','No','Optional: Easy, Medium, or Hard.'],
    ['Upload','—','Save as .xlsx or .xls, then use Upload Question Template in the activity form.']
  ]);
  guide['!cols']=[{wch:22},{wch:14},{wch:88}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Quiz Questions');
  XLSX.utils.book_append_sheet(wb, guide, 'Instructions');
  XLSX.writeFile(wb, 'Quiz_Question_Template.xlsx');
}

async function importActivityQuizTemplate(file) {
  if (!ensureXLSX()) return;
  const wb = await readExcelFile(file);
  const sheetName = wb.SheetNames.find(n => /quiz|question|soalan/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:''});
  if (!rows.length) { toast('⚠️ The Excel file is empty.', 'bad'); return; }
  let headerRow = -1;
  for (let r=0; r<Math.min(rows.length, 12); r++) {
    if (getColIndex(rows[r], 'Question','Soalan') !== -1 && getColIndex(rows[r], 'Correct Answer','Answer','Jawapan','Jawapan Betul') !== -1) { headerRow=r; break; }
  }
  if (headerRow < 0) { toast('⚠️ Invalid headers. Use the Quiz_Question_Template.xlsx template.', 'bad'); return; }
  const headers=rows[headerRow];
  const iq=getColIndex(headers,'Question','Soalan'), ia=getColIndex(headers,'Option A','Pilihan A','A'), ib=getColIndex(headers,'Option B','Pilihan B','B'), ic=getColIndex(headers,'Option C','Pilihan C','C'), id=getColIndex(headers,'Option D','Pilihan D','D'), ians=getColIndex(headers,'Correct Answer','Answer','Jawapan','Jawapan Betul'), icat=getColIndex(headers,'Category','Kategori'), idiff=getColIndex(headers,'Difficulty','Tahap','Level');
  const imported=[]; const errors=[];
  for(let r=headerRow+1;r<rows.length;r++) {
    const row=rows[r]; const q=String(row[iq]||'').trim(); if(!q) continue;
    const options=[ia,ib,ic,id].map(i=>i<0?'':String(row[i]||'').trim());
    const raw=String(row[ians]||'').trim().toUpperCase();
    let answer=/^[A-D]$/.test(raw)?raw.charCodeAt(0)-65:/^[1-4]$/.test(raw)?Number(raw)-1:-1;
    if(options.filter(Boolean).length<2 || answer<0 || !options[answer]) { errors.push(r+1); continue; }
    imported.push({q,options,answer,category:icat<0?'':String(row[icat]||'').trim(),difficulty:idiff<0?'Easy':(String(row[idiff]||'Easy').trim()||'Easy')});
  }
  if(!imported.length) { toast('⚠️ No valid questions were found.'+(errors.length?' Invalid rows: '+errors.join(', '):''), 'bad'); return; }
  if(!confirm(`Found ${imported.length} valid questions. Add them to the current quiz?${errors.length?'\n\nRows skipped because answers/options were invalid: '+errors.join(', '):''}`)) return;
  state.tempQuiz = (state.tempQuiz || []).concat(imported);
  renderQuizBuilder();
  toast(`✅ Imported ${imported.length} questions${errors.length?`; skipped ${errors.length} rows`:''}.`);
}

function handleSaveActivity(form) {
  const id = form.dataset.id;
  const mod = getModule(form.moduleId.value);
  if (!mod) { toast(t('msg_module_required'), 'bad'); return; }
  const publishNow = !!(form.publishNow && form.publishNow.checked);
  const method = canonicalActivityMethod(form.method.value);
  const isPractical = method === 'Practical Test';
  const rubricId = isPractical && form.rubricId && form.rubricId.value ? form.rubricId.value : null;
  const quizOpenAt = !isPractical && form.quizOpenAt ? (form.quizOpenAt.value || null) : null;
  const quizCloseAt = !isPractical && form.quizCloseAt ? (form.quizCloseAt.value || null) : null;
  const practicalOpenAt = isPractical && form.practicalOpenAt ? (form.practicalOpenAt.value || null) : null;
  const practicalCloseAt = isPractical && form.practicalCloseAt ? (form.practicalCloseAt.value || null) : null;
  if ((quizOpenAt && quizCloseAt && quizOpenAt >= quizCloseAt) || (practicalOpenAt && practicalCloseAt && practicalOpenAt >= practicalCloseAt)) { toast('⚠️ ' + t('schedule_invalid'), 'bad'); return; }
  const quizDuration = !isPractical && form.quizDuration && Number(form.quizDuration.value) > 0 ? Number(form.quizDuration.value) : null;

async function handleUploadMaterial(form) {
  const mid = form.dataset.mid;
  const file = state.pendingFile;
  if (!file) { toast(t('mat_upload_no_file'), 'bad'); return; }
  if (file.size > MAX_FILE_SIZE) { toast(t('mat_upload_too_big', formatFileSize(file.size), formatFileSize(MAX_FILE_SIZE)), 'bad'); return; }
  const m = getModule(mid);
  if (!m) { toast(t('msg_not_found'), 'bad'); return; }
  const progressEl = document.getElementById('uploadProgress');
  const progressBar = document.getElementById('uploadProgressBar');
  if (progressEl) progressEl.style.display = 'block';
  if (progressBar) progressBar.style.width = '0%';
  startUploadMonitor(file.name, file.size);
  try {
    const base64 = await fileToBase64(file, pct => {
      if (progressBar) progressBar.style.width = pct + '%';
      updateTransferMonitor('upload', pct, `${file.name} · ${t('transfer_preparing')}`, true, false);
    });
    if (progressBar) progressBar.style.width = '50%';
    updateTransferMonitor('upload', 50, `${file.name} · ${t('transfer_sending')}`, true, true);
    const res = await driveAPI('uploadModuleMaterial', { payload: { moduleId: mid, moduleName: m.name, filename: file.name, mimeType: file.type || 'application/octet-stream', base64, description: (form.description ? form.description.value : '').trim() } });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Upload failed');
    if (progressBar) progressBar.style.width = '90%';
    updateTransferMonitor('upload', 95, `${file.name} · ${t('transfer_verifying')}`, true, true);
    const displayName = (form.displayName.value || '').trim() || file.name;
    const mat = { id: uid('mat'), fileId: res.file.id, name: displayName, originalName: file.name, type: fileTypeFromName(file.name), mime: res.file.mimeType, size: res.file.size, downloadUrl: res.file.downloadUrl, viewUrl: res.file.viewUrl, previewUrl: res.file.previewUrl, folderId: res.file.folderId, folderUrl: res.file.folderUrl, description: (form.description ? form.description.value : '').trim(), uploadedBy: state.user.id, uploadedAt: nowISO() };
    if (!Array.isArray(m.materials)) m.materials = [];
    m.materials.push(mat);
    m.updatedAt = nowISO();
    saveDB();
    logAudit('Upload Material', 'Modul', mid, `${displayName} (${formatFileSize(file.size)})`);
    if (progressBar) progressBar.style.width = '100%';
    state.pendingFile = null; closeModal(); toast('✅ ' + t('mat_upload_success')); render();
    finishUploadMonitor(true, `${file.name} · ${t('transfer_complete')}`);
  } catch (err) {
    console.error('Upload error:', err);
    finishUploadMonitor(false, `${file.name} · ${err.message || t('transfer_failed')}`);
    if (progressEl) progressEl.style.display = 'none';
    toast('❌ ' + (err.message || t('mat_upload_fail')), 'bad');
  }
}
function viewMaterial(mid, matid) {
  const mat = findMaterial(mid, matid);
  if (!mat) { toast(t('msg_not_found'), 'bad'); return; }
  if (mat.fileId) { const url = mat.previewUrl || ('https://drive.google.com/file/d/' + mat.fileId + '/preview'); const w = window.open(url, '_blank'); if (!w) toast('⚠️ ' + t('mat_popup_blocked'), 'bad'); return; }
  try {
    if (mat.type === 'pdf' || mat.type === 'image') { const blob = base64ToBlob(mat.dataUrl); const url = URL.createObjectURL(blob); const w = window.open(url, '_blank'); if (!w) { URL.revokeObjectURL(url); toast('⚠️ ' + t('mat_popup_blocked'), 'bad'); return; } setTimeout(() => URL.revokeObjectURL(url), 60000); }
    else if (mat.type === 'word' || mat.type === 'powerpoint' || mat.type === 'excel') { downloadMaterial(mid, matid); toast(t('mat_word_hint'), 'ok'); }
    else downloadMaterial(mid, matid);
  } catch(e) { console.error(e); toast(t('mat_view_fail'), 'bad'); }
}
async function downloadMaterial(mid, matid) {
  const mat = findMaterial(mid, matid);
  if (!mat) { toast(t('msg_not_found'), 'bad'); return; }
  const filename = mat.originalName || mat.name;
  if (mat.downloadUrl) {
    const ok = await downloadWithProgress(mat.downloadUrl, filename, { entity: 'Modul', entityId: mid, details: mat.name });
    if (ok) logAudit('Download Material', 'Modul', mid, mat.name);
    return;
  }
  try {
    const blob = base64ToBlob(mat.dataUrl);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    logAudit('Download Material', 'Modul', mid, mat.name);
  } catch(e) { console.error(e); toast(t('mat_download_fail'), 'bad'); }
}
async function deleteMaterial(mid, matid) {
  const m = getModule(mid); if (!m) return;
  const mat = (m.materials||[]).find(x => x.id === matid); if (!mat) return;
  if (!confirm(t('confirm_delete_material', mat.name))) return;
  if (mat.fileId) { try { await driveAPI('deleteFile', { fileId: mat.fileId }); } catch (e) { console.warn('Drive delete failed:', e); } }
  m.materials = m.materials.filter(x => x.id !== matid);
  m.updatedAt = nowISO(); saveDB(); logAudit('Delete Material', 'Modul', mid, mat.name); toast(t('msg_deleted')); render();
}

function handleSaveRubricConfig(assignToActivityId) {
  if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); return; }
  if (!state.tempRubric) { toast(t('msg_required'), 'bad'); return; }

  const nameEl = document.getElementById('rubricName');
  const descEl = document.getElementById('rubricDesc');
  const typedName = nameEl ? nameEl.value.trim() : '';
  const typedDesc = descEl ? descEl.value.trim() : '';

  const desc = currentLang === 'en' ? (state.tempRubricMeta?.description || typedDesc) : typedDesc;
  const name_en = currentLang === 'en' ? typedName : (state.tempRubricMeta?.name_en || '');
  const description_en = currentLang === 'en' ? typedDesc : (state.tempRubricMeta?.description_en || '');
  if (!name) { toast(t('rb_name_required'), 'bad'); return; }
  const isFac = state.user.role === 'facilitator';
  const newStatus = isFac ? 'pending' : 'approved';
  const reviewerId = isFac ? null : state.user.id;
  const reviewedAt = isFac ? null : nowISO();
  let rubricId = state.editingRubricId;
  if (rubricId) {
    const rb = DB.rubrics.find(r => r.id === rubricId);
    if (!rb) { toast(t('msg_not_found'), 'bad'); return; }
    if (state.user.role === 'facilitator' && rb.createdBy !== state.user.id) { toast(t('rb_own_only_edit'), 'bad'); return; }
    rb.name = name; rb.name_en = name_en; rb.description = desc; rb.description_en = description_en; rb.criteria = JSON.parse(JSON.stringify(state.tempRubric));
    rb.updatedAt = nowISO(); rb.approvalStatus = newStatus; rb.reviewedBy = reviewerId; rb.reviewedAt = reviewedAt;
    if (isFac) rb.reviewRemarks = '';
    logAudit('Update Rubric', 'Rubrik', rubricId, name + (isFac ? ' (pending)' : ''));
  } else {
    const nr = { id: uid('rb'), name, name_en, description: desc, description_en, criteria: JSON.parse(JSON.stringify(state.tempRubric)), createdBy: state.user.id, createdAt: nowISO(), updatedAt: nowISO(), approvalStatus: newStatus, reviewedBy: reviewerId, reviewedAt, reviewRemarks: '' };

function approveRubric(rubricId) {

function rejectRubric(rubricId, reason) {

  const rb = DB.rubrics.find(r => r.id === rubricId); if (!rb) return;

function deleteRubric(id) {
  if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); return; }
  const rb = DB.rubrics.find(r => r.id === id); if (!rb) return;
  if (state.user.role === 'facilitator') { if (rb.createdBy !== state.user.id) { toast(t('rb_cannot_edit'), 'bad'); return; } if (rb.approvalStatus === 'approved') { toast(t('rb_cannot_edit'), 'bad'); return; } }
  const used = DB.activities.filter(a => a.rubricId === id);
  if (used.length) { if (!confirm(t('confirm_delete_rubric', rb.name) + `\n\n(${used.length} activities)`)) return; used.forEach(a => { a.rubricId = null; }); }
  else { if (!confirm(t('confirm_delete_rubric', rb.name))) return; }
  DB.rubrics = DB.rubrics.filter(x => x.id !== id);
  saveDB(); logAudit('Delete Rubric', 'Rubrik', id, rb.name); toast(t('msg_deleted')); render();
}

/* =========================================================

   - One printable rubric per participant (or print the whole cohort).
   - Excel template contains every enrolled participant and criterion columns.
   - Upload matches by immutable Participant ID, never by display name.

function practicalAssessmentContext(aid) {
  const act = getActivity(aid);
  if (!act || !isPracticalActivityMethod(act.method)) throw new Error('Aktiviti praktikal tidak ditemui.');
  if (!['admin','trainer','facilitator'].includes(state.user.role) || (state.user.role !== 'admin' && !canTrainerAccessActivity(aid))) throw new Error(t('msg_no_access'));
  const rb = getRubric(act);
  const criteria = getRubricCriteria(act);
  if (!rb || rb.approvalStatus !== 'approved' || !criteria.length) throw new Error('Rubrik yang diluluskan diperlukan sebelum penilaian.');
  const participants = enrolledParticipants(act.moduleId).map(x => x.user).filter(Boolean).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return { act, rb, criteria, participants };
}

      const levels = (c.levels||[]).slice().sort((a,b)=>Number(b.mark)-Number(a.mark));

    }).join('');
    return `<section class="rubric-page"><header><div class="brand">CFTP TRAINING MANAGEMENT</div><h1>PRACTICAL ASSESSMENT RUBRIC</h1><h2>${esc(act.title)}</h2><p>${esc(moduleName(act.moduleId))} · ${esc(rb.name)}</p></header><div class="participant"><div><small>PARTICIPANT NAME</small><b>${esc(p.name||'')}</b></div><div><small>PARTICIPANT ID</small><b>${esc(p.id)}</b></div><div><small>ORGANISATION</small><b>${esc(p.org||'—')}</b></div><div><small>DATE</small><b>________________</b></div></div><table><thead><tr><th style="width:23%">ASSESSMENT CRITERION</th><th>PERFORMANCE LEVEL / DESCRIPTOR</th><th style="width:12%">MARK</th></tr></thead><tbody>${rows}</tbody></table><div class="total"><span>OVERALL MARK</span><b>${existing ? Number(existing.total).toFixed(1)+'%' : '__________ %'}</b></div><div class="remarks"><b>TRAINER / FACILITATOR REMARKS</b><div>${existing && existing.remarks ? esc(existing.remarks) : ''}</div></div><div class="signatures"><div>_________________________<br>Trainer / Facilitator</div><div>_________________________<br>Participant</div></div><footer>Printed on ${esc(new Date().toLocaleString())} · Page ${idx+1} of ${cohort.length}</footer></section>`;

function downloadPracticalMarksTemplate(aid) {

    const headers=['Participant ID','Participant Name','Organisation',...criteria.map(c=>String(c.name||'Criterion').trim()),'Remarks'];
    const rows=participants.map(p=>[p.id,p.name||'',p.org||'',...criteria.map((c,i)=>{const pr=getPractical(aid,p.id);return pr&&pr.scores&&pr.scores[i]!==undefined?pr.scores[i]:'';}),getPractical(aid,p.id)?.remarks||'']);

    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:5,c:0},e:{r:5+rows.length,c:headers.length-1}})};

async function importPracticalMarksExcel(file,aid) {
  if (!ensureXLSX()) return;
  const ctx=practicalAssessmentContext(aid);
  const wb=await readExcelFile(file);
  const ws=wb.Sheets['Practical Marks']||wb.Sheets[wb.SheetNames[0]];
  if (!ws) throw new Error('Sheet Practical Marks tidak ditemui.');
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  const headerRow=data.findIndex(r=>String(r[0]||'').trim().toLowerCase()==='participant id');
  if(headerRow<0) throw new Error('Lajur Participant ID tidak ditemui. Gunakan template yang dimuat turun.');
  const headers=data[headerRow].map(v=>String(v||'').trim());
  const idCol=headers.findIndex(h=>h.toLowerCase()==='participant id');
  const nameCol=headers.findIndex(h=>h.toLowerCase()==='participant name');
  const remarksCol=headers.findIndex(h=>h.toLowerCase()==='remarks');
  const criterionCols=ctx.criteria.map(c=>headers.findIndex(h=>h===String(c.name||'').trim()));
  if(criterionCols.some(i=>i<0)) throw new Error('Nama lajur kriteria tidak sepadan dengan rubrik semasa. Muat turun template baharu.');
  const allowed=new Map(ctx.participants.map(p=>[String(p.id),p]));
  const seen=new Set(), parsed=[], errors=[]; let incompleteRows=0;
  for(let ri=headerRow+1;ri<data.length;ri++){
    const row=data[ri]||[]; const pid=String(row[idCol]||'').trim();
    if(!pid) continue;
    if(!allowed.has(pid)){errors.push(`Baris ${ri+1}: Participant ID ${pid} tidak berdaftar dalam aktiviti ini.`);continue;}
    if(seen.has(pid)){errors.push(`Baris ${ri+1}: Participant ID ${pid} berulang.`);continue;} seen.add(pid);
    const scores=[];
    ctx.criteria.forEach((c,ci)=>{
      const raw=row[criterionCols[ci]];
      if(raw===''||raw===null||raw===undefined){scores.push(null);return;}
      const mark=Number(raw); const valid=(c.levels||[]).some(l=>Number(l.mark)===mark);
      if(!Number.isFinite(mark)||!valid){errors.push(`Baris ${ri+1}: markah ${c.name} (${raw}) bukan markah tahap rubrik yang sah.`);scores.push(null);return;}
      scores.push(mark);
    });
    if(scores.some(x=>x===null)){incompleteRows++;continue;}
    let weighted=0,totalWeight=0;
    ctx.criteria.forEach((c,i)=>{const max=Math.max(...(c.levels||[]).map(l=>Number(l.mark)||0));totalWeight+=Number(c.weight)||0;weighted+=max>0?(scores[i]/max)*(Number(c.weight)||0):0;});
    const total=totalWeight>0?(weighted/totalWeight)*100:0;
    parsed.push({pid,scores,total,remarks:remarksCol>=0?String(row[remarksCol]||'').trim():''});
  }
  if(errors.length){const preview=errors.slice(0,8).join('\n');throw new Error(`Import dibatalkan kerana ${errors.length} isu:\n${preview}${errors.length>8?'\n… dan isu lain.':''}`);}
  if(!parsed.length) throw new Error('Tiada baris markah yang boleh diimport.');
  const shouldSubmit=state.user.role==='facilitator'||(state.user.role!=='admin'&&isFacilitatorOf(ctx.act.moduleId,state.user.id));
  parsed.forEach(item=>{
    const payload={scores:item.scores,total:item.total,remarks:item.remarks};
    if(shouldSubmit){
      if(!Array.isArray(DB.pendingApprovals)) DB.pendingApprovals=[];
      let pa=DB.pendingApprovals.find(x=>x.type==='practical'&&x.activityId===aid&&x.participantId===item.pid&&x.status==='pending');
      if(pa){pa.data=payload;pa.submittedAt=nowISO();}
      else DB.pendingApprovals.push({id:uid('pa'),type:'practical',moduleId:ctx.act.moduleId,activityId:aid,participantId:item.pid,data:payload,submittedBy:state.user.id,submittedAt:nowISO(),status:'pending',reviewedBy:null,reviewedAt:null,reviewRemarks:''});
    } else {
      let rec=DB.practical.find(x=>x.activityId===aid&&x.participantId===item.pid);
      if(rec){rec.scores=item.scores;rec.total=item.total;rec.remarks=item.remarks;rec.by=state.user.id;rec.at=nowISO();}
      else DB.practical.push({id:uid('pr'),activityId:aid,participantId:item.pid,scores:item.scores,total:item.total,remarks:item.remarks,by:state.user.id,at:nowISO()});
      if(Array.isArray(DB.pendingApprovals)) DB.pendingApprovals=DB.pendingApprovals.filter(x=>!(x.type==='practical'&&x.activityId===aid&&x.participantId===item.pid&&x.status==='pending'));
    }
    logAudit(shouldSubmit?'Bulk Practical Submitted (Pending Approval)':'Bulk Practical Marks Import','Penilaian',`${aid}:${item.pid}`,`${userName(item.pid)}: ${item.total.toFixed(1)}%`);
  });
  saveDB();
  toast((shouldSubmit?`${parsed.length} rekod dihantar untuk kelulusan trainer.`:`${parsed.length} rekod markah berjaya diimport.`)+(incompleteRows?` ${incompleteRows} peserta belum lengkap dan tidak diimport.`:''));
  render();
}

function handleSavePractical(form) {
  const aid = form.dataset.aid, pid = form.dataset.pid;
  const act = getActivity(aid); const rubric = getRubricCriteria(act);
  const scores = rubric.map((c, i) => { const sel = form.querySelector(`input[name="c${i}"]:checked`); return sel ? Number(sel.value) : 0; });
  let tw = 0, ts = 0;
  rubric.forEach((c, i) => { const mark = scores[i]; const mx = Math.max(...c.levels.map(l => l.mark)); tw += c.weight; ts += mx > 0 ? (mark / mx) * c.weight : 0; });
  const totalPct = tw > 0 ? (ts / tw) * 100 : 0;
  const remarks = form.remarks.value.trim();
  const data = { scores, total: totalPct, remarks };
  const shouldSubmitForApproval = state.user.role === 'facilitator' || (state.user.role !== 'admin' && isFacilitatorOf(act.moduleId, state.user.id));

    closeModal(); render();
    saveCritical('⏳ ' + t('pa_submitted_for_approval'), 'warn');
    return;
  }
  let rec = DB.practical.find(x => x.activityId === aid && x.participantId === pid);
  if (rec) { rec.scores = scores; rec.total = totalPct; rec.remarks = remarks; rec.by = state.user.id; rec.at = nowISO(); }
  else DB.practical.push({ id: uid('pr'), activityId: aid, participantId: pid, scores, total: totalPct, remarks, by: state.user.id, at: nowISO() });
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => !(x.type === 'practical' && x.activityId === aid && x.participantId === pid && x.status === 'pending'));
  saveDB(); logAudit('Rubric Marks', 'Penilaian', `${aid}:${pid}`, `${userName(pid)}: ${totalPct.toFixed(1)}%`);
  closeModal(); render();
  saveCritical(t('pf_saved'));
}

function overallSpiderDataset(moduleScope, participantScope) {
  const modules = (moduleScope || sortModules(DB.modules)).slice();
  const participants = (participantScope || allParticipants()).filter(p => p && p.role === 'participant' && p.status === 'approved');
  return modules.map(mod => {
    const enrolled = participants.filter(p => isEnrolled(mod.id, p.id));
    const acts = moduleActivitiesList(mod.id).filter(a => a.published);
    const perParticipant = [];
    enrolled.forEach(p => {
      const vals = [];
      acts.forEach(act => {
        const criteria = getRubricCriteria(act);
        if (!criteria.length) return;
        const practical = getPractical(act.id, p.id);
        criteria.forEach((criterion, ci) => {
          const raw = practical && Array.isArray(practical.scores) && practical.scores[ci] !== undefined ? Number(practical.scores[ci]) : NaN;
          const max = Math.max(0, ...(criterion.levels || []).map(level => Number(level.mark) || 0));
          if (Number.isFinite(raw) && max > 0) vals.push(Math.max(0, Math.min(100, raw / max * 100)));
        });
      });
      if (vals.length) perParticipant.push({ id:p.id, name:p.name, score:avg(vals), criteriaCount:vals.length });
    });
    return { id:mod.id, name:mod.name, enrolled:enrolled.length, assessed:perParticipant.length,
      value:perParticipant.length ? avg(perParticipant.map(x => x.score)) : null, participants:perParticipant };
  }).filter(m => moduleActivitiesList(m.id).some(a => a.published && getRubricCriteria(a).length));
}
function renderOverallSpider(moduleScope, participantScope, printMode=false) {
  const rows = overallSpiderDataset(moduleScope, participantScope);
  if (!rows.length) return `<div class="empty">${currentLang === 'en' ? 'No published practical assessment rubric criteria found for the selected modules.' : 'Tiada kriteria rubrik penilaian praktikal yang telah diterbitkan bagi modul yang dipilih.'}</div>`;
  const W=760,H=560,cx=380,cy=245,R=165,n=rows.length;
  const point=(i,v)=>{const a=-Math.PI/2+2*Math.PI*i/n,r=R*(Math.max(0,Math.min(100,v||0))/100);return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a),a};};
  const grid=[20,40,60,80,100].map(v=>`<polygon points="${rows.map((_,i)=>{const q=point(i,v);return `${q.x.toFixed(1)},${q.y.toFixed(1)}`}).join(' ')}" fill="none" stroke="#d8e4de"/>`).join('');
  const spokes=rows.map((_,i)=>{const q=point(i,100);return `<line x1="${cx}" y1="${cy}" x2="${q.x}" y2="${q.y}" stroke="#d8e4de"/>`}).join('');
  const ticks=[20,40,60,80,100].map(v=>`<text x="${cx+5}" y="${cy-R*v/100+3}" font-size="10" fill="#77877f">${v}</text>`).join('');
  const scored=rows.map((r,i)=>({...r,i,p:r.value===null?null:point(i,r.value)}));
  const polygon=scored.every(x=>x.p) && n>=3 ? `<polygon points="${scored.map(x=>`${x.p.x},${x.p.y}`).join(' ')}" fill="rgba(11,107,83,.18)" stroke="#0b6b53" stroke-width="3"/>` : scored.slice(0,-1).map((x,i)=>{const y=scored[i+1];return x.p&&y.p?`<line x1="${x.p.x}" y1="${x.p.y}" x2="${y.p.x}" y2="${y.p.y}" stroke="#0b6b53" stroke-width="3"/>`:''}).join('');
  const markers=scored.map(x=>x.p?`<circle cx="${x.p.x}" cy="${x.p.y}" r="6" fill="#0b6b53" stroke="white" stroke-width="2"><title>${esc(x.name)}: ${x.value.toFixed(1)}%</title></circle>`:`<circle cx="${point(x.i,100).x}" cy="${point(x.i,100).y}" r="5" fill="white" stroke="#9aa9a1"><title>${esc(x.name)}: ${currentLang==='en'?'No scores':'Tiada skor'}</title></circle>`).join('');
  const labels=scored.map(x=>{const q=point(x.i,119);const anchor=Math.abs(Math.cos(q.a))<.25?'middle':Math.cos(q.a)>0?'start':'end';const label=x.name.length>34?x.name.slice(0,31)+'…':x.name;return `<text x="${q.x}" y="${q.y}" text-anchor="${anchor}" dominant-baseline="middle" font-size="${n>10?10:12}" fill="#34483f"><title>${esc(x.name)}</title>${esc(label)}</text>`}).join('');
  const table=rows.map(r=>`<tr><td>${tce(r.name)}</td><td>${r.enrolled}</td><td>${r.assessed}</td><td>${r.value===null?'—':r.value.toFixed(1)+'%'}</td></tr>`).join('');
  const assessedValues=rows.filter(r=>r.value!==null).map(r=>r.value);
  const overall=assessedValues.length?avg(assessedValues):null;
  return `<div class="overall-spider-block"><div class="overall-spider-summary"><div><small>${currentLang==='en'?'Modules included':'Jumlah modul'}</small><strong>${rows.length}</strong></div><div><small>${currentLang==='en'?'Participants included':'Jumlah peserta'}</small><strong>${new Set(rows.flatMap(r=>r.participants.map(p=>p.id))).size}</strong></div><div><small>${currentLang==='en'?'Overall cohort average':'Purata keseluruhan peserta'}</small><strong>${overall===null?'—':overall.toFixed(1)+'%'}</strong></div></div><div class="overall-spider-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Overall cohort spider web">${grid}${spokes}${ticks}${polygon}${markers}${labels}</svg><div class="spider-legend"><span class="spider-legend-dot"></span>${currentLang==='en'?'Average Practical Assessment score across assessed participants (%)':'Purata skor Penilaian Praktikal bagi peserta yang telah dinilai (%)'}</div></div><div class="table-wrap"><table><thead><tr><th>${currentLang==='en'?'Module / Training Day':'Modul / Hari Latihan'}</th><th>${currentLang==='en'?'Enrolled':'Berdaftar'}</th><th>${currentLang==='en'?'Assessed':'Dinilai'}</th><th>${currentLang==='en'?'Average score':'Purata skor'}</th></tr></thead><tbody>${table}</tbody></table></div><p class="muted" style="font-size:10px">${currentLang==='en'?'Each axis represents one module/day. The value is the average of each assessed participant’s normalised rubric-criterion scores in that module. Unassessed participants are excluded from that module average.':'Setiap paksi mewakili satu modul/hari. Nilai ialah purata skor kriteria rubrik yang dinormalkan bagi peserta yang telah dinilai dalam modul tersebut. Peserta yang belum dinilai tidak dimasukkan dalam purata modul berkenaan.'}</p></div>`;
}

  const date=new Date().toLocaleString(locale(),{dateStyle:'long',timeStyle:'short'});

function printSystemBookPDF() {
  if (!state.user || state.user.role !== 'admin') {
    toast(t('msg_no_access'), 'bad');
    return;
  }

  const en = currentLang === 'en';
  const L = (ms, english) => en ? english : ms;
  const escBook = value => esc(value == null || value === '' ? '—' : String(value));
  const safeObject = (value, keyName = '') => {
    const blocked = /password|passwd|secret|token|authorization|api.?key|base64|dataurl|binary|blob|rawdata|filecontent|icnumber|identitynumber/i;
    if (blocked.test(keyName)) return '[REDACTED]';
    if (value == null || typeof value === 'boolean' || typeof value === 'number') return value;
    if (typeof value === 'string') {
      if (/^(data:|blob:)/i.test(value)) return '[FILE DATA OMITTED]';
      return value.length > 1200 ? value.slice(0, 1200) + ' … [truncated]' : value;
    }
    if (Array.isArray(value)) return value.map(v => safeObject(v, keyName));
    if (typeof value === 'object') {
      const out = {};
      Object.keys(value).forEach(k => { if (!blocked.test(k)) out[k] = safeObject(value[k], k); });
      return out;
    }
    return String(value);
  };
  const fmtValue = value => {
    const cleaned = safeObject(value);
    if (cleaned == null || cleaned === '') return '—';
    if (typeof cleaned === 'object') return JSON.stringify(cleaned, null, 2);
    return String(cleaned);
  };
  const fieldLabel = key => String(key)
    .replace(/([A-Z])/g, ' $1')
    .replace(/[_-]/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());

  const sections = [];
  const addSection = (id, title, description, records, emptyText) => {
    const list = Array.isArray(records) ? records : [];
    const rows = list.length ? list.map((record, index) => {
      const obj = safeObject(record);
      const fields = obj && typeof obj === 'object' && !Array.isArray(obj)
        ? Object.entries(obj).filter(([k]) => !/password|passwd|secret|token|authorization|api.?key|base64|dataurl|binary|blob|rawdata|filecontent|icnumber|identitynumber/i.test(k))
        : [['Value', obj]];
      return `<article class="record"><h3>${index + 1}. ${escBook(record && (record.name || record.title || record.label || record.id) || L('Rekod', 'Record'))}</h3><table><tbody>${fields.map(([k,v]) => `<tr><th>${escBook(fieldLabel(k))}</th><td><pre>${escBook(fmtValue(v))}</pre></td></tr>`).join('')}</tbody></table></article>`;
    }).join('') : `<p class="empty">${escBook(emptyText || L('Tiada rekod tersedia.', 'No records available.'))}</p>`;
    sections.push({ id, title, count: list.length, html: `<section class="book-section" id="sec-${id}"><h2>${escBook(title)} <small>(${list.length})</small></h2>${description ? `<p class="section-desc">${escBook(description)}</p>` : ''}${rows}</section>` });
  };

  const modules = sortModules(DB.modules || []);
  const activities = sortActs(DB.activities || []);
  const users = (DB.users || []).map(u => ({
    id:u.id, name:u.name, username:u.username, email:u.email, role:roleLabel(u.role),
    status:u.status, organisation:u.org, createdAt:u.createdAt
  }));

  // Front matter and module-by-module content.
  const moduleRecords = modules.map(m => ({
    id:m.id, name:m.name, description:m.description, trainer:moduleTrainerNames(m),
    facilitator:moduleFacilitatorNames(m) || '—',

// Find duplicate questions within the same module using normalized question text.
// When removing duplicates, keep one record per group (prefer a question already used by a quiz).
function normalizeBankQuestionText(value) {
  return String(value || '')
    .normalize('NFKC')
    .toLocaleLowerCase()
    .replace(/[’‘]/g, "'")
    .replace(/[“”]/g, '"')
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}
function findDuplicateBankQuestionGroups() {
  const visibleModuleIds = state.user.role === 'admin'
    ? DB.modules.map(m => m.id)
    : myModules().map(m => m.id);
  const moduleFilter = state.params.bankModule || '';
  const visibleQuestions = (DB.questionBank || []).filter(q =>
    visibleModuleIds.includes(q.moduleId) && (!moduleFilter || q.moduleId === moduleFilter)
  );
  const groups = new Map();
  visibleQuestions.forEach(q => {
    const keyText = normalizeBankQuestionText(q.q);
    if (!keyText) return;
    const key = `${q.moduleId}::${keyText}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(q);
  });
  return [...groups.values()].filter(group => group.length > 1);
}
function checkDuplicateBankQuestions() {
  const groups = findDuplicateBankQuestionGroups();
  if (!groups.length) {
    alert('No duplicate questions found in the selected scope.\n\nDuplicate checking is based on matching question text within the same module.');
    return;
  }
  const totalDuplicates = groups.reduce((n, group) => n + group.length - 1, 0);
  const summary = groups.slice(0, 12).map((group, i) =>
    `${i + 1}. ${moduleName(group[0].moduleId)} — ${group[0].q} (${group.length} copies)`
  ).join('\n');
  const more = groups.length > 12 ? `\n…plus ${groups.length - 12} more duplicate group(s).` : '';
  const promptText = `Found ${groups.length} duplicate group(s), with ${totalDuplicates} extra question record(s).\n\n${summary}${more}\n\nRemove duplicates and keep ONE question per group?\n\nThe system will keep the record already used most often by quizzes; if usage is tied, it keeps the oldest record. This action cannot be automatically undone.`;
  if (!confirm(promptText)) return;

  let removed = 0;
  const removedIds = [];
  groups.forEach(group => {
    const ranked = [...group].sort((a, b) => {
      const useA = (DB.activities || []).reduce((n, act) => n + (act.quiz || []).filter(x => x.sourceBankId === a.id).length, 0);
      const useB = (DB.activities || []).reduce((n, act) => n + (act.quiz || []).filter(x => x.sourceBankId === b.id).length, 0);
      if (useA !== useB) return useB - useA;
      return new Date(a.createdAt || 0) - new Date(b.createdAt || 0);
    });
    ranked.slice(1).forEach(q => { removedIds.push(q.id); removed++; });
  });
  if (!removed) { toast('No duplicate questions were removed.'); return; }
  DB.questionBank = (DB.questionBank || []).filter(q => !removedIds.includes(q.id));
  saveDB();
  logAudit('Remove Duplicate Bank Questions', 'Question Bank', removedIds.join(','), `${removed} duplicate question record(s) removed; ${groups.length} group(s) checked`);
  alert(`Duplicate cleanup complete.\n\nRemoved ${removed} duplicate record(s).\nKept one question in each of ${groups.length} duplicate group(s).`);
  render();
}

async function handleUploadCertificate(form) {
  const pid = form.dataset.pid;
  const file = state.pendingFile;
  if (!file) { toast(t('mat_upload_no_file'), 'bad'); return; }
  if (fileTypeFromName(file.name) !== 'pdf') { toast(t('sijil_only_pdf'), 'bad'); return; }
  if (file.size > MAX_CERT_SIZE) { toast(t('mat_upload_too_big', formatFileSize(file.size), formatFileSize(MAX_CERT_SIZE)), 'bad'); return; }
  const p = DB.users.find(u => u.id === pid);
  if (!p) { toast(t('msg_not_found'), 'bad'); return; }
  startUploadMonitor(file.name, file.size);
  try {
    const base64 = await fileToBase64(file, pct => {
      updateTransferMonitor('upload', pct, `${file.name} · ${t('transfer_preparing')}`, true, false);
    });
    updateTransferMonitor('upload', 50, `${file.name} · ${t('transfer_sending')}`, true, true);
    const res = await driveAPI('uploadCertificate', { payload: { participantId: pid, participantName: p.name, filename: file.name, mimeType: 'application/pdf', base64, description: (form.description ? form.description.value : '').trim() } });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Upload failed');
    const displayName = (form.displayName.value || '').trim() || res.file.name;
    const cert = { id: uid('cert'), participantId: pid, fileId: res.file.id, name: displayName, originalName: res.file.name, type: 'pdf', mime: 'application/pdf', size: res.file.size, downloadUrl: res.file.downloadUrl, viewUrl: res.file.viewUrl, previewUrl: res.file.previewUrl, folderId: res.file.folderId, folderUrl: res.file.folderUrl, description: (form.description ? form.description.value : '').trim(), uploadedBy: state.user.id, uploadedAt: nowISO() };
    DB.certificates = (DB.certificates || []).filter(c => c.participantId !== pid);
    DB.certificates.push(cert);
    saveDB(); logAudit('Upload Certificate', 'Sijil', pid, displayName);
    state.pendingFile = null; closeModal(); toast('✅ ' + t('sijil_uploaded')); render();
    finishUploadMonitor(true, `${file.name} · ${t('transfer_complete')}`);
  } catch (err) {
    console.error('Upload cert error:', err);
    finishUploadMonitor(false, `${file.name} · ${err.message || t('transfer_failed')}`);
    toast('❌ ' + (err.message || t('mat_upload_fail')), 'bad');
  }
}
function viewCertificate(pid) {
  if (state.user.role === 'participant' && state.user.id !== pid) { toast(t('msg_no_access'), 'bad'); return; }
  if (state.user.role === 'vip') { toast(t('msg_no_access'), 'bad'); return; }
  const cert = getCertFor(pid);
  if (!cert) { toast(t('msg_not_found'), 'bad'); return; }
  if (cert.fileId) { const url = cert.previewUrl || ('https://drive.google.com/file/d/' + cert.fileId + '/preview'); const w = window.open(url, '_blank'); if (!w) toast('⚠️ ' + t('mat_popup_blocked'), 'bad'); return; }
  try { const blob = base64ToBlob(cert.dataUrl); const url = URL.createObjectURL(blob); const w = window.open(url, '_blank'); if (!w) { URL.revokeObjectURL(url); toast('⚠️ ' + t('mat_popup_blocked'), 'bad'); return; } setTimeout(() => URL.revokeObjectURL(url), 60000); }
  catch (e) { console.error(e); toast(t('mat_view_fail'), 'bad'); }
}
async function downloadCertificate(pid) {
  if (state.user.role === 'participant' && state.user.id !== pid) { toast(t('msg_no_access'), 'bad'); return; }
  if (state.user.role === 'vip') { toast(t('msg_no_access'), 'bad'); return; }
  const cert = getCertFor(pid);
  if (!cert) { toast(t('msg_not_found'), 'bad'); return; }
  const filename = cert.originalName || (cert.name + '.pdf');
  if (cert.downloadUrl) {
    const ok = await downloadWithProgress(cert.downloadUrl, filename, { entity: 'Sijil', entityId: pid, details: cert.name });
    if (ok) logAudit('Download Certificate', 'Sijil', pid, cert.name);
    return;
  }
  try { const blob = base64ToBlob(cert.dataUrl); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1500); logAudit('Download Certificate', 'Sijil', pid, cert.name); }
  catch (e) { console.error(e); toast(t('mat_download_fail'), 'bad'); }
}
async function deleteCertificate(pid) {

document.addEventListener('change', (e) => {
  const tgt = e.target.closest('[data-change]');
  if (tgt && tgt.dataset.change === 'bank-category') { state.params.bankCategory = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'bank-diff') { state.params.bankDiff = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'grading-activity') { state.params.gradingActivity = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'grading-rubric') {
    const aid = tgt.dataset.aid, a = getActivity(aid);
    const rb = (DB.rubrics||[]).find(r => r.id === tgt.value && r.approvalStatus === 'approved');
    if (a) { a.rubricId = rb ? rb.id : null; a.updatedAt = nowISO(); saveDB(); logAudit('Assign Rubric', 'Aktiviti', aid, rb ? rb.name : 'None'); toast(t('rb_saved')); render(); }
    return;
  }
  if (tgt && tgt.dataset.change === 'activity-method') { const practical = tgt.value === 'Practical Test'; const field = document.getElementById('rubricTemplateField'); const quizFields = document.getElementById('quizScheduleFields'); const practicalFields = document.getElementById('practicalScheduleFields'); if (field) field.style.display = practical ? 'block' : 'none'; if (quizFields) quizFields.style.display = practical ? 'none' : 'block'; if (practicalFields) practicalFields.style.display = practical ? 'block' : 'none'; return; }
  if (tgt && tgt.id === 'activityModuleSelect') { state.activityDraftModuleId = tgt.value; if (document.getElementById('activityQuizBuilderSection')) renderQuizBuilder(); return; }
  if (tgt && tgt.dataset.change === 'activity-rubric') {
    const aid = tgt.dataset.aid; const a = getActivity(aid);
    if (a) { a.rubricId = tgt.value || null; a.updatedAt = nowISO(); saveDB(); logAudit('Assign Rubric', 'Aktiviti', aid, tgt.value ? getRubric(a).name : 'None'); toast(tgt.value ? t('rb_saved') : t('msg_deleted')); render(); }
    return;
  }
  if (e.target.matches && e.target.matches('[data-mc-select]')) { const idx = Number(e.target.dataset.mcSelect); if (state.tempModuleConfigs && state.tempModuleConfigs[idx]) state.tempModuleConfigs[idx].moduleId = e.target.value; return; }
  if (e.target.matches && e.target.matches('[data-mc-count]')) { const idx = Number(e.target.dataset.mcCount); if (state.tempModuleConfigs && state.tempModuleConfigs[idx]) state.tempModuleConfigs[idx].questionCount = Number(e.target.value) || 0; return; }
  if (e.target.id === 'pickerCategory' || e.target.id === 'pickerDiff') { renderPickerList(); return; }
  if (e.target.id === 'fePickerCategory') { renderFePickerList(); return; }
  if (e.target.matches && e.target.matches('input[data-pick-toggle]')) { updatePickerCount(); return; }
  if (e.target.matches && e.target.matches('input[data-fe-pick-toggle]')) { updateFePickerCount(); return; }
  if (e.target.name === 'saveToBank') { const f = document.getElementById('inlineBankFields'); if (f) f.style.display = e.target.checked ? 'grid' : 'none'; return; }
  if (tgt && tgt.dataset.change === 'attendance-module') { state.params.attendanceModule = tgt.value; state.params.attendanceDate = ''; render(); return; }
  if (tgt && tgt.dataset.change === 'attendance-date') { state.params.attendanceDate = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'attendance-self') {
    if (state.user.role !== 'participant') return;
    const date=tgt.dataset.date, pid=state.user.id, mid=tgt.dataset.mid;
    let rec=DB.attendance.find(x=>x.participantId===pid && x.moduleId===mid && x.date===date && x.attendanceType==='module-date');
    if (rec && rec.verifiedAt) { toast(currentLang==='ms'?'Kehadiran telah disahkan dan tidak boleh diubah.':'Attendance is verified and cannot be changed.','bad'); render(); return; }
    if (tgt.checked) {
      if (!rec) { rec={id:uid('att'),participantId:pid,moduleId:mid,date,attendanceType:'module-date'}; DB.attendance.push(rec); }
      rec.selfChecked=true; rec.status='Pending Verification'; rec.selfCheckedAt=nowISO(); rec.selfCheckedBy=pid; rec.verifiedAt=null; rec.verifiedBy=null;
      logAudit('Self Check-in','Kehadiran',`${date}:${pid}`,`${userName(pid)} menandakan hadir`);
    } else if (rec) { DB.attendance=DB.attendance.filter(x=>x!==rec); logAudit('Cancel Self Check-in','Kehadiran',`${date}:${pid}`,`${userName(pid)} membatalkan tanda hadir`); }
    saveDB(); render(); return;
  }
  if (tgt && tgt.dataset.change === 'attendance-present') {
    const pid=tgt.dataset.pid, date=tgt.dataset.date, mid=tgt.dataset.mid, stamp=nowISO();
    let rec=DB.attendance.find(x=>x.participantId===pid && x.moduleId===mid && x.date===date && x.attendanceType==='module-date');
    if (tgt.checked) {
      if (!rec) { rec={id:uid('att'),participantId:pid,moduleId:mid,date,attendanceType:'module-date'}; DB.attendance.push(rec); }
      rec.status='Hadir'; rec.by=state.user.id; rec.at=stamp; rec.verifiedAt=stamp; rec.verifiedBy=state.user.id;
      logAudit('Attendance','Kehadiran Harian',`${date}:${pid}`,`${userName(pid)}: Hadir — ${date}`);
    } else {
      DB.attendance=DB.attendance.filter(x=>!(x.participantId===pid && x.moduleId===mid && x.date===date && x.attendanceType==='module-date'));
      logAudit('Unmark Attendance','Kehadiran Harian',`${date}:${pid}`,`${userName(pid)}: tidak hadir — ${date}`);
    }
    saveDB(); render(); return;
  }
  if (tgt && tgt.dataset.change === 'attendance') {
    const aid = tgt.dataset.aid, pid = tgt.dataset.pid, val = tgt.value;
    let rec = DB.attendance.find(x => x.activityId === aid && x.participantId === pid);
    if (!val) { DB.attendance = DB.attendance.filter(x => !(x.activityId === aid && x.participantId === pid)); logAudit('Delete Attendance', 'Penilaian', `${aid}:${pid}`, userName(pid)); }
    else { if (rec) { rec.status = val; rec.by = state.user.id; rec.at = nowISO(); } else DB.attendance.push({ id: uid('att'), activityId: aid, participantId: pid, status: val, by: state.user.id, at: nowISO() }); logAudit('Attendance', 'Penilaian', `${aid}:${pid}`, `${userName(pid)}: ${val}`); }
    saveDB(); render();
  }
});

document.addEventListener('input', (e) => {
  const lf = e.target.closest && e.target.closest('form[data-form="login"]');
  if (lf) saveFormDraft(lf, 'cftpmy_login_draft');
  const rf = e.target.closest && e.target.closest('form[data-form="register"]');
  if (rf) saveFormDraft(rf, 'cftpmy_register_draft');
  if (e.target.id === 'regPassword') { updatePasswordMeter(e.target.value, 'register'); return; }
  if (e.target.id === 'newPassword') { updatePasswordMeter(e.target.value, 'change'); return; }
  if (e.target.matches && e.target.matches('[data-mc-count]')) { const idx = Number(e.target.dataset.mcCount); if (state.tempModuleConfigs && state.tempModuleConfigs[idx]) state.tempModuleConfigs[idx].questionCount = Number(e.target.value) || 0; return; }
  if (e.target.id === 'rubricName' && state.tempRubricMeta) { if (currentLang === 'en') state.tempRubricMeta.name_en = e.target.value; else state.tempRubricMeta.name = e.target.value; return; }
  if (e.target.id === 'rubricDesc' && state.tempRubricMeta) { if (currentLang === 'en') state.tempRubricMeta.description_en = e.target.value; else state.tempRubricMeta.description = e.target.value; return; }
  if (e.target.dataset.rb) {
    const ci = Number(e.target.dataset.ci), li = Number(e.target.dataset.li), key = e.target.dataset.rb;
    if (key === 'name') { if (currentLang === 'en') state.tempRubric[ci].name_en = e.target.value; else state.tempRubric[ci].name = e.target.value; }
    else if (key === 'weight') state.tempRubric[ci].weight = Number(e.target.value) || 0;
    else if (key === 'l_label') { if (currentLang === 'en') state.tempRubric[ci].levels[li].label_en = e.target.value; else state.tempRubric[ci].levels[li].label = e.target.value; }
    else if (key === 'l_mark') state.tempRubric[ci].levels[li].mark = Number(e.target.value) || 0;
    else if (key === 'l_desc') { if (currentLang === 'en') state.tempRubric[ci].levels[li].description_en = e.target.value; else state.tempRubric[ci].levels[li].description = e.target.value; }
    const tw = state.tempRubric.reduce((s,c) => s + c.weight, 0);
    const pill = document.querySelector('#rubricBuilderContainer .pill');
    if (pill) { pill.textContent = `${t('rb_total')}: ${tw}%`; if (tw !== 100) { pill.style.background = '#fdecea'; pill.style.color = 'var(--bad)'; } else { pill.style.background = ''; pill.style.color = ''; } }
    return;
  }
  if (e.target.matches && e.target.matches('[data-input="bank-search"]')) { state.params.bankSearch = e.target.value; render(); const inp = $('[data-input="bank-search"]'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } return; }
  if (e.target.id === 'pickerSearch') renderPickerList();
  if (e.target.id === 'fePickerSearch') renderFePickerList();
});

window.addEventListener('storage', (e) => {
  if (e.key === DB_KEY) {
    try {
      DB = JSON.parse(e.newValue);
      if (checkStandaloneFinal()) { const feid = location.hash.substring(7).split('&')[0].split('#')[0]; renderStandaloneFinal(feid); }
      else if (checkStandaloneQuiz()) { const aid = location.hash.substring(6).split('&')[0].split('#')[0]; renderStandaloneQuiz(aid); }
      else render();
    } catch(err) {}
  }
});
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'quiz-submitted') {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) { DB = JSON.parse(raw); if (!checkStandaloneFinal() && !checkStandaloneQuiz()) render(); }
    } catch(err) {}
  }
});
window.addEventListener('focus', async () => {
  if (!state.user) return;
  if (document.querySelector('.modal-backdrop')) return;
  if (saveInFlight || saveTimer) return;
  await pullFromServer(false);
});

let pullInFlightPromise = null;
async function pullFromServer(showToast, options = {}) {
  if (pullInFlightPromise) return pullInFlightPromise;
  pullInFlightPromise = pullFromServerInternal(showToast, options);
  try { return await pullInFlightPromise; }
  finally { pullInFlightPromise = null; }
}

async function pullFromServerInternal(showToast, options = {}) {
  if (!state.user && !options.allowLoggedOut) return { ok: false, skipped: 'not-logged-in' };
  if (document.hidden && !options.force) return { ok: false, skipped: 'hidden' };
  if (document.querySelector('.modal-backdrop') && !options.force) return { ok: false, skipped: 'modal-open' };
  if ((saveInFlight || saveTimer || savePending) && !options.force) return { ok: false, skipped: 'local-save-pending' };
  const maxAttempts = Number(options.maxAttempts || 3);
  const badge = document.getElementById('syncBadge');
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    try {
      const res = await driveAPI('loadState');
      if (!res || !res.ok || !res.state || !Array.isArray(res.state.users)) {
        throw new Error((res && res.error) || 'Server returned incomplete data');
      }
      const serverState = res.state;
      const localChanges = lastSyncedSnapshot ? computeDiff(lastSyncedSnapshot, DB) : {};
      const hasLocalChanges = !isDiffEmpty(localChanges);
      // Preserve unsynced local edits while refreshing all server-side records.
      const merged = hasLocalChanges ? applyDiff(serverState, localChanges) : cloneDB(serverState);
      DB = merged;
      migrateDB();
      lastSyncedSnapshot = cloneDB(serverState);
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
        localStorage.setItem('cftpmy_cache_refreshed_at', nowISO());
        if (hasLocalChanges) localStorage.setItem('cftpmy_pending_diff', JSON.stringify(localChanges));
        else localStorage.removeItem('cftpmy_pending_diff');
      } catch (storageError) { console.warn('Local cache update failed:', storageError); }
      const sessionUserRestored = restoreActiveSessionUser();
      if (!checkStandaloneFinal() && !checkStandaloneQuiz()) render();
      if (hasLocalChanges || sessionUserRestored) scheduleServerSave();
      if (badge) { badge.textContent = '✓'; badge.style.background = '#e8f5ec'; badge.style.color = '#1e7d4f'; badge.title = 'Google Sheets/Drive refreshed ' + new Date().toLocaleTimeString(); }
      if (showToast) toast('🔄 Data terkini berjaya dimuatkan daripada Google Sheets/Drive', 'ok');
      return { ok: true, changed: true };
    } catch (e) {
      console.warn(`[refresh] attempt ${attempt + 1}/${maxAttempts} failed:`, e);
      if (attempt < maxAttempts - 1) await sleep(Math.min(4000, 500 * Math.pow(2, attempt)));
      else {
        if (badge) { badge.textContent = '⚠'; badge.style.background = '#fdecea'; badge.style.color = '#c0392b'; badge.title = 'Server refresh failed. Local cached data is being kept. ' + (e.message || ''); }
        if (showToast) toast('⚠️ Tidak dapat membaca Google Sheets/Drive sekarang. Data cache dikekalkan; cuba Sync semula.', 'warn');
        return { ok: false, error: e.message || 'Refresh failed' };
      }
    }
  }
  return { ok: false };
}

// Refresh shared data more frequently so localStorage cache stays close to the latest server state.
setInterval(() => pullFromServer(false), 10000);

// Refresh when network connectivity returns; keep local edits if a save is pending.
window.addEventListener('online', () => { if (state.user) pullFromServer(true, { force: true, maxAttempts: 4 }); });
window.addEventListener('pageshow', () => { if (state.user) pullFromServer(false, { maxAttempts: 2 }); });

document.addEventListener('visibilitychange', () => { if (!document.hidden) pullFromServer(false); });

/* =========================================================
   BOOT
   ========================================================= */
document.documentElement.lang = currentLang;
setTimeout(() => {
  try { fastBoot(); }
  catch(e) {
    console.error('Boot error:', e);
    hideSplash();
    $('#app').innerHTML = `<div class="login-wrap"><div class="login-card"><h2>⚠️ Boot Error</h2><p class="muted">${esc(e.message || 'Unknown error')}</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div></div>`;
  }
}, 0);

// Keep all interface text aligned with the language saved by the user on initial load.
window.addEventListener('load', () => {
  if (currentLang === 'en') translateWholeSystem('en');
}, { once: true });

</script>
