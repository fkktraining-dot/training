function handleSaveModule(form) {
  const id = form.dataset.id;
  const data = { name: form.name.value.trim(), description: form.description.value.trim(), trainerId: form.trainerId.value, facilitatorId: (form.facilitatorId && form.facilitatorId.value) || null, published: form.published.value === 'true', updatedAt: nowISO() };
  if (!data.name) { toast(t('msg_required'), 'bad'); return; }
  if (id) {
    const m = getModule(id); const oldTrainerId = m.trainerId;
    Object.assign(m, data);
    DB.activities.filter(a => a.moduleId === id).forEach(a => { a.module = data.name; if (oldTrainerId !== data.trainerId) a.trainerId = data.trainerId; });
    saveDB(); logAudit('Update Module', 'Modul', id, data.name); toast(t('msg_updated'));
  } else {
    const nm = Object.assign({ id: uid('mod'), createdBy: state.user.id, createdAt: nowISO(), materials: [] }, data);
    DB.modules.push(nm); saveDB(); logAudit('Create Module', 'Modul', nm.id, nm.name); toast(t('msg_created_module'));
  }
  closeModal(); render();
}
function deleteModule(id) {
  const m = getModule(id); if (!m) return;
  const acts = moduleActivitiesList(id);
  const ttCount = moduleTimetable(id).length;
  const feCount = moduleFinalExams(id).length;
  const msg = t('confirm_delete_module', m.name, acts.length, (m.materials||[]).length, enrolledParticipants(id).length) + (ttCount ? `\n\n📅 ${ttCount} ${t('tt_title').toLowerCase()}` : '') + (feCount ? `\n🎓 ${feCount} ${t('fe_title').toLowerCase()}` : '');
  if (!confirm(msg)) return;
  const aids = acts.map(a => a.id);
  DB.modules = DB.modules.filter(x => x.id !== id);
  DB.activities = DB.activities.filter(a => a.moduleId !== id);
  DB.attempts = DB.attempts.filter(x => !aids.includes(x.activityId));
  DB.attendance = DB.attendance.filter(x => !aids.includes(x.activityId));
  DB.practical = DB.practical.filter(x => !aids.includes(x.activityId));
  DB.enrollments = DB.enrollments.filter(e => e.moduleId !== id);
  DB.timetables = DB.timetables.filter(x => x.moduleId !== id);
  DB.finalExams = (DB.finalExams || []).filter(fe => {
    fe.moduleConfigs = (fe.moduleConfigs || []).filter(mc => mc.moduleId !== id);
    return fe.moduleConfigs.length > 0;
  });
  const remainingFeIds = (DB.finalExams || []).map(fe => fe.id);
  DB.feAttempts = (DB.feAttempts || []).filter(x => remainingFeIds.includes(x.finalId));
  DB.fePractical = (DB.fePractical || []).filter(x => remainingFeIds.includes(x.finalId));
  DB.questionBank = (DB.questionBank || []).filter(x => x.moduleId !== id);
  if (Array.isArray(DB.retests)) DB.retests = DB.retests.filter(x => !aids.includes(x.activityId));
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => x.moduleId !== id);
  saveDB(); logAudit('Delete Module', 'Modul', id, m.name); toast(t('msg_deleted')); state.view = 'modules'; state.params = {}; render();
}

const MAX_FILE_SIZE = 100 * 1024 * 1024;
function openUploadMaterialModal(mid) {
  const m = getModule(mid);

  state.pendingFile = null;
  openModal(`<h2>📎 ${t('mat_upload_modal')}</h2><p class="muted">${tce(m.name)}</p>
    <div class="info-box"><h4>${t('mat_upload_format')}</h4><p style="margin:0">${t('mat_upload_format_value')}</p><p style="margin:6px 0 0"><strong>${t('mat_upload_limit')}</strong></p><p style="margin:6px 0 0;font-size:.8rem">${t('mat_drive_note')}</p></div>
    <form data-form="upload-material" data-mid="${mid}">
      <div class="field"><label>${t('mat_upload_file')} *</label><input type="file" class="input" name="file" id="uploadFileInput" required /><div id="fileInfo" style="margin-top:6px"></div></div>
      <div class="field"><label>${t('mat_upload_display_name')}</label><input class="input" name="displayName" id="uploadDisplayName" placeholder="${t('mat_upload_placeholder')}" /></div>
      <div class="field"><label>${t('mat_upload_desc')}</label><input class="input" name="description" /></div>
      <div id="uploadProgress" style="display:none;margin-top:8px"><div class="progress"><span id="uploadProgressBar" style="width:0%"></span></div><small class="muted" style="display:block;margin-top:4px">${t('mat_uploading')}</small></div>
      <div class="modal-actions"><button type="button" class="btn" data-act="close-modal">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('mat_upload_btn')}</button></div>
    </form>`);
  const inp = document.getElementById('uploadFileInput');
  if (inp) inp.addEventListener('change', (e) => {
    const file = e.target.files[0]; const info = document.getElementById('fileInfo');
    if (!file) { if (info) info.innerHTML = ''; state.pendingFile = null; return; }
    const type = fileTypeFromName(file.name);
    if (file.size > MAX_FILE_SIZE) { if (info) info.innerHTML = `<div class="file-preview" style="border-color:#e8c4bf;background:#fdecea"><strong>⚠️ ${t('mat_upload_too_big', formatFileSize(file.size), formatFileSize(MAX_FILE_SIZE))}</strong></div>`; state.pendingFile = null; e.target.value = ''; return; }
    if (info) info.innerHTML = `<div class="file-preview">${fileIcon(type)} <strong>${esc(file.name)}</strong> · ${fileTypeLabel(type)} · ${formatFileSize(file.size)}</div>`;
    state.pendingFile = file;
    const nameInp = document.getElementById('uploadDisplayName');
    if (nameInp && !nameInp.value) nameInp.placeholder = file.name;
  });
}
async function handleUploadMaterial(form) {
  const mid = form.dataset.mid;
  const file = state.pendingFile;
  if (!file) { toast(t('mat_upload_no_file'), 'bad'); return; }
  if (file.size > MAX_FILE_SIZE) { toast(t('mat_upload_too_big', formatFileSize(file.size), formatFileSize(MAX_FILE_SIZE)), 'bad'); return; }
  const m = getModule(mid);
  if (!m) { toast(t('msg_not_found'), 'bad'); return; }
  const progressEl = document.getElementById('uploadProgress');
  const progressBar = document.getElementById('uploadProgressBar');
  if (progressEl) progressEl.style.display = 'block';
  if (progressBar) progressBar.style.width = '10%';
  try {
    if (progressBar) progressBar.style.width = '25%';
    const base64 = await fileToBase64(file);
    if (progressBar) progressBar.style.width = '55%';
    const res = await driveAPI('uploadModuleMaterial', { payload: { moduleId: mid, moduleName: m.name, filename: file.name, mimeType: file.type || 'application/octet-stream', base64, description: (form.description ? form.description.value : '').trim() } });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Upload failed');
    if (progressBar) progressBar.style.width = '90%';
    const displayName = (form.displayName.value || '').trim() || file.name;
    const mat = { id: uid('mat'), fileId: res.file.id, name: displayName, originalName: file.name, type: fileTypeFromName(file.name), mime: res.file.mimeType, size: res.file.size, downloadUrl: res.file.downloadUrl, viewUrl: res.file.viewUrl, previewUrl: res.file.previewUrl, folderId: res.file.folderId, folderUrl: res.file.folderUrl, description: (form.description ? form.description.value : '').trim(), uploadedBy: state.user.id, uploadedAt: nowISO() };
    if (!Array.isArray(m.materials)) m.materials = [];
    m.materials.push(mat);
    m.updatedAt = nowISO();
    saveDB();
    logAudit('Upload Material', 'Modul', mid, `${displayName} (${formatFileSize(file.size)})`);
    if (progressBar) progressBar.style.width = '100%';
    state.pendingFile = null; closeModal(); toast('✅ ' + t('mat_upload_success')); render();
  } catch (err) {
    console.error('Upload error:', err);
    if (progressEl) progressEl.style.display = 'none';
    toast('❌ ' + (err.message || t('mat_upload_fail')), 'bad');
  }
}
function viewMaterial(mid, matid) {
  const mat = findMaterial(mid, matid);
  if (!mat) { toast(t('msg_not_found'), 'bad'); return; }
  if (mat.fileId) {
    const url = mat.previewUrl || ('https://drive.google.com/file/d/' + mat.fileId + '/preview');
    const w = window.open(url, '_blank');
    if (!w) toast('⚠️ ' + t('mat_popup_blocked'), 'bad');
    return;
  }
  try {
    if (mat.type === 'pdf' || mat.type === 'image') { const blob = base64ToBlob(mat.dataUrl); const url = URL.createObjectURL(blob); const w = window.open(url, '_blank'); if (!w) { URL.revokeObjectURL(url); toast('⚠️ ' + t('mat_popup_blocked'), 'bad'); return; } setTimeout(() => URL.revokeObjectURL(url), 60000); }
    else if (mat.type === 'word' || mat.type === 'powerpoint' || mat.type === 'excel') { downloadMaterial(mid, matid); toast(t('mat_word_hint'), 'ok'); }
    else downloadMaterial(mid, matid);
  } catch(e) { console.error(e); toast(t('mat_view_fail'), 'bad'); }
}
async function downloadMaterial(mid, matid) {
  const mat = findMaterial(mid, matid);
  if (!mat) { toast(t('msg_not_found'), 'bad'); return; }
  const filename = mat.originalName || mat.name;
  if (mat.downloadUrl) {
    const ok = await downloadWithProgress(mat.downloadUrl, filename, { entity: 'Modul', entityId: mid, details: mat.name });
    if (ok) logAudit('Download Material', 'Modul', mid, mat.name);
    return;
  }
  try {
    const blob = base64ToBlob(mat.dataUrl);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);

}
async function deleteMaterial(mid, matid) {

function handleSaveRubricConfig(assignToActivityId) {
  if (!['admin','trainer','facilitator'].includes(state.user.role)) {
    toast(t('msg_no_access'), 'bad'); return;
  }
  if (!state.tempRubric) { toast(t('msg_required'), 'bad'); return; }
  const tw = state.tempRubric.reduce((s,c) => s + c.weight, 0);
  if (tw !== 100) { toast(t('rb_weight_error', tw), 'bad'); return; }
  const nameEl = document.getElementById('rubricName');
  const descEl = document.getElementById('rubricDesc');
  const name = nameEl ? nameEl.value.trim() : '';
  const desc = descEl ? descEl.value.trim() : '';
  if (!name) { toast(t('rb_name_required'), 'bad'); return; }
  const isFac = state.user.role === 'facilitator';
  const newStatus = isFac ? 'pending' : 'approved';
  const reviewerId = isFac ? null : state.user.id;
  const reviewedAt = isFac ? null : nowISO();
  let rubricId = state.editingRubricId;
  if (rubricId) {
    const rb = DB.rubrics.find(r => r.id === rubricId);
    if (!rb) { toast(t('msg_not_found'), 'bad'); return; }
    if (state.user.role === 'facilitator' && rb.createdBy !== state.user.id) {
      toast(t('rb_own_only_edit'), 'bad'); return;
    }
    rb.name = name;
    rb.description = desc;
    rb.criteria = JSON.parse(JSON.stringify(state.tempRubric));
    rb.updatedAt = nowISO();
    rb.approvalStatus = newStatus;
    rb.reviewedBy = reviewerId;
    rb.reviewedAt = reviewedAt;
    if (isFac) rb.reviewRemarks = '';
    logAudit('Update Rubric', 'Rubrik', rubricId, name + (isFac ? ' (pending)' : ''));
  } else {
    const nr = {
      id: uid('rb'), name, description: desc,
      criteria: JSON.parse(JSON.stringify(state.tempRubric)),
      createdBy: state.user.id, createdAt: nowISO(), updatedAt: nowISO(),
      approvalStatus: newStatus, reviewedBy: reviewerId, reviewedAt, reviewRemarks: ''
    };
    DB.rubrics.push(nr); rubricId = nr.id;
    logAudit('Create Rubric', 'Rubrik', nr.id, name + (isFac ? ' (pending)' : ''));
  }
  if (assignToActivityId) {
    const act = getActivity(assignToActivityId);
    if (act) { act.rubricId = rubricId; act.updatedAt = nowISO(); }
  }
  saveDB();
  closeModal();
  toast(isFac ? '⏳ ' + t('rb_pending_note') : '✅ ' + t('rb_saved'), isFac ? 'warn' : 'ok');
  render();
}
function approveRubric(rubricId) {
  if (!['admin','trainer'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); return; }
  const rb = DB.rubrics.find(r => r.id === rubricId);
  if (!rb) return;
  rb.approvalStatus = 'approved';
  rb.reviewedBy = state.user.id;
  rb.reviewedAt = nowISO();
  rb.reviewRemarks = '';
  saveDB();
  logAudit('Approve Rubric', 'Rubrik', rubricId, rb.name);
  toast('✅ ' + t('rb_approved_msg'));
  render();
}
function rejectRubric(rubricId, reason) {
  if (!['admin','trainer'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); return; }
  const rb = DB.rubrics.find(r => r.id === rubricId);
  if (!rb) return;
  rb.approvalStatus = 'rejected';
  rb.reviewedBy = state.user.id;
  rb.reviewedAt = nowISO();
  rb.reviewRemarks = reason || '';
  saveDB();
  logAudit('Reject Rubric', 'Rubrik', rubricId, rb.name + (reason ? ' — ' + reason : ''));
  toast(t('rb_rejected_msg'));

}
function deleteRubric(id) {
  if (!['admin','trainer','facilitator'].includes(state.user.role)) {
    toast(t('msg_no_access'), 'bad'); return;
  }
  const rb = DB.rubrics.find(r => r.id === id); if (!rb) return;
  if (state.user.role === 'facilitator') {
    if (rb.createdBy !== state.user.id) { toast(t('rb_cannot_edit'), 'bad'); return; }
    if (rb.approvalStatus === 'approved') { toast(t('rb_cannot_edit'), 'bad'); return; }
  }
  const used = DB.activities.filter(a => a.rubricId === id);
  if (used.length) {
    if (!confirm(t('confirm_delete_rubric', rb.name) + `\n\n(${used.length} activities)`)) return;
    used.forEach(a => { a.rubricId = null; });
  } else {
    if (!confirm(t('confirm_delete_rubric', rb.name))) return;
  }
  DB.rubrics = DB.rubrics.filter(x => x.id !== id);
  saveDB(); logAudit('Delete Rubric', 'Rubrik', id, rb.name); toast(t('msg_deleted')); render();
}

function handleSavePractical(form) {
  const aid = form.dataset.aid, pid = form.dataset.pid;
  const act = getActivity(aid); const rubric = getRubricCriteria(act);
  const scores = rubric.map((c, i) => { const sel = form.querySelector(`input[name="c${i}"]:checked`); return sel ? Number(sel.value) : 0; });
  let tw = 0, ts = 0;
  rubric.forEach((c, i) => { const mark = scores[i]; const mx = Math.max(...c.levels.map(l => l.mark)); tw += c.weight; ts += mx > 0 ? (mark / mx) * c.weight : 0; });
  const totalPct = tw > 0 ? (ts / tw) * 100 : 0;
  const remarks = form.remarks.value.trim();
  const data = { scores, total: totalPct, remarks };
  const shouldSubmitForApproval = state.user.role === 'facilitator' || (state.user.role === 'trainer' && isFacilitatorOf(act.moduleId, state.user.id));
  if (shouldSubmitForApproval) {
    let pa = (DB.pendingApprovals || []).find(x => x.type === 'practical' && x.activityId === aid && x.participantId === pid && x.status === 'pending');
    if (pa) { pa.data = data; pa.submittedAt = nowISO(); }
    else { if (!Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = []; DB.pendingApprovals.push({ id: uid('pa'), type: 'practical', moduleId: act.moduleId, activityId: aid, participantId: pid, data, submittedBy: state.user.id, submittedAt: nowISO(), status: 'pending', reviewedBy: null, reviewedAt: null, reviewRemarks: '' }); }
    saveDB(); logAudit('Submit Practical (Pending Approval)', 'Penilaian', `${aid}:${pid}`, `${userName(pid)}: ${totalPct.toFixed(1)}%`);
    closeModal(); toast('⏳ ' + t('pa_submitted_for_approval'), 'warn'); render(); return;
  }
  let rec = DB.practical.find(x => x.activityId === aid && x.participantId === pid);
  if (rec) { rec.scores = scores; rec.total = totalPct; rec.remarks = remarks; rec.by = state.user.id; rec.at = nowISO(); }
  else DB.practical.push({ id: uid('pr'), activityId: aid, participantId: pid, scores, total: totalPct, remarks, by: state.user.id, at: nowISO() });
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => !(x.type === 'practical' && x.activityId === aid && x.participantId === pid && x.status === 'pending'));
  saveDB(); logAudit('Rubric Marks', 'Penilaian', `${aid}:${pid}`, `${userName(pid)}: ${totalPct.toFixed(1)}%`);
  closeModal(); toast(t('pf_saved')); render();
}

function handleSaveUser(form) {

  const name = form.name.value.trim(); const username = form.username.value.trim(); const email = form.email.value.trim().toLowerCase();

  if (role === 'vip' && !org) { toast(t('usr_org_required'), 'bad'); return; }
  const dupU = DB.users.find(u => u.id !== id && String(u.username||'').toLowerCase() === username.toLowerCase());
  if (dupU) { toast(t('username_taken'), 'bad'); return; }
  const dupE = DB.users.find(u => u.id !== id && String(u.email||'').toLowerCase() === email);
  if (dupE) { toast(t('msg_email_taken'), 'bad'); return; }
  if (id) { const u = DB.users.find(x => x.id === id); if (!u) return; Object.assign(u, { name, username, email, password, role, ic, org, phone, status }); saveDB(); logAudit('Update User', 'Pengguna', id, name); toast(t('msg_updated')); }
  else { const nu = { id: uid('u'), name, username, email, password, role, ic, org, phone, status: status || 'approved', createdAt: nowISO() }; DB.users.push(nu); saveDB(); logAudit('Create User', 'Pengguna', nu.id, name); toast(t('msg_created')); }
  closeModal(); render();
}
function deleteUser(id) {
  const u = DB.users.find(x => x.id === id);
  if (!u || u.id === state.user.id) { toast(t('confirm_cannot_delete'), 'bad'); return; }
  if (!confirm(t('confirm_delete_user', u.name))) return;
  DB.users = DB.users.filter(x => x.id !== id);
  if (u.role === 'trainer' || u.role === 'facilitator') {
    const mids = DB.modules.filter(m => m.trainerId === id).map(m => m.id);
    const aids = DB.activities.filter(a => mids.includes(a.moduleId)).map(a => a.id);
    const feids = (DB.finalExams || []).filter(fe => feModuleIds(fe).some(mid => mids.includes(mid))).map(fe => fe.id);
    DB.modules = DB.modules.filter(m => m.trainerId !== id);
    DB.activities = DB.activities.filter(a => !mids.includes(a.moduleId));
    DB.attempts = DB.attempts.filter(a => !aids.includes(a.activityId));
    DB.attendance = DB.attendance.filter(a => !aids.includes(a.activityId));
    DB.practical = DB.practical.filter(a => !aids.includes(a.activityId));
    DB.enrollments = DB.enrollments.filter(e => !mids.includes(e.moduleId));
    DB.timetables = DB.timetables.filter(x => !mids.includes(x.moduleId));
    DB.finalExams = (DB.finalExams || []).filter(x => !feids.includes(x.id));
    DB.feAttempts = (DB.feAttempts || []).filter(x => !feids.includes(x.finalId));
    DB.fePractical = (DB.fePractical || []).filter(x => !feids.includes(x.finalId));
    DB.questionBank = (DB.questionBank || []).filter(x => !mids.includes(x.moduleId));
    if (Array.isArray(DB.retests)) DB.retests = DB.retests.filter(x => !aids.includes(x.activityId));
    if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => !mids.includes(x.moduleId));
    DB.modules.forEach(m => { if (m.facilitatorId === id) m.facilitatorId = null; });
  }
  if (u.role === 'participant') {
    DB.attempts = DB.attempts.filter(a => a.participantId !== id);
    DB.attendance = DB.attendance.filter(a => a.participantId !== id);
    DB.practical = DB.practical.filter(a => a.participantId !== id);
    DB.enrollments = DB.enrollments.filter(e => e.participantId !== id);
    DB.certificates = (DB.certificates || []).filter(c => c.participantId !== id);
    DB.feAttempts = (DB.feAttempts || []).filter(x => x.participantId !== id);
    DB.fePractical = (DB.fePractical || []).filter(x => x.participantId !== id);
    if (Array.isArray(DB.retests)) DB.retests = DB.retests.filter(x => x.participantId !== id);
    if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => x.participantId !== id);
  }
  saveDB(); logAudit('Delete User', 'Pengguna', id, u.name); toast(t('msg_deleted')); render();
}

async function handleUploadCertificate(form) {
  const pid = form.dataset.pid;
  const file = state.pendingFile;
  if (!file) { toast(t('mat_upload_no_file'), 'bad'); return; }
  if (fileTypeFromName(file.name) !== 'pdf') { toast(t('sijil_only_pdf'), 'bad'); return; }
  if (file.size > MAX_CERT_SIZE) { toast(t('mat_upload_too_big', formatFileSize(file.size), formatFileSize(MAX_CERT_SIZE)), 'bad'); return; }
  const p = DB.users.find(u => u.id === pid);
  if (!p) { toast(t('msg_not_found'), 'bad'); return; }
  try {
    const base64 = await fileToBase64(file);
    const res = await driveAPI('uploadCertificate', { payload: { participantId: pid, participantName: p.name, filename: file.name, mimeType: 'application/pdf', base64, description: (form.description ? form.description.value : '').trim() } });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Upload failed');
    const displayName = (form.displayName.value || '').trim() || res.file.name;
    const cert = { id: uid('cert'), participantId: pid, fileId: res.file.id, name: displayName, originalName: res.file.name, type: 'pdf', mime: 'application/pdf', size: res.file.size, downloadUrl: res.file.downloadUrl, viewUrl: res.file.viewUrl, previewUrl: res.file.previewUrl, folderId: res.file.folderId, folderUrl: res.file.folderUrl, description: (form.description ? form.description.value : '').trim(), uploadedBy: state.user.id, uploadedAt: nowISO() };

    state.pendingFile = null; closeModal(); toast('✅ ' + t('sijil_uploaded')); render();
  } catch (err) {

    toast('❌ ' + (err.message || t('mat_upload_fail')), 'bad');
  }
}
function viewCertificate(pid) {

  try { const blob = base64ToBlob(cert.dataUrl); const url = URL.createObjectURL(blob); const w = window.open(url, '_blank'); if (!w) { URL.revokeObjectURL(url); toast('⚠️ ' + t('mat_popup_blocked'), 'bad'); return; } setTimeout(() => URL.revokeObjectURL(url), 60000); }
  catch (e) { console.error(e); toast(t('mat_view_fail'), 'bad'); }
}
async function downloadCertificate(pid) {
  if (state.user.role === 'participant' && state.user.id !== pid) { toast(t('msg_no_access'), 'bad'); return; }

    if (ok) logAudit('Download Certificate', 'Sijil', pid, cert.name);
    return;
  }
  try { const blob = base64ToBlob(cert.dataUrl); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1500); logAudit('Download Certificate', 'Sijil', pid, cert.name); }
  catch (e) { console.error(e); toast(t('mat_download_fail'), 'bad'); }
}

    }
    case 'new-question': openQuestionForm(null); break;
    case 'edit-question': openQuestionForm(DB.questionBank.find(x => x.id === id)); break;
    case 'delete-question': deleteBankQuestion(id); break;
    case 'qb-add-new': openInlineQuestionEditor(undefined); break;
    case 'qb-edit': openInlineQuestionEditor(Number(tgt.dataset.idx)); break;
    case 'qb-del': { const idx = Number(tgt.dataset.idx); if (confirm(t('confirm_delete_question'))) { state.tempQuiz.splice(idx, 1); renderQuizBuilder(); } break; }
    case 'qb-up': { const i = Number(tgt.dataset.idx); if (i > 0) { [state.tempQuiz[i-1], state.tempQuiz[i]] = [state.tempQuiz[i], state.tempQuiz[i-1]]; renderQuizBuilder(); } break; }
    case 'qb-down': { const i = Number(tgt.dataset.idx); if (i < state.tempQuiz.length - 1) { [state.tempQuiz[i+1], state.tempQuiz[i]] = [state.tempQuiz[i], state.tempQuiz[i+1]]; renderQuizBuilder(); } break; }
    case 'qb-pick-bank': openBankPicker(); break;
    case 'new-rubric': openRubricEditor(null); break;
    case 'edit-rubric': openRubricEditor(id); break;
    case 'delete-rubric': deleteRubric(id); break;
    case 'new-rubric-and-assign': openRubricEditor(null, tgt.dataset.aid); break;
    case 'approve-rubric': {
      if (!['admin','trainer'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; }
      if (!confirm(t('rb_confirm_approve'))) break;
      approveRubric(id);
      break;
    }
    case 'reject-rubric': {
      if (!['admin','trainer'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; }
      const reason = prompt(t('rb_reject_reason'));
      if (reason === null) break;
      if (!confirm(t('rb_confirm_reject'))) break;
      rejectRubric(id, reason);
      break;
    }
    case 'edit-rubric-builder': {
      if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; }
      const a = getActivity(id);
      if (!a) break;
      if ((state.user.role === 'trainer' || state.user.role === 'facilitator') && !canTrainerAccessActivity(id)) { toast(t('msg_no_access'), 'bad'); break; }
      if (a.rubricId) {
        openRubricEditor(a.rubricId);
      } else {
        const approvedRubrics = (DB.rubrics || []).filter(r => r.approvalStatus === 'approved');
        openModal(`<h2>📏 ${t('act_rubric_section')}</h2>
          <p class="muted">${tce(a.title)} — ${t('act_rubric_none_hint')}</p>
          <div class="field"><label>${t('rb_pick_existing')}</label>
            <select class="select" id="quickRubricSelect">
              <option value="">${t('rb_pick_none')}</option>
              ${approvedRubrics.map(rb => `<option value="${rb.id}">${tce(rb.name)}</option>`).join('')}
            </select>
          </div>
          <div class="modal-actions">
            <button class="btn" data-act="close-modal">${t('btn_cancel')}</button>
            <button class="btn btn-primary" data-act="quick-assign-rubric" data-aid="${a.id}">${t('rb_pick_apply')}</button>
            <button class="btn btn-primary" data-act="new-rubric-and-assign" data-aid="${a.id}">+ ${t('rb_pick_new')}</button>
          </div>`);
      }
      break;
    }
    case 'quick-assign-rubric': {
      if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; }
      const sel = document.getElementById('quickRubricSelect');
      if (!sel || !sel.value) { toast(t('rb_no_rubric_selected'), 'bad'); break; }
      const a = getActivity(tgt.dataset.aid);
      if (a) {
        a.rubricId = sel.value; a.updatedAt = nowISO();
        saveDB(); logAudit('Assign Rubric', 'Aktiviti', a.id, getRubric(a).name);
      }
      closeModal(); toast(t('rb_saved')); render(); break;
    }
    case 'save-rubric-config': handleSaveRubricConfig(tgt.dataset.aid || null); break;
    case 'rb-add-crit': state.tempRubric.push({ name:'', weight:10, levels:[{label:t('rb_level_good'),mark:5,description:''},{label:t('rb_level_fail'),mark:0,description:''}] }); renderRubricBuilder(); break;
    case 'rb-del-crit': state.tempRubric.splice(Number(tgt.dataset.ci), 1); renderRubricBuilder(); break;
    case 'rb-add-level': { const ci = Number(tgt.dataset.ci); state.tempRubric[ci].levels.push({ label: t('rb_level') + ' ' + (state.tempRubric[ci].levels.length + 1), mark: 1, description: '' }); renderRubricBuilder(); break; }
    case 'rb-del-level': { state.tempRubric[Number(tgt.dataset.ci)].levels.splice(Number(tgt.dataset.li), 1); renderRubricBuilder(); break; }
    case 'edit-quiz-builder': { if ((state.user.role === 'trainer' || state.user.role === 'facilitator') && !canTrainerAccessActivity(id)) { toast(t('msg_no_access'), 'bad'); break; } openQuizEditor(id); break; }
    case 'save-quiz-config': handleSaveQuizConfig(); break;
    case 'upload-material': openUploadMaterialModal(tgt.dataset.mid); break;
    case 'view-material': viewMaterial(tgt.dataset.mid, tgt.dataset.matid); break;
    case 'download-material': downloadMaterial(tgt.dataset.mid, tgt.dataset.matid); break;
    case 'delete-material': deleteMaterial(tgt.dataset.mid, tgt.dataset.matid); break;
    case 'new-timetable': openTimetableForm(tgt.dataset.mid, null); break;
    case 'edit-timetable': { const e = DB.timetables.find(x => x.id === tgt.dataset.tid); if (e) openTimetableForm(e.moduleId, e.id); break; }
    case 'delete-timetable': deleteTimetableEntry(tgt.dataset.tid); break;
    case 'upload-certificate': openUploadCertificateModal(tgt.dataset.pid); break;
    case 'view-certificate': viewCertificate(tgt.dataset.pid); break;
    case 'download-certificate': downloadCertificate(tgt.dataset.pid); break;
    case 'delete-certificate': deleteCertificate(tgt.dataset.pid); break;
    case 'new-final-exam': openFinalExamForm(null, tgt.dataset.module); break;
    case 'edit-final-exam': openFinalExamForm(getFinalExam(id)); break;
    case 'delete-final-exam': deleteFinalExam(id); break;
    case 'toggle-final-publish': toggleFinalPublish(id); break;
    case 'fe-questions-overview': {
      if (state.user.role === 'trainer' || state.user.role === 'facilitator') {
        const fe = getFinalExam(id);
        if (!fe || !feModuleIds(fe).some(mid => canTrainerAccessModule(mid))) { toast(t('msg_no_access'), 'bad'); break; }
      }
      openFinalExamQuestionsEditor(id); break;
    }
    case 'fe-edit-module-questions': openModuleQuestionEditor(tgt.dataset.feid, tgt.dataset.mid); break;
    case 'fe-back-to-overview': openFinalExamQuestionsEditor(tgt.dataset.feid); break;
    case 'save-fe-questions': handleSaveFeQuestions(); break;
    case 'fe-q-add-new': openFeInlineQuestionEditor(undefined); break;
    case 'fe-q-edit': openFeInlineQuestionEditor(Number(tgt.dataset.idx)); break;
    case 'fe-q-del': { const idx = Number(tgt.dataset.idx); if (confirm(t('confirm_delete_question'))) { state.tempFeQuestions.splice(idx, 1); renderFeQuestionsBuilder(); } break; }
    case 'fe-q-up': { const i = Number(tgt.dataset.idx); if (i > 0) { [state.tempFeQuestions[i-1], state.tempFeQuestions[i]] = [state.tempFeQuestions[i], state.tempFeQuestions[i-1]]; renderFeQuestionsBuilder(); } break; }
    case 'fe-q-down': { const i = Number(tgt.dataset.idx); if (i < state.tempFeQuestions.length - 1) { [state.tempFeQuestions[i+1], state.tempFeQuestions[i]] = [state.tempFeQuestions[i], state.tempFeQuestions[i+1]]; renderFeQuestionsBuilder(); } break; }
    case 'fe-q-pick-bank': openFeBankPicker(); break;
    case 'fe-assess': openFinalAssessModal(id); break;
    case 'fe-practical-form': openFinalPracticalForm(tgt.dataset.feid, tgt.dataset.pid); break;
    case 'fe-add-module-config': {
      const avail = state.user.role === 'admin' ? sortModules(DB.modules) : myModules();
      const usedIds = (state.tempModuleConfigs || []).map(mc => mc.moduleId);
      const available = avail.find(m => !usedIds.includes(m.id));
      if (!available) { toast('ℹ️ Semua modul telah dipilih', 'warn'); break; }
      state.tempModuleConfigs.push({ moduleId: available.id, questionCount: 5, questions: [], submitted: false, submittedAt: null, submittedBy: null });
      const type = document.getElementById('feType')?.value || 'theory';
      renderModuleConfigsList(avail, type);
      break;
    }
    case 'fe-remove-module-config': {
      if ((state.tempModuleConfigs || []).length <= 1) { toast('ℹ️ Sekurang-kurangnya satu modul diperlukan', 'warn'); break; }
      state.tempModuleConfigs.splice(Number(tgt.dataset.idx), 1);
      const avail = state.user.role === 'admin' ? sortModules(DB.modules) : myModules();
      const type = document.getElementById('feType')?.value || 'theory';
      renderModuleConfigsList(avail, type);
      break;
    }
    case 'retest-modal': { if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; } openRetestModal(tgt.dataset.aid, tgt.dataset.pid); break; }
    case 'retest-grant': { if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; } const aid = tgt.dataset.aid, pid = tgt.dataset.pid; if (!confirm(t('retest_confirm_grant', userName(pid)))) break; grantRetest(aid, pid); closeModal(); toast('✅ ' + t('msg_retest_granted', userName(pid))); render(); break; }
    case 'retest-cancel': { if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; } const aid = tgt.dataset.aid, pid = tgt.dataset.pid; if (!confirm(t('retest_confirm_cancel', userName(pid)))) break; cancelRetest(aid, pid); closeModal(); toast(t('msg_retest_cancelled')); render(); break; }
    case 'retest-edit-q': { if (!['admin','trainer','facilitator'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; } const aid = tgt.dataset.aid, pid = tgt.dataset.pid; closeModal(); state.retestContext = { aid, pid }; openQuizEditor(aid); break; }
    case 'pa-approve': { if (!['admin','trainer'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; } if (!confirm(t('pa_confirm_approve'))) break; approvePendingApproval(id); break; }
    case 'pa-reject': { if (!['admin','trainer'].includes(state.user.role)) { toast(t('msg_no_access'), 'bad'); break; } const reason = prompt(t('pa_reject_reason')); if (reason === null) break; if (!confirm(t('pa_confirm_reject'))) break; rejectPendingApproval(id, reason); break; }
  }
});

document.addEventListener('change', (e) => {
  const tgt = e.target.closest('[data-change]');
  if (tgt && tgt.dataset.change === 'bank-category') { state.params.bankCategory = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'bank-diff') { state.params.bankDiff = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'bank-module') { state.params.bankModule = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'grading-activity') { state.params.gradingActivity = tgt.value; render(); return; }
  if (tgt && tgt.dataset.change === 'activity-method') { const field = document.getElementById('rubricTemplateField'); if (field) field.style.display = tgt.value.includes('Praktikal') ? 'block' : 'none'; return; }
  if (tgt && tgt.dataset.change === 'activity-rubric') {
    const aid = tgt.dataset.aid; const a = getActivity(aid);
    if (a) {
      a.rubricId = tgt.value || null; a.updatedAt = nowISO();
      saveDB(); logAudit('Assign Rubric', 'Aktiviti', aid, tgt.value ? getRubric(a).name : 'None');
      toast(tgt.value ? t('rb_saved') : t('msg_deleted')); render();
    }
    return;
  }
  if (e.target.matches && e.target.matches('[data-mc-select]')) {
    const idx = Number(e.target.dataset.mcSelect);
    if (state.tempModuleConfigs && state.tempModuleConfigs[idx]) state.tempModuleConfigs[idx].moduleId = e.target.value;
    return;
  }
  if (e.target.matches && e.target.matches('[data-mc-count]')) {
    const idx = Number(e.target.dataset.mcCount);
    if (state.tempModuleConfigs && state.tempModuleConfigs[idx]) state.tempModuleConfigs[idx].questionCount = Number(e.target.value) || 0;
    return;
  }
  if (e.target.id === 'pickerCategory' || e.target.id === 'pickerDiff') { renderPickerList(); return; }
  if (e.target.id === 'fePickerCategory') { renderFePickerList(); return; }
  if (e.target.matches && e.target.matches('input[data-pick-toggle]')) { updatePickerCount(); return; }
  if (e.target.matches && e.target.matches('input[data-fe-pick-toggle]')) { updateFePickerCount(); return; }
  if (e.target.name === 'saveToBank') { const f = document.getElementById('inlineBankFields'); if (f) f.style.display = e.target.checked ? 'grid' : 'none'; return; }
  if (tgt && tgt.dataset.change === 'attendance') {
    const aid = tgt.dataset.aid, pid = tgt.dataset.pid, val = tgt.value;
    let rec = DB.attendance.find(x => x.activityId === aid && x.participantId === pid);
    if (!val) { DB.attendance = DB.attendance.filter(x => !(x.activityId === aid && x.participantId === pid)); logAudit('Delete Attendance', 'Penilaian', `${aid}:${pid}`, userName(pid)); }
    else { if (rec) { rec.status = val; rec.by = state.user.id; rec.at = nowISO(); } else DB.attendance.push({ id: uid('att'), activityId: aid, participantId: pid, status: val, by: state.user.id, at: nowISO() }); logAudit('Attendance', 'Penilaian', `${aid}:${pid}`, `${userName(pid)}: ${val}`); }
    saveDB(); render();
  }
});

document.addEventListener('input', (e) => {
  const lf = e.target.closest && e.target.closest('form[data-form="login"]');
  if (lf) { saveFormDraft(lf, 'cftpmy_login_draft'); }
  const rf = e.target.closest && e.target.closest('form[data-form="register"]');
  if (rf) { saveFormDraft(rf, 'cftpmy_register_draft'); }
  if (e.target.id === 'regPassword') { updatePasswordMeter(e.target.value, 'register'); return; }
  if (e.target.id === 'newPassword') { updatePasswordMeter(e.target.value, 'change'); return; }
  if (e.target.matches && e.target.matches('[data-mc-count]')) {
    const idx = Number(e.target.dataset.mcCount);
    if (state.tempModuleConfigs && state.tempModuleConfigs[idx]) state.tempModuleConfigs[idx].questionCount = Number(e.target.value) || 0;
    return;
  }
  if (e.target.dataset.rb) {
    const ci = Number(e.target.dataset.ci), li = Number(e.target.dataset.li), key = e.target.dataset.rb;
    if (key === 'name') state.tempRubric[ci].name = e.target.value;
    else if (key === 'weight') state.tempRubric[ci].weight = Number(e.target.value) || 0;
    else if (key === 'l_label') state.tempRubric[ci].levels[li].label = e.target.value;
    else if (key === 'l_mark') state.tempRubric[ci].levels[li].mark = Number(e.target.value) || 0;
    else if (key === 'l_desc') state.tempRubric[ci].levels[li].description = e.target.value;
    const tw = state.tempRubric.reduce((s,c) => s + c.weight, 0);
    const pill = document.querySelector('#rubricBuilderContainer .pill');
    if (pill) { pill.textContent = `${t('rb_total')}: ${tw}%`; if (tw !== 100) { pill.style.background = '#fdecea'; pill.style.color = 'var(--bad)'; } else { pill.style.background = ''; pill.style.color = ''; } }
    return;
  }
  if (e.target.matches && e.target.matches('[data-input="bank-search"]')) { state.params.bankSearch = e.target.value; render(); const inp = $('[data-input="bank-search"]'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); } return; }
  if (e.target.id === 'pickerSearch') renderPickerList();
  if (e.target.id === 'fePickerSearch') renderFePickerList();
});

window.addEventListener('storage', (e) => {
  if (e.key === DB_KEY) {
    try {
      DB = JSON.parse(e.newValue);
      if (checkStandaloneFinal()) {
        const feid = location.hash.substring(7).split('&')[0].split('#')[0];
        renderStandaloneFinal(feid);
      } else if (checkStandaloneQuiz()) {
        const aid = location.hash.substring(6).split('&')[0].split('#')[0];
        renderStandaloneQuiz(aid);
      } else render();
    } catch(err) {}
  }
});
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'quiz-submitted') {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) { DB = JSON.parse(raw); if (!checkStandaloneFinal() && !checkStandaloneQuiz()) render(); }
    } catch(err) {}
  }
});
window.addEventListener('focus', async () => {
  if (!state.user) return;
  if (document.querySelector('.modal-backdrop')) return;
  if (saveInFlight || saveTimer) return;
  try {
    const res = await driveAPI('loadState');
    if (res.ok && res.state && Array.isArray(res.state.users)) {
      if (JSON.stringify(res.state) !== JSON.stringify(DB)) {
        DB = res.state;
        migrateDB();
        try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch(e) {}
        render();
      }
    }
  } catch(e) {}
});
setInterval(async () => {
  if (!state.user) return;
  if (document.hidden) return;
  if (document.querySelector('.modal-backdrop')) return;
  if (saveInFlight || saveTimer || savePending) return;
  try {
    const res = await driveAPI('loadState');
    if (res.ok && res.state && Array.isArray(res.state.users)) {
      if (JSON.stringify(res.state) !== JSON.stringify(DB)) {
        DB = res.state;
        migrateDB();
        try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch(e) {}
        render();
        toast('🔄 Data dikemas kini dari server');
      }
    }
  } catch(e) {}
}, 20000);

/* =========================================================
   BOOT
   ========================================================= */
document.documentElement.lang = currentLang;
setTimeout(() => {
  try {
    fastBoot();
  } catch(e) {
    console.error('Boot error:', e);
    hideSplash();
    $('#app').innerHTML = `<div class="login-wrap"><div class="login-card"><h2>⚠️ Boot Error</h2><p class="muted">${esc(e.message || 'Unknown error')}</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div></div>`;
  }
}, 0);
</script>
</body>
