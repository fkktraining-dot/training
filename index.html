async function submitFinalAttempt(fe, pid, answers, isAuto) {
  const allQ = feQuestionsAll(fe);
  const score = allQ.reduce((s, q, i) => s + (answers[i] === q.answer ? 1 : 0), 0);
  const attempt = { id: uid('fea'), finalId: fe.id, participantId: pid, answers, score, total: allQ.length, at: nowISO(), auto: !!isAuto };
  DB.feAttempts.push(attempt);
  const auditRecord = { id: uid('au'), at: nowISO(), actorId: state.user ? state.user.id : 'system', actorName: state.user ? state.user.name : 'System', action: isAuto ? 'Submit Final (Auto)' : 'Submit Final', entity: 'Peperiksaan', entityId: `${fe.id}:${pid}`, details: `${userName(pid)} — ${score}/${allQ.length}` };
  DB.audit.push(auditRecord);
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch(e) {}
  const pct = Math.round(score / allQ.length * 100);
  const baseMsg = isAuto ? t('fe_auto_submit') : t('fe_score_format', score, allQ.length, pct);
  stopQuizTimer();
  renderStandaloneFinal(fe.id);
  try {
    const batch = [{ collection: 'feAttempts', records: [attempt] }, { collection: 'audit', records: [auditRecord] }];
    const res = await driveAPI('appendRecords', { batch });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Append failed');
    const fresh = await driveAPI('loadState');
    if (fresh.ok && fresh.state) {
      DB = fresh.state; migrateDB(); lastSyncedSnapshot = cloneDB(fresh.state);
      try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); localStorage.removeItem('cftpmy_pending_diff'); } catch(e) {}
    }
    pendingSaveSince = 0; updateBeforeUnload();
    const b = document.getElementById('syncBadge');
    if (b) { b.textContent = '✓'; b.style.background = '#e8f5ec'; b.style.color = '#1e7d4f'; }
    toast(baseMsg, isAuto ? 'warn' : 'ok');
  } catch (err) {
    console.warn('[submitFinalAttempt] appendRecords failed, falling back:', err);
    saveDB();
    await saveCritical(baseMsg, isAuto ? 'warn' : 'ok');
  }
  try { window.opener && window.opener.postMessage({ type:'quiz-submitted' }, '*'); } catch(e) {}
  try { localStorage.removeItem(feStartKeyFor(fe.id, pid)); } catch(e) {}
}

    const bestNote = showBestNote ? `<div class="info-box ok" style="margin-bottom:16px"><h4>🏆 ${t('best_score_note', bestPct + '%')}</h4><p style="margin:0">${t('this_attempt', latestPct + '%')}${attemptCount > 1 ? ` · ${t('retest_attempt_count', attemptCount)}` : ''}</p></div>` : (attemptCount > 1 ? `<div class="info-box" style="margin-bottom:16px"><p style="margin:0">📊 ${t('retest_attempt_count', attemptCount)}</p></div>` : '');
    app.innerHTML = `<div class="standalone-wrap"><div class="standalone-card">
      <div class="result-header"><h1>✅ ${t('quiz_completed')}</h1><div class="score-big" style="color:${latestPct >= 70 ? 'var(--ok)' : 'var(--warn)'}">${latestPct}%</div><p class="muted" style="margin:0">${t('quiz_correct_answers', latest.score, latest.total)} · ${fmtDateTime(latest.at)}${latest.auto ? ' · ⏱️ ' + t('quiz_auto_submitted') : ''}</p></div>
      ${bestNote}
      ${act.quiz.map((q, qi) => { const chosen = latest.answers[qi]; const correct = chosen === q.answer; return `<div class="q" style="border-color:${correct ? '#b8e0cf' : '#f3c8c3'}"><p class="q-text">${qi+1}. ${tce(q.q)}</p>${q.options.map((o, oi) => { let cls = 'opt'; if (oi === q.answer) cls += ' correct'; else if (oi === chosen) cls += ' wrong'; return `<div class="${cls}"><span>${'ABCD'[oi]}.</span><span>${tce(o)}</span></div>`; }).join('')}<small class="muted">${correct ? '✅ ' + t('quiz_answer_correct') : '❌ ' + t('quiz_answer_wrong')}</small></div>`; }).join('')}
      <div class="tab-actions"><button class="btn" onclick="window.close()">${t('btn_close_tab')}</button></div>
    </div></div>`; return;
  }
  const w = quizWindowStatus(act);
  const retestBanner = pendingRetest ? `<div class="retest-banner">🔄 ${t('retest_banner')}</div>` : '';
  if (w.state === 'not-open') {
    app.innerHTML = `<div class="standalone-wrap"><div class="standalone-card"><div class="quiz-header"><div class="logo">CF</div><div style="flex:1"><h1>${tce(act.title)}</h1><p class="muted" style="margin:0">${tce(moduleName(act.moduleId))} · ${tce(state.user.name)}</p></div></div>${retestBanner}<div class="info-box warn"><h4>🕐 ${t('quiz_not_open')}</h4><p style="margin:0">${t('quiz_not_open_notice', fmtDT(act.quizOpenAt))}</p>${act.quizDuration ? `<p style="margin:6px 0 0">${t('quiz_duration')}: <strong>${act.quizDuration} ${t('lbl_minutes')}</strong></p>` : ''}${act.quizCloseAt ? `<p style="margin:6px 0 0">${t('quiz_close_at')}: <strong>${fmtDT(act.quizCloseAt)}</strong></p>` : ''}</div><div style="text-align:center;padding:20px 0"><div style="font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:8px">${t('quiz_countdown')}</div><div id="openCountdown" style="font-size:2.2rem;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums">—</div></div><div class="info-box ok" style="margin-bottom:0"><p style="margin:0">📌 ${t('quiz_not_open_countdown_hint')}</p></div><div class="tab-actions"><button class="btn" onclick="window.close()">${t('btn_close_tab')}</button></div></div></div>`;
    startOpenCountdown(act); return;
  }
  if (w.state === 'closed') {
    app.innerHTML = `<div class="standalone-wrap"><div class="standalone-card"><div class="quiz-header"><div class="logo">CF</div><div style="flex:1"><h1>${tce(act.title)}</h1><p class="muted" style="margin:0">${tce(moduleName(act.moduleId))} · ${tce(state.user.name)}</p></div></div>${retestBanner}<div class="info-box warn"><h4>🔒 ${t('quiz_closed')}</h4><p style="margin:0">${t('quiz_closed_notice', act.quizCloseAt ? fmtDT(act.quizCloseAt) : '—')}</p></div><div class="tab-actions"><button class="btn" onclick="window.close()">${t('btn_close_tab')}</button></div></div></div>`; return;
  }
  const hasTimer = quizHasTimer(act);
  const durationMs = hasTimer ? (Number(act.quizDuration) * 60 * 1000) : 0;
  let remainingMs = 0;
  if (hasTimer) {
    const key = startKeyFor(act.id, pid);
    let startedAt = Number(localStorage.getItem(key)) || 0;
    const now = Date.now();
    if (!startedAt || startedAt < (w.open || 0) || startedAt > now) { startedAt = now; try { localStorage.setItem(key, String(startedAt)); } catch(e) {} }
    remainingMs = durationMs - (now - startedAt);
    if (remainingMs <= 0) { autoSubmitQuiz(act, pid); return; }
  }
  app.innerHTML = `<div class="standalone-wrap"><div class="standalone-card">
    ${retestBanner}
    <div class="quiz-header"><div class="logo">CF</div><div style="flex:1;min-width:220px"><h1>${tce(act.title)}</h1><p class="muted" style="margin:0">${tce(moduleName(act.moduleId))} · ${act.quiz.length} ${t('lbl_questions')} · ${tce(state.user.name)}</p></div>${hasTimer ? `<div class="quiz-timer" id="quizTimer"><span class="timer-label">${t('quiz_time')}</span><span class="timer-value" id="timerText">--:--</span></div>` : ''}</div>
    <div class="info-box ${hasTimer ? 'warn' : 'ok'}" style="margin-bottom:16px"><h4>${hasTimer ? '⏱️ ' + t('quiz_timed') : '📝 ' + t('quiz_ready')}</h4><p style="margin:0">${hasTimer ? t('quiz_timed_body', act.quizDuration) : t('quiz_ready_body')}</p>${act.quizCloseAt ? `<p style="margin:6px 0 0;font-size:.82rem">${t('quiz_close_hint', fmtDT(act.quizCloseAt))}</p>` : ''}</div>
    <form id="standalone-quiz-form">${act.quiz.map((q, qi) => `<div class="q"><p class="q-text">${qi+1}. ${tce(q.q)}</p>${q.options.map((o, oi) => `<label class="opt"><input type="radio" name="q${qi}" value="${oi}" ${oi === 0 ? 'required' : ''} /><span><strong>${'ABCD'[oi]}.</strong> ${tce(o)}</span></label>`).join('')}</div>`).join('')}<div class="tab-actions"><button type="button" class="btn" onclick="window.close()">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_submit')}</button></div></form>
  </div></div>`;
  document.getElementById('standalone-quiz-form').addEventListener('submit', (e) => { e.preventDefault(); handleStandaloneQuizSubmit(act, pid, e.target); });
  if (hasTimer) startQuizTimer(act, pid, remainingMs);
}

function tabNotificationCount(view) {
  const role = state.user?.role;
  const uid = String(state.user?.id || '');
  const mods = role === 'admin' || role === 'vip' ? DB.modules : (role === 'participant' ? participantModules(uid) : myModules());
  const mids = new Set((mods || []).map(m => String(m.id)));
  const scoped = arr => (arr || []).filter(x => !x.moduleId || mids.has(String(x.moduleId)));
  switch (view) {
    case 'programs': return role === 'participant' ? availableModules(uid).length : 0;
    case 'enrolled-programs': return role === 'participant' ? participantModules(uid).length : role === 'vip' ? 0 : (mods || []).length;
    case 'materials-library': return (mods || []).reduce((n,m)=>n+(m.materials||[]).length,0);
    case 'activities': return role === 'participant' ? pendingQuizzesFor(uid).length : scoped(DB.activities).length;
    case 'grading': return role === 'facilitator' ? myPendingSubmissionsCount(uid) : scoped(DB.pendingApprovals).length;
    case 'approvals': return role === 'admin' ? pendingApprovalCountAll() : pendingApprovalCountFor(uid);
    case 'attendance': return scoped(DB.attendance).length;
    case 'final': return role === 'participant' ? upcomingFinalExamsFor(uid,99).length : scoped(DB.finalExams).length;
    case 'bank': return scoped(DB.questionBank).length;
    case 'users': return (DB.users||[]).filter(u=>u.status==='pending').length;
    case 'participant-timetable': return scoped(DB.timetables).length;
    case 'assessment-performance': return scoped(DB.attempts).length + scoped(DB.practical).length;
    case 'rubrik': return scoped(DB.rubrics).length;
    case 'participant-assessment': return scoped(DB.attempts).length + scoped(DB.practical).length;
    case 'sijil': return scoped(DB.certificates).length;
    default: return 0;
  }
}
function tabUnreadCount(view) {
  try {
    const key = `cftp_tab_seen_${state.user?.id}_${view}`;
    const seen = Number(localStorage.getItem(key) || 0);
    return Math.max(0, tabNotificationCount(view) - seen);
  } catch (_) { return 0; }
}
function markTabRead(view) {
  try { localStorage.setItem(`cftp_tab_seen_${state.user?.id}_${view}`, String(tabNotificationCount(view))); } catch (_) {}
}
function playTabNotificationSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination); osc.type='sine'; osc.frequency.value=880;
    gain.gain.setValueAtTime(.0001,ctx.currentTime); gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.025); gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.22);
    osc.start(); osc.stop(ctx.currentTime+.23); osc.onended=()=>ctx.close();
  } catch (_) {}
}
function navNotificationMarkup(view) {
  const n = tabUnreadCount(view);
  return n ? `<span class="tab-unread-badge" title="${currentLang==='en'?'Unread updates':'Maklumat belum dibaca'}">${n>99?'99+':n}</span>` : '';
}

function applyGlobalModuleFilter(sourceDB, selectedId) {

  const moduleName = String(module.name || '');

  const filtered = { ...sourceDB };

  filtered.activities = activities;
  filtered.enrollments = (sourceDB.enrollments || []).filter(e => String(e.moduleId || '') === String(selectedId));
  filtered.attempts = (sourceDB.attempts || []).filter(a => activityIds.has(String(a.activityId || a.aid || '')) || String(a.moduleId || '') === String(selectedId));
  filtered.attendance = (sourceDB.attendance || []).filter(a => String(a.moduleId || '') === String(selectedId) || activityIds.has(String(a.activityId || a.aid || '')));
  filtered.practical = (sourceDB.practical || []).filter(a => activityIds.has(String(a.activityId || a.aid || '')) || String(a.moduleId || '') === String(selectedId));
  filtered.questionBank = (sourceDB.questionBank || []).filter(q => !q.moduleId || String(q.moduleId) === String(selectedId));
  filtered.rubrics = (sourceDB.rubrics || []).filter(r => !r.moduleId || String(r.moduleId) === String(selectedId) || activityIds.has(String(r.activityId || '')));
  filtered.timetables = (sourceDB.timetables || []).filter(t => String(t.moduleId || '') === String(selectedId));
  filtered.finalExams = (sourceDB.finalExams || []).filter(f => String(f.moduleId || '') === String(selectedId) || (f.moduleConfigs || []).some(c => String(c.moduleId || '') === String(selectedId)) || (f.moduleIds || []).some(id => String(id) === String(selectedId)));
  const finalIds = new Set(filtered.finalExams.map(f => String(f.id)));
  filtered.feAttempts = (sourceDB.feAttempts || []).filter(a => finalIds.has(String(a.finalExamId || a.examId || '')) || String(a.moduleId || '') === String(selectedId));
  filtered.fePractical = (sourceDB.fePractical || []).filter(a => finalIds.has(String(a.finalExamId || a.examId || '')) || String(a.moduleId || '') === String(selectedId));
  filtered.retests = (sourceDB.retests || []).filter(a => activityIds.has(String(a.activityId || a.aid || '')) || String(a.moduleId || '') === String(selectedId));
  filtered.pendingApprovals = (sourceDB.pendingApprovals || []).filter(a => activityIds.has(String(a.activityId || a.aid || '')) || String(a.moduleId || '') === String(selectedId));
  return filtered;
}

async function handleLogin(form) {
  const btn = form.querySelector('button[type="submit"]');
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Memeriksa…'; }
  const doLogin = () => {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
    const idInput = String(form.email.value || '').trim().toLowerCase();
    const passInput = String(form.password.value || '').trim();
    if (!idInput || !passInput) { toast(t('msg_required'), 'bad'); return; }
    const u = DB.users.find(x => {
      const xUser = String(x.username || '').trim().toLowerCase();
      const xEmail = String(x.email || '').trim().toLowerCase();
      const xPass = String(x.password ?? '').trim();
      return (xUser === idInput || xEmail === idInput) && xPass === passInput;
    });
    if (!u) { toast(t('msg_invalid_login'), 'bad'); return; }
    if (u.status === 'pending') { toast('⏳ ' + t('msg_account_pending'), 'warn'); return; }
    if (u.status === 'rejected') { toast('⛔ ' + t('msg_account_rejected'), 'bad'); return; }
    state.user = u; state.view = 'dashboard'; state.params = {};
    localStorage.setItem(SESSION_KEY, u.id);
    try { sessionStorage.removeItem('cftpmy_login_draft'); } catch(e) {}
    logAudit('Login', 'Sesi', u.id, u.name);
    try { history.replaceState({ view: 'dashboard', params: {}, cftp: true }, ''); lastPushedStateKey = stateKeyOf('dashboard', {}); } catch(e) {}
    render();
  };
  if (firstSyncDone || !firstSyncPromise) doLogin();
  else { if (btn) btn.textContent = '⏳ Sinkronisasi…'; Promise.race([firstSyncPromise, new Promise(r => setTimeout(r, 12000))]).then(doLogin); }
}

function handleRegister(form) {
  const name = form.name.value.trim(), username = form.username.value.trim(), email = form.email.value.trim().toLowerCase();
  const org = form.org ? form.org.value.trim() : '';
  const pass = form.password.value, cp = form.confirmPassword.value;
  if (!name || !username || !email || !pass || !org) { toast(t('msg_required'), 'bad'); return; }
  const registeredCompanies = companyList();
  const matchedCompany = registeredCompanies.find(company => sameCompany(company, org));
  if (!matchedCompany) { toast(currentLang === 'en' ? 'Please select a company from the registered company list.' : 'Sila pilih syarikat daripada senarai syarikat yang telah didaftarkan.', 'bad'); return; }
  if (!/^[A-Za-z0-9_]{3,}$/.test(username)) { toast(t('username_invalid'), 'bad'); return; }
  if (!assessPassword(pass).allMet) { toast(t('pwd_format_invalid'), 'bad'); return; }
  if (pass !== cp) { toast(t('password_mismatch'), 'bad'); return; }
  if (DB.users.find(x => String(x.username||'').toLowerCase() === username.toLowerCase())) { toast(t('username_taken'), 'bad'); return; }
  if (DB.users.find(x => String(x.email||'').toLowerCase() === email)) { toast(t('msg_email_taken'), 'bad'); return; }
  const nu = { id: uid('u'), username, name, email, password: pass, role: 'participant', org: matchedCompany, ic: '', phone: '', status: 'pending', createdAt: nowISO() };
  DB.users.push(nu); saveDB();
  state.loginMode = 'login';
  try { sessionStorage.removeItem('cftpmy_register_draft'); } catch(e) {}
  logAudit('Register (Pending Approval)', 'Pengguna', nu.id, name);
  toast('✅ ' + t('register_pending_success')); render();
}

function exportVipCompanyParticipantsExcel() {
  if (!state.user || state.user.role !== 'vip') {
    toast(t('msg_no_access'), 'bad');
    return;
  }
  if (!ensureXLSX()) return;

  const org = String(state.user.org || '').trim();
  if (!org) {
    toast(currentLang === 'en'
      ? 'Your VIP account has no company assigned. Please contact the administrator.'
      : 'Akaun VIP anda belum ditetapkan kepada syarikat. Sila hubungi pentadbir.', 'bad');
    return;
  }

  // Enforce company scope at export time, not only in the UI.
  const participants = allParticipants()
    .filter(p => sameCompany(p.org, org))
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  if (!participants.length) {
    toast(currentLang === 'en'
      ? 'No approved participants were found for your company.'
      : 'Tiada peserta yang diluluskan ditemui untuk syarikat anda.', 'warn');
    return;
  }

  const en = currentLang === 'en';
  const summaryHeader = en
    ? ['Participant ID', 'Participant Name', 'Email', 'Company', 'Modules Enrolled', 'Published Activities', 'Activities Assessed', 'Average Score (%)', 'Performance Status']
    : ['ID Peserta', 'Nama Peserta', 'E-mel', 'Syarikat', 'Modul Didaftar', 'Aktiviti Diterbitkan', 'Aktiviti Dinilai', 'Purata Markah (%)', 'Status Prestasi'];
  const detailHeader = en
    ? ['Participant ID', 'Participant Name', 'Email', 'Company', 'Module', 'Activity', 'Activity Date', 'Quiz Score', 'Quiz Total', 'Quiz (%)', 'Practical (%)', 'Overall (%)', 'Attendance', 'Assessment Status']
    : ['ID Peserta', 'Nama Peserta', 'E-mel', 'Syarikat', 'Modul', 'Aktiviti', 'Tarikh Aktiviti', 'Markah Kuiz', 'Jumlah Kuiz', 'Kuiz (%)', 'Amali (%)', 'Keseluruhan (%)', 'Kehadiran', 'Status Penilaian'];

  const summaryRows = [summaryHeader];
  const detailRows = [detailHeader];

  participants.forEach(p => {
    const modules = participantModules(p.id);
    const activities = accessibleActivities(p.id);
    const scores = activities.map(a => ({ a, s: scoreFor(a, p.id) }));
    const assessed = scores.filter(x => x.s.hasData);
    const average = assessed.length
      ? Math.round(avg(assessed.map(x => x.s.overall)))
      : '';

    let status = '';
    if (average === '') status = en ? 'Not assessed' : 'Belum dinilai';
    else if (average >= 80) status = en ? 'Excellent' : 'Cemerlang';
    else if (average >= 70) status = en ? 'Competent' : 'Kompeten';
    else status = en ? 'Needs improvement' : 'Perlu penambahbaikan';

    summaryRows.push([
      p.id || '', p.name || '', p.email || '', p.org || '',
      modules.length, activities.length, assessed.length, average, status
    ]);

    scores.forEach(({ a, s }) => {
      const attempt = s.attempt;
      const practical = s.pracPct !== null ? s.pracPct : '';
      const attendance = s.attendance
        ? (s.attendance.status || '')
        : '';
      detailRows.push([
        p.id || '', p.name || '', p.email || '', p.org || '',
        moduleName(a.moduleId), a.title || '', a.date || '',
        attempt ? attempt.score : '', attempt ? attempt.total : '',
        s.quizPct !== null ? s.quizPct : '', practical,
        s.overall !== null ? s.overall : '', attendance,
        s.hasData ? (en ? 'Assessed' : 'Dinilai') : (en ? 'Not assessed' : 'Belum dinilai')
      ]);
    });
  });

  const wb = XLSX.utils.book_new();
  const summaryWs = XLSX.utils.aoa_to_sheet(summaryRows);
  const detailWs = XLSX.utils.aoa_to_sheet(detailRows);
  summaryWs['!cols'] = [
    {wch:22},{wch:28},{wch:32},{wch:24},{wch:18},{wch:20},{wch:20},{wch:18},{wch:22}
  ];
  detailWs['!cols'] = [
    {wch:22},{wch:28},{wch:32},{wch:24},{wch:28},{wch:32},{wch:16},
    {wch:14},{wch:14},{wch:12},{wch:14},{wch:14},{wch:18},{wch:20}
  ];
  if (summaryRows.length > 1) summaryWs['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:summaryRows.length-1,c:summaryHeader.length-1}}) };
  if (detailRows.length > 1) detailWs['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:detailRows.length-1,c:detailHeader.length-1}}) };
  XLSX.utils.book_append_sheet(wb, summaryWs, en ? 'Participant Summary' : 'Ringkasan Peserta');
  XLSX.utils.book_append_sheet(wb, detailWs, en ? 'Activity Details' : 'Butiran Aktiviti');

  const safeOrg = org.replace(/[^a-z0-9_-]+/gi, '_').replace(/^_+|_+$/g, '') || 'Company';
  XLSX.writeFile(wb, `VIP_Participant_Data_${safeOrg}.xlsx`);
  toast(en
    ? `Exported ${participants.length} company participants to Excel.`
    : `${participants.length} peserta syarikat berjaya dieksport ke Excel.`, 'ok');
}

function renderParticipantOverallModuleSpider(pid, modules) {
  const participantActs = accessibleActivities(pid).filter(a => a.published);
  const axes = (modules || []).map(mod => {
    const values = [];
    participantActs.filter(a => a.moduleId === mod.id).forEach(act => {
      const criteria = getRubricCriteria(act);
      const practical = getPractical(act.id, pid);
      criteria.forEach((criterion, ci) => {
        const mark = practical && Array.isArray(practical.scores) && practical.scores[ci] !== undefined
          ? Number(practical.scores[ci]) : null;
        const maxMark = Math.max(0, ...(criterion.levels || []).map(level => Number(level.mark) || 0));
        if (mark !== null && Number.isFinite(mark) && maxMark > 0) {
          values.push({ value: Math.max(0, Math.min(100, mark / maxMark * 100)), weight: Math.max(0, Number(criterion.weight) || 0) });
        }
      });
    });
    if (!values.length) return { id:mod.id, label:mod.name || 'Module', value:null, count:0 };
    const weightTotal = values.reduce((sum, x) => sum + x.weight, 0);
    const score = weightTotal > 0
      ? values.reduce((sum, x) => sum + x.value * x.weight, 0) / weightTotal
      : values.reduce((sum, x) => sum + x.value, 0) / values.length;
    return { id:mod.id, label:mod.name || 'Module', value:score, count:values.length };
  });
  if (!axes.length) return '';
  const W=520, H=410, cx=260, cy=190, R=120, n=axes.length;
  const pointAt=(i,pct)=>{const angle=-Math.PI/2+2*Math.PI*i/n, rr=R*pct/100;return{x:cx+rr*Math.cos(angle),y:cy+rr*Math.sin(angle),angle};};
  const grid=[20,40,60,80,100].map(level=>`<polygon points="${axes.map((_,i)=>{const q=pointAt(i,level);return `${q.x.toFixed(1)},${q.y.toFixed(1)}`;}).join(' ')}" fill="none" stroke="#dce7e2" stroke-width="1"/>`).join('');
  const spokes=axes.map((_,i)=>{const q=pointAt(i,100);return `<line x1="${cx}" y1="${cy}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="#dce7e2" stroke-width="1"/>`;}).join('');
  const ticks=[20,40,60,80,100].map(v=>`<text x="${cx+4}" y="${(cy-R*v/100+3).toFixed(1)}" font-size="8" fill="#80918a">${v}</text>`).join('');
  const scored=axes.map((a,i)=>({...a,i,p:a.value===null?null:pointAt(i,a.value)}));
  const points=scored.filter(a=>a.p);
  let shape='';
  if(points.length>=3 && points.length===axes.length) shape=`<polygon points="${scored.map(a=>`${a.p.x.toFixed(1)},${a.p.y.toFixed(1)}`).join(' ')}" fill="rgba(21,128,91,.16)" stroke="#15805b" stroke-width="2.5" stroke-linejoin="round"/>`;
  else for(let i=0;i<scored.length;i++){const a=scored[i],b=scored[(i+1)%scored.length];if(a.p&&b.p&&scored.length>1)shape+=`<line x1="${a.p.x}" y1="${a.p.y}" x2="${b.p.x}" y2="${b.p.y}" stroke="#15805b" stroke-width="2.5" stroke-linecap="round"/>`;}
  const markers=scored.map(a=>{const q=a.p||pointAt(a.i,100);return `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="4.5" fill="${a.p?'#15805b':'#fff'}" stroke="${a.p?'#fff':'#aab8b1'}" stroke-width="1.5"><title>${esc(a.label)}: ${a.value===null?esc(t('spider_not_taken')):Math.round(a.value)+'%'}</title></circle>`;}).join('');
  const labels=scored.map(a=>{const q=pointAt(a.i,120),anchor=Math.abs(Math.cos(q.angle))<.28?'middle':(Math.cos(q.angle)>0?'start':'end'),label=String(a.label);const short=label.length>25?label.slice(0,22)+'…':label;return `<text x="${q.x.toFixed(1)}" y="${q.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="${n>8?8:9}" fill="#52645c"><title>${esc(label)}</title>${esc(short)}</text>`;}).join('');
  const scoredCount=axes.filter(a=>a.value!==null).length;
  const rows=axes.map(a=>`<tr><td><strong>${tce(a.label)}</strong></td><td>${a.count}</td><td>${a.value!==null?`<strong>${Math.round(a.value)}%</strong>`:`<span class="muted">${t('spider_not_taken')}</span>`}</td><td>${a.value!==null?`<span class="badge ok">${t('spider_assessed')}</span>`:`<span class="badge draft">${t('spider_not_taken')}</span>`}</td></tr>`).join('');
  const heading=currentLang==='en'?'Overall Performance — Combined Modules':'Prestasi Keseluruhan — Gabungan Semua Modul';
  const desc=currentLang==='en'?'One overall spider web for this participant. Each axis is one enrolled module; each module score is the weighted average of assessed rubric-criterion percentages (or a simple average when weights are zero).':'Satu spider web keseluruhan untuk peserta ini. Setiap paksi mewakili satu modul yang diambil; skor modul ialah purata berwajaran peratus kriteria rubrik yang telah dinilai (atau purata biasa jika semua wajaran sifar).';
  return `<div class="spider-module overall-participant-spider"><div class="spider-module-head"><h3>🕸️ ${heading}</h3><span class="badge info">${scoredCount}/${axes.length} ${currentLang==='en'?'modules assessed':'modul dinilai'}</span></div><p class="muted" style="font-size:.8rem;margin:8px 0">${desc}</p><div class="spider-layout"><div class="spider-chart-wrap"><svg class="spider-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(heading)}">${grid}${spokes}${ticks}${shape}${markers}${labels}</svg><div class="spider-legend"><span class="spider-legend-dot"></span>${currentLang==='en'?'Overall module score (%)':'Skor keseluruhan modul (%)'}</div></div><div class="spider-data"><div class="table-wrap"><table><thead><tr><th>${currentLang==='en'?'Module':'Modul'}</th><th>${currentLang==='en'?'Assessed criteria':'Kriteria dinilai'}</th><th>${currentLang==='en'?'Overall score':'Skor keseluruhan'}</th><th>${t('lbl_status')}</th></tr></thead><tbody>${rows}</tbody></table></div>${scoredCount===0?`<p class="muted" style="font-size:.8rem">${t('spider_no_scores')}</p>`:''}</div></div></div>`;
}

function renderParticipantAssessmentSpider(pid, modules) {
  const moduleCards = (modules || []).map(mod => {
    const modActs = accessibleActivities(pid).filter(a => a.moduleId === mod.id && a.published);
    const axes = [];
    modActs.forEach(act => {
      const criteria = getRubricCriteria(act);
      if (!criteria.length) return;
      const practical = getPractical(act.id, pid);
      criteria.forEach((criterion, ci) => {
        const selectedMark = practical && Array.isArray(practical.scores) && practical.scores[ci] !== undefined
          ? Number(practical.scores[ci]) : null;
        const maxMark = Math.max(0, ...(criterion.levels || []).map(level => Number(level.mark) || 0));
        const pct = selectedMark !== null && maxMark > 0
          ? Math.max(0, Math.min(100, (selectedMark / maxMark) * 100)) : null;
        const selectedLevel = selectedMark === null ? '' : ((criterion.levels || []).find(level => Number(level.mark) === selectedMark)?.label || '');
        axes.push({
          label: criterion.name || `Criterion ${ci + 1}`,
          shortLabel: criterion.name || `Criterion ${ci + 1}`,
          activityTitle: act.title,
          weight: Number(criterion.weight) || 0,
          mark: selectedMark,
          maxMark,
          level: selectedLevel,
          value: pct
        });
      });
    });
    if (!axes.length) return `<div class="spider-module"><h3>${tce(mod.name)}</h3><div class="empty">${t('spider_no_assessments')}</div></div>`;

    const W = 480, H = 390, cx = 240, cy = 178, R = 112;
    const n = axes.length;
    const pointAt = (i, pct) => {
      const angle = (-Math.PI / 2) + (2 * Math.PI * i / n);
      const rr = R * (pct / 100);
      return { x: cx + rr * Math.cos(angle), y: cy + rr * Math.sin(angle), angle };
    };
    const grid = [20,40,60,80,100].map(level => {
      const pts = axes.map((_,i) => { const p = pointAt(i, level); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(' ');
      return `<polygon points="${pts}" fill="none" stroke="#dce7e2" stroke-width="1"/>`;
    }).join('');
    const spokes = axes.map((_,i) => {
      const p = pointAt(i,100);
      return `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#dce7e2" stroke-width="1"/>`;
    }).join('');
    const ticks = [20,40,60,80,100].map(level => `<text x="${cx+4}" y="${(cy-R*level/100+3).toFixed(1)}" font-size="8" fill="#80918a">${level}</text>`).join('');
    const valid = axes.map((a,i) => ({...a, i, p: a.value === null ? null : pointAt(i, a.value)}));
    const allScored = valid.every(v => v.p);
    const segments = [];
    if (allScored && valid.length >= 3) {
      segments.push(`<polygon points="${valid.map(v => `${v.p.x.toFixed(1)},${v.p.y.toFixed(1)}`).join(' ')}" fill="rgba(21,128,91,.16)" stroke="#15805b" stroke-width="2.5" stroke-linejoin="round"/>`);
    } else {
      for (let i=0;i<valid.length;i++) {
        const a = valid[i], b = valid[(i+1)%valid.length];
        if (a.p && b.p && valid.length > 1) segments.push(`<line x1="${a.p.x}" y1="${a.p.y}" x2="${b.p.x}" y2="${b.p.y}" stroke="#15805b" stroke-width="2.5" stroke-linecap="round"/>`);
      }
    }
    const markers = valid.map(v => v.p
      ? `<circle cx="${v.p.x}" cy="${v.p.y}" r="4.5" fill="#15805b" stroke="#fff" stroke-width="1.5"><title>${esc(v.label)}: ${Math.round(v.value)}%</title></circle>`
      : `<circle cx="${pointAt(v.i,100).x}" cy="${pointAt(v.i,100).y}" r="4" fill="#fff" stroke="#aab8b1" stroke-width="1.5"><title>${esc(v.label)}: ${esc(t('spider_not_taken'))}</title></circle>`
    ).join('');
    const labels = axes.map((a,i) => {
      const p = pointAt(i, 121);
      const anchor = Math.abs(Math.cos(p.angle)) < .28 ? 'middle' : (Math.cos(p.angle) > 0 ? 'start' : 'end');
      const short = a.shortLabel.length > 27 ? a.shortLabel.slice(0,24) + '…' : a.shortLabel;
      return `<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle" font-size="${n>9?8:9}" fill="#52645c"><title>${esc(a.label)} · ${esc(a.activityTitle)}</title>${esc(short)}</text>`;
    }).join('');

function renderApprovalCard(pa) {
  const isPending = pa.status === 'pending';
  let typeLabel = '', targetLabel = '', rubric = [], current = null;
  if (pa.type === 'practical') {
    const act = getActivity(pa.activityId); if (!act) return '';
    typeLabel = '📏 ' + t('act_practical_eval');
    targetLabel = `${tce(act.title)} · ${tce(moduleName(act.moduleId))}`;
    rubric = getRubricCriteria(act);
    current = getPractical(pa.activityId, pa.participantId);
  } else if (pa.type === 'final-practical') {
    const fe = getFinalExam(pa.finalId); if (!fe) return '';
    typeLabel = '🎓 ' + t('fe_type_practical');
    targetLabel = `${tce(fe.title)} · ${tce(feModulesLabel(fe))}`;
    const rb = getRubricById(fe.rubricId);
    rubric = rb ? rb.criteria : [];
    current = fePracticalFor(pa.finalId, pa.participantId);
  }
  const pName = userName(pa.participantId);
  const subBy = userName(pa.submittedBy);
  const statusBadge = pa.status === 'pending' ? `<span class="badge warn">⏳ ${t('pa_pending')}</span>` : pa.status === 'approved' ? `<span class="badge ok">✓ ${t('pa_approved')}</span>` : `<span class="badge bad">✖ ${t('pa_rejected')}</span>`;
  const curTotal = current ? current.total : null;
  const newTotal = pa.data.total;
  const diffHtml = `<div class="ap-diff"><div class="ap-box"><div class="ap-k">${t('pa_current_value')}</div><div class="ap-v">${curTotal !== null ? curTotal.toFixed(1) + '%' : '—'}</div></div><div class="ap-box"><div class="ap-k">${t('pa_new_value')}</div><div class="ap-v">${newTotal.toFixed(1)}%</div></div></div>`;
  let critHtml = '';
  if (rubric.length && pa.data.scores) {
    critHtml = `<table class="ap-crit-table"><thead><tr><th style="text-align:left">${t('rb_col_name')}</th><th style="text-align:center">${t('pa_current_value')}</th><th style="text-align:center">${t('pa_new_value')}</th></tr></thead><tbody>${rubric.map((c, i) => { const curMark = current && current.scores ? current.scores[i] : null; const newMark = pa.data.scores[i]; return `<tr><td>${tce(c.name)}</td><td style="text-align:center">${curMark !== null && curMark !== undefined ? curMark : '—'}</td><td style="text-align:center"><strong>${newMark}</strong></td></tr>`; }).join('')}</tbody></table>`;
  }
  const actions = isPending ? `<div class="ap-actions"><button class="btn btn-sm btn-danger" data-act="pa-reject" data-id="${pa.id}">✖ ${t('pa_reject')}</button><button class="btn btn-sm btn-primary" data-act="pa-approve" data-id="${pa.id}">✅ ${t('pa_approve')}</button></div>` : (pa.reviewRemarks ? `<div style="font-size:.78rem;color:var(--muted);margin-top:8px"><strong>${t('pa_reject_reason')}:</strong> ${tce(pa.reviewRemarks)}</div>` : '');
  return `<div class="approval-card" style="${!isPending ? 'border-color:var(--line);background:#fbfdfc' : ''}">
    <div class="ap-head">
      <div><div class="ap-title">${typeLabel} — ${tce(pName)}</div><div class="ap-meta">${targetLabel}</div><div class="ap-meta">📤 ${t('pa_submitted_by')}: <strong>${tce(subBy)}</strong> · ${fmtDateTime(pa.submittedAt)}</div></div>
      <div>${statusBadge}</div>
    </div>
    ${diffHtml}
    ${critHtml}
    ${pa.data.remarks ? `<div style="font-size:.82rem;margin:8px 0"><strong>${t('pf_remarks')}:</strong> ${tce(pa.data.remarks)}</div>` : ''}
    ${actions}
  </div>`;
}

function approvePendingApproval(paId) {
  const pa = (DB.pendingApprovals || []).find(x => x.id === paId);
  if (!pa || pa.status !== 'pending') return;
  if (pa.type === 'practical') {
    let rec = DB.practical.find(x => x.activityId === pa.activityId && x.participantId === pa.participantId);
    if (rec) Object.assign(rec, pa.data, { by: state.user.id, at: nowISO() });
    else DB.practical.push(Object.assign({ id: uid('pr'), activityId: pa.activityId, participantId: pa.participantId, by: state.user.id, at: nowISO() }, pa.data));
  } else if (pa.type === 'final-practical') {
    let rec = DB.fePractical.find(x => x.finalId === pa.finalId && x.participantId === pa.participantId);
    if (rec) Object.assign(rec, pa.data, { by: state.user.id, at: nowISO() });
    else DB.fePractical.push(Object.assign({ id: uid('fep'), finalId: pa.finalId, participantId: pa.participantId, by: state.user.id, at: nowISO() }, pa.data));
  }
  pa.status = 'approved'; pa.reviewedBy = state.user.id; pa.reviewedAt = nowISO();
  saveDB();
  logAudit('Approve Correction', 'Penilaian', pa.type + ':' + pa.id, userName(pa.participantId));
  render();
  saveCritical('✅ ' + t('pa_approved_msg'));
}
function rejectPendingApproval(paId, reason) {
  const pa = (DB.pendingApprovals || []).find(x => x.id === paId);
  if (!pa || pa.status !== 'pending') return;
  pa.status = 'rejected'; pa.reviewedBy = state.user.id; pa.reviewedAt = nowISO(); pa.reviewRemarks = reason || '';
  saveDB();
  logAudit('Reject Correction', 'Penilaian', pa.type + ':' + pa.id, userName(pa.participantId) + (reason ? ' — ' + reason : ''));
  toast(t('pa_rejected_msg')); render();
}

/** Pull existing materials from Drive into the module record, so old Drive files
 * are shown even if they were not uploaded through this app or were never saved
 * in m.materials. */
async function refreshModuleMaterialsFromDrive(mid, quiet = false) {
  const m = getModule(mid);
  if (!m) { if (!quiet) toast(t('msg_not_found'), 'bad'); return false; }
  try {
    const res = await driveAPI('listModuleMaterials', { moduleId: m.id, moduleName: m.name });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Google Drive list failed');
    const existing = Array.isArray(m.materials) ? m.materials : [];
    const byFileId = new Map(existing.filter(x => x.fileId).map(x => [String(x.fileId), x]));
    const merged = existing.slice();
    (Array.isArray(res.files) ? res.files : []).forEach(f => {
      if (!f || !f.id) return;
      const found = byFileId.get(String(f.id));
      if (found) {
        Object.assign(found, { downloadUrl: f.downloadUrl || found.downloadUrl, viewUrl: f.viewUrl || found.viewUrl, previewUrl: f.previewUrl || found.previewUrl, folderId: f.folderId || found.folderId, folderUrl: f.folderUrl || found.folderUrl, size: f.size || found.size, mime: f.mimeType || found.mime });
      } else {
        const mat = {
          id: 'drive_' + String(f.id), fileId: String(f.id), name: f.name || 'Drive file', originalName: f.name || 'Drive file',
          type: fileTypeFromName(f.name || ''), mime: f.mimeType || 'application/octet-stream', size: Number(f.size) || 0,
          downloadUrl: f.downloadUrl || '', viewUrl: f.viewUrl || f.url || '', previewUrl: f.previewUrl || f.viewUrl || f.url || '',
          folderId: f.folderId || res.folderId || null, folderUrl: f.folderUrl || res.folderUrl || null,
          description: f.description || '', uploadedBy: null, uploadedAt: f.createdAt || f.updatedAt || null, fromDrive: true
        };
        merged.push(mat); byFileId.set(String(f.id), mat);
      }
    });
    m.materials = merged;
    saveDB();
    if (!quiet) toast(currentLang === 'en' ? `Google Drive checked: ${res.files ? res.files.length : 0} file(s) found.` : `Google Drive disemak: ${res.files ? res.files.length : 0} fail ditemui.`, 'ok');
    if (state.view === 'module' && state.params && state.params.moduleId === mid) render();
    return true;
  } catch (err) {
    console.error('refreshModuleMaterialsFromDrive failed:', err);
    if (!quiet) toast((currentLang === 'en' ? 'Cannot load module files from Google Drive: ' : 'Gagal memuatkan bahan daripada Google Drive: ') + (err.message || 'Unknown error'), 'bad');
    return false;
  }
}

function participantTimetableView() {
  const me = state.user;
  // Admin sees every module (including drafts/unpublished); VIP sees all published
  // programmes; other roles remain scoped to their own assigned/enrolled modules.
  const modules = (me.role === 'admin'
    ? sortModules(DB.modules)
    : me.role === 'vip'
      ? sortModules(DB.modules).filter(m => m.published !== false)
      : me.role === 'participant'
        ? participantModules(me.id)
        : myModules().filter(m => m.published !== false));
  const mids = new Set(modules.map(m => m.id));
  const entries = DB.timetables.filter(e => mids.has(e.moduleId)).map(e => ({...e, itemType:'entry', module:getModule(e.moduleId)}));
  modules.forEach(m => { if (m.startDate || m.endDate) entries.push({id:'module-range-'+m.id,moduleId:m.id,module:m,itemType:'range',date:m.startDate||m.endDate,endDate:m.endDate||m.startDate,startTime:m.startTime||'',endTime:m.endTime||'',title:m.name}); });
  entries.sort((a,b)=>((a.date||'')+' '+(a.startTime||'')).localeCompare((b.date||'')+' '+(b.startTime||'')));
  const toMinutes = v => { if(!v) return null; const a=String(v).split(':'); return Number(a[0])*60+Number(a[1]||0); };
  const slots=[]; for(let mins=8*60; mins<22*60; mins+=60) slots.push({mins,end:mins+60,label:`${String(Math.floor(mins/60)).padStart(2,'0')}:00–${String(Math.floor(mins/60)+1).padStart(2,'0')}:00`});
  const dates=[...new Set(entries.map(x=>x.date||'undated'))];
  const isAdminTimetable = me.role === 'admin';
  const renderItem = x => `<div style="min-width:115px;border:1px solid #9fc8bb;border-radius:7px;background:#edf8f3;padding:5px;margin:2px 0;color:var(--text);font-size:12px"><button type="button" class="tt-participant-event" data-act="participant-timetable-detail" data-id="${esc(x.id)}" data-kind="${x.itemType}" style="display:block;width:100%;text-align:left;border:0;background:transparent;padding:3px;cursor:pointer;color:inherit;font-size:inherit"><strong>${esc(x.startTime?fmtTime12(x.startTime)+' — '+fmtTime12(x.endTime||x.startTime):(currentLang==='en'?'Module period':'Tempoh modul'))}</strong><div style="font-weight:700;margin-top:3px">${tce(x.title||x.module?.name||'')}</div><small>${tce(x.module?.name||moduleName(x.moduleId))}${x.endDate&&x.endDate!==x.date?'<br>'+fmtDate(x.date)+' – '+fmtDate(x.endDate):''}</small></button>${isAdminTimetable && x.itemType==='entry' ? `<div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-sm" data-act="edit-timetable" data-tid="${esc(x.id)}" title="${t('btn_edit')}">✏️</button><button class="btn btn-sm btn-danger" data-act="delete-timetable" data-tid="${esc(x.id)}" title="${t('btn_delete')}">🗑️</button></div>` : ''}</div>`;

function openTimetableForm(mid, entryId) {
  const m = getModule(mid);

  if (!canManageTimetable(mid)) { toast(t('msg_no_access'), 'bad'); return; }
  const isEdit = !!entryId;
  const e = isEdit ? DB.timetables.find(x => x.id === entryId) : null;
  if (isEdit && !e) { toast(t('msg_not_found'), 'bad'); return; }
  const trainers = moduleTrainerIds(m).map(id => DB.users.find(u => u.id === id)).filter(Boolean);
  const facilitators = moduleFacilitatorIds(m).map(id => DB.users.find(u => u.id === id)).filter(Boolean);
  const legacyInstructor = String((isEdit ? e.instructor : '') || '');
  const v = isEdit ? e : { date: todayISO(), startTime: '09:00', endTime: '10:30', title: '', instructor: trainers.map(u=>u.name).join(', '), facilitator: facilitators.map(u=>u.name).join(', '), trainerIds: moduleTrainerIds(m), facilitatorIds: moduleFacilitatorIds(m), location: '', notes: '' };
  const trainerNames = trainers.map(u=>u.name).filter(Boolean);
  const facilitatorNames = facilitators.map(u=>u.name).filter(Boolean);
  if (!trainerNames.length && legacyInstructor && !facilitatorNames.includes(legacyInstructor)) trainerNames.push(legacyInstructor);
  const trainerDisplay = (v.trainerIds || []).length ? (v.trainerIds || []).map(id=>userName(id)).join(', ') : (v.instructor || trainerNames.join(', '));

  const endVal = normalizeTimeStr(v.endTime) || '10:30';

      <div class="grid2"><div class="field"><label>${t('tt_date')} *</label><input class="input" type="date" name="date" required value="${esc(v.date)}" /></div><div class="field"><label>${currentLang==='en'?'Assigned Trainer(s)':'Trainer Ditugaskan'}</label><input class="input" value="${esc(trainerDisplay || '—')}" readonly /><input type="hidden" name="trainerIds" value="${esc((v.trainerIds || moduleTrainerIds(m)).join(','))}" /><input type="hidden" name="trainerNames" value="${esc(trainerDisplay || '')}" /></div><div class="field"><label>${currentLang==='en'?'Assigned Facilitator(s)':'Fasilitator Ditugaskan'}</label><input class="input" value="${esc(facilitatorDisplay || '—')}" readonly /><input type="hidden" name="facilitatorIds" value="${esc((v.facilitatorIds || moduleFacilitatorIds(m)).join(','))}" /><input type="hidden" name="facilitatorNames" value="${esc(facilitatorDisplay || '')}" /><small class="muted">${currentLang==='en'?'Trainer and facilitator details are automatically taken from Module Information.':'Maklumat trainer dan fasilitator diambil secara automatik daripada Maklumat Modul.'}</small></div><div class="field"><label>${t('tt_start')} *</label><input class="input" type="time" name="startTime" required value="${esc(startVal)}" /></div><div class="field"><label>${t('tt_end')} *</label><input class="input" type="time" name="endTime" required value="${esc(endVal)}" /></div></div>
      <div class="field"><label>${t('tt_topic')} *</label><input class="input" name="title" required value="${esc(v.title)}" placeholder="${esc(t('tt_topic_placeholder'))}" /></div>
      <div class="field"><label>${t('tt_location')}</label><input class="input" name="location" value="${esc(v.location || '')}" placeholder="${esc(t('tt_location_placeholder'))}" /></div>
      <div class="field"><label>${t('tt_notes')}</label><textarea class="textarea" name="notes">${esc(v.notes || '')}</textarea></div>
      <div class="modal-actions"><button type="button" class="btn" data-act="close-modal">${t('btn_cancel')}</button><button type="submit" class="btn btn-primary">${t('btn_save')}</button></div>
    </form>`);
}
function handleSaveTimetable(form) {
  const mid = form.dataset.mid, tid = form.dataset.tid;
  const m = getModule(mid);
  if (!m) { toast(t('msg_not_found'), 'bad'); return; }
  if (!canManageTimetable(mid)) { toast(t('msg_no_access'), 'bad'); return; }
  const date = form.date.value;
  const startTime = normalizeTimeStr(form.startTime.value);
  const endTime = normalizeTimeStr(form.endTime.value);
  const title = form.title.value.trim();
  if (!date) { toast(t('tt_date_required'), 'bad'); return; }
  if (!title) { toast(t('tt_topic_required'), 'bad'); return; }
  if (endTime <= startTime) { toast(t('tt_invalid_time'), 'bad'); return; }
  const trainerIds = (form.trainerIds?.value || moduleTrainerIds(m).join(',')).split(',').map(x=>x.trim()).filter(Boolean); const facilitatorIds = (form.facilitatorIds?.value || moduleFacilitatorIds(m).join(',')).split(',').map(x=>x.trim()).filter(Boolean); const trainerNames = trainerIds.map(id=>userName(id)).filter(n=>n && n!=='—'); const facilitatorNames = facilitatorIds.map(id=>userName(id)).filter(n=>n && n!=='—'); const data = { moduleId: mid, date, startTime, endTime, title, trainerIds, facilitatorIds, trainerNames, facilitatorNames, instructor: trainerNames.join(', ') || (form.trainerNames?.value || ''), facilitator: facilitatorNames.join(', ') || (form.facilitatorNames?.value || ''), location: form.location.value.trim(), notes: form.notes.value.trim(), updatedAt: nowISO() };
  if (tid) { const e = DB.timetables.find(x => x.id === tid); if (e) Object.assign(e, data); logAudit('Update Timetable', 'Jadual', tid, title); toast(t('tt_updated')); }
  else { const ne = Object.assign({ id: uid('tt'), createdBy: state.user.id, createdAt: nowISO() }, data); DB.timetables.push(ne); logAudit('Create Timetable', 'Jadual', ne.id, title); toast(t('tt_added')); }
  saveDB(); closeModal(); render();
}
function deleteTimetableEntry(tid) {
  const e = DB.timetables.find(x => x.id === tid);
  if (!e) { toast(t('msg_not_found'), 'bad'); return; }
  if (!canManageTimetable(e.moduleId)) { toast(t('msg_no_access'), 'bad'); return; }
  if (!confirm(t('tt_confirm_delete'))) return;
  DB.timetables = DB.timetables.filter(x => x.id !== tid);
  saveDB(); logAudit('Delete Timetable', 'Jadual', tid, e.title); toast(t('tt_deleted')); render();
}

   FINAL EXAM
   ========================================================= */
function finalExamsView() {
  if (state.user.role === 'participant') return participantFinalView();
  const isAdmin = state.user.role === 'admin';
  const isVip = state.user.role === 'vip';
  const allExams = (DB.finalExams || []).slice().sort((a, b) => (a.openAt || '').localeCompare(b.openAt || ''));
  let exams = allExams;
  if (!isAdmin && !isVip) exams = allExams.filter(fe => feModuleIds(fe).some(mid => canTrainerAccessModule(mid)));
  const getMyModuleProgress = (fe) => {
    if (isAdmin || isVip) return null;
    const mine = (fe.moduleConfigs || []).filter(mc => { const m = getModule(mc.moduleId); return m && (moduleHasTrainer(m, state.user.id) || moduleHasFacilitator(m, state.user.id)); });
    if (!mine.length) return null;
    const count = mine.reduce((s, mc) => s + (mc.questions||[]).length, 0);
    const target = mine.reduce((s, mc) => s + (mc.questionCount||0), 0);
    const pending = mine.filter(mc => !mc.submitted && (mc.questionCount||0) > 0).length;
    return { count, target, pending, modules: mine.length };
  };
  return `<div class="card">
    <div class="card-head">
      <div><h2>🎓 ${t('fe_title')}</h2><small class="muted">${t('fe_sub')}</small></div>
      <div class="toolbar">
        ${isAdmin ? `<button class="btn btn-primary" data-act="new-final-exam">${t('fe_new')}</button>` : ''}
        ${isVip ? `<span class="badge info">${t('vip_read_only')}</span>` : ''}
      </div>
    </div>
    <div class="info-box" style="font-size:.82rem"><p style="margin:0">💡 ${t('fe_multi_module_hint')}</p></div>
    ${exams.length ? `<div class="table-wrap"><table><thead><tr>
      <th>${t('lbl_title')}</th><th>${t('fe_modules_included')}</th><th>${t('fe_type')}</th><th>${t('fe_open_at')}</th><th>${t('fe_preparation')}</th><th>${t('lbl_status')}</th><th style="width:420px">${t('lbl_actions')}</th>
    </tr></thead><tbody>${exams.map(fe => {
      const w = feWindowStatus(fe);
      const mods = fe.moduleConfigs || [];
      const submitted = feSubmittedModulesCount(fe);
      const total = mods.length;
      const qs = feTotalQuestions(fe);
      const expected = feTotalExpected(fe);
      const statusCls = !fe.published ? 'draft' : w.state === 'open' ? 'ok' : w.state === 'not-open' ? 'draft' : w.state === 'closed' ? 'bad' : 'info';
      const statusLbl = !fe.published ? '⚠️ ' + t('lbl_draft') : w.state === 'open' ? t('fe_status_open') : w.state === 'not-open' ? t('fe_status_not_open') : w.state === 'closed' ? t('fe_status_closed') : '—';
      const myProg = (!isAdmin && !isVip && fe.type === 'theory') ? getMyModuleProgress(fe) : null;
      let prepCell;
      if (fe.type === 'practical') prepCell = `<span class="badge ok">✓ ${t('rb_title')}</span>`;
      else if (myProg) prepCell = `<span class="badge ${myProg.pending > 0 ? 'warn' : 'ok'}">${myProg.count} / ${myProg.target} ${t('lbl_questions')}</span>${myProg.pending > 0 ? `<br><small class="muted">📝 ${myProg.pending} ${t('fe_module_pending')}</small>` : `<br><small class="muted">✓ ${t('fe_module_submitted')}</small>`}`;
      else prepCell = `<span class="badge ${submitted === total ? 'ok' : 'warn'}">${t('fe_modules_submitted', submitted, total)}</span><br><small class="muted">${qs} / ${expected} ${t('lbl_questions')}</small>`;
      const myPending = myProg ? myProg.pending : 0;
      return `<tr>
        <td><strong>${tce(fe.title)}</strong>${fe.description ? `<br><small class="muted">${tce(fe.description)}</small>` : ''}</td>
        <td><small class="muted">${tce(feModulesLabel(fe))}</small></td>
        <td><span class="badge ${fe.type === 'theory' ? 'info' : 'ok'}">${fe.type === 'theory' ? '📝 ' + t('fe_type_theory') : '📏 ' + t('fe_type_practical')}</span></td>
        <td>${fe.openAt ? fmtDT(fe.openAt) : '—'}${fe.closeAt ? `<br><small class="muted">→ ${fmtDT(fe.closeAt)}</small>` : ''}</td>
        <td>${prepCell}</td>
        <td><span class="badge ${statusCls}">${statusLbl}</span></td>
        <td><div class="toolbar">
          ${isVip ? `<button class="btn btn-sm btn-primary" data-act="vip-final-scores" data-id="${fe.id}">${t('vip_view_scores')}</button>` : ''}
          ${isAdmin ? `<button class="btn btn-sm" data-act="edit-final-exam" data-id="${fe.id}">✏️</button>` : ''}
          ${!isVip && fe.type === 'theory' && (isAdmin || (myProg && myProg.modules > 0)) ? `<button class="btn btn-sm ${(!isAdmin && myPending > 0) ? 'btn-primary' : ''}" data-act="fe-questions-overview" data-id="${fe.id}" title="${t('fe_questions')}">🗂️ ${isAdmin ? feTotalQuestions(fe) + '/' + feTotalExpected(fe) : (myProg ? myProg.count + '/' + myProg.target : '—')}${(!isAdmin && myPending > 0) ? ' 📝' : ''}</button>` : ''}
          ${!isVip && fe.type === 'theory' && (isAdmin || feModuleIds(fe).some(mid => canTrainerAccessModule(mid))) ? `${feTotalQuestions(fe) > 0 ? `<button class="btn btn-sm" data-act="fe-print-theory" data-id="${fe.id}">🖨️ ${currentLang==='en'?'Print Questions':'Cetak Soalan'}</button>` : ''}<button class="btn btn-sm" data-act="fe-theory-marks" data-id="${fe.id}">✍️ ${currentLang==='en'?'Enter Marks':'Masuk Markah'}</button>` : ''}
          ${!isVip && fe.type === 'practical' && (isAdmin || feModuleIds(fe).some(mid => canTrainerAccessModule(mid))) ? `<button class="btn btn-sm" data-act="fe-marks-template" data-id="${fe.id}">📥 ${currentLang==='en'?'Excel Template':'Template Excel'}</button><button class="btn btn-sm" data-act="fe-marks-upload" data-id="${fe.id}">📤 ${currentLang==='en'?'Upload Marks':'Upload Markah'}</button><button class="btn btn-sm" data-act="fe-print-rubric-all" data-id="${fe.id}">🖨️ ${currentLang==='en'?'Print Rubrics':'Cetak Rubrik'}</button><button class="btn btn-sm" data-act="fe-practical-participants" data-id="${fe.id}">✍️ ${currentLang==='en'?'Enter Marks':'Masuk Markah'}</button>` : ''}
          ${!isVip && fe.published && fe.type === 'theory' && feTotalQuestions(fe) > 0 ? `<button class="btn btn-sm" data-act="open-final-tab" data-id="${fe.id}" title="${t('quiz_preview')}">👁️</button>` : ''}
          ${isAdmin ? `<button class="btn btn-sm ${fe.published ? '' : 'btn-primary'}" data-act="toggle-final-publish" data-id="${fe.id}">${fe.published ? t('fe_unpublish') : '✅ ' + t('fe_publish')}</button><button class="btn btn-sm btn-danger" data-act="delete-final-exam" data-id="${fe.id}">🗑️</button>` : ''}
        </div></td>
      </tr>`;
    }).join('')}</tbody></table></div>` : `<div class="empty">${t('fe_no_exams')}</div>`}
  </div>`;
}

      else if (w.state === 'closed') body = `<div class="info-box warn"><h4>🔒 ${t('fe_status_closed')}</h4><p style="margin:0">${t('fe_closed_notice', fe.closeAt ? fmtDT(fe.closeAt) : '—')}</p></div>`;
      else body = `<div class="info-box ok"><h4>📝 ${fe.duration ? t('quiz_timed') : t('quiz_ready')}</h4><p style="margin:0">${fe.duration ? t('fe_timed_body', fe.duration) : t('fe_ready_body')}</p></div>`;

      else body = `<div class="info-box warn"><h4>🕐 ${t('fe_status_waiting')}</h4><p style="margin:0">${t('fe_practical_wait')}</p></div>`;
      if (rb) body += `<h4 style="margin:10px 0 6px">📏 ${tce(rb.name)}</h4><div class="table-wrap"><table><thead><tr><th>${t('rb_col_name')}</th><th>${t('rb_weights')}</th></tr></thead><tbody>${(rb.criteria||[]).map(c => `<tr><td>${tce(c.name)}</td><td>${c.weight}%</td></tr>`).join('')}</tbody></table></div>`;
    }
    return `<div class="card" style="margin-bottom:14px;box-shadow:none;border-color:${w.state === 'open' ? 'var(--brand-2)' : 'var(--line)'}"><div class="card-head"><div><h3 style="margin:0">${tce(fe.title)}</h3><small class="muted">${tce(feModulesLabel(fe))} · <span class="badge ${fe.type === 'theory' ? 'info' : 'ok'}">${fe.type === 'theory' ? t('fe_type_theory') : t('fe_type_practical')}</span> · ${fe.openAt ? fmtDT(fe.openAt) : '—'}${fe.duration ? ' · ⏱️ ' + fe.duration + 'm' : ''}${fe.type === 'theory' ? ` · ${allQ.length} ${t('lbl_questions')}` : ''}</small></div><span class="badge ${w.state === 'open' ? 'ok' : w.state === 'not-open' ? 'draft' : 'bad'}">${w.state === 'open' ? t('fe_status_open') : w.state === 'not-open' ? t('fe_status_not_open') : t('fe_status_closed')}</span></div>${fe.description ? `<p>${tce(fe.description)}</p>` : ''}${body}<div class="toolbar" style="margin-top:12px">${fe.type === 'theory' && w.state === 'open' && !attempt ? `<button class="btn btn-primary" data-act="open-final-tab" data-id="${fe.id}">📝 ${t('fe_take_tab')} →</button>` : ''}${fe.type === 'theory' && (attempt || w.state === 'not-open' || w.state === 'closed') ? `<button class="btn" data-act="open-final-tab" data-id="${fe.id}">👁️ ${t('fe_view')}</button>` : ''}${fe.type === 'practical' ? `<button class="btn" data-act="open-final-tab" data-id="${fe.id}">👁️ ${t('fe_view')}</button>` : ''}</div></div>`;
  }).join('') : `<div class="empty">${t('fe_no_exams')}</div>`}</div>`;
}

function handleSaveFinalExam(form) {
  const id = form.dataset.id;
  const type = form.type.value;
  const list = document.getElementById('moduleConfigsList');
  const rows = list ? list.querySelectorAll('[data-mc-row]') : [];
  const moduleConfigs = [];
  rows.forEach((row, i) => {
    const sel = row.querySelector(`[data-mc-select="${i}"]`);
    const cnt = row.querySelector(`[data-mc-count="${i}"]`);
    if (!sel) return;
    const moduleId = sel.value;
    const prev = (state.tempModuleConfigs || []).find(x => x.moduleId === moduleId) || {};
    const newQCount = type === 'practical' ? 0 : (cnt ? Number(cnt.value) || 0 : (prev.questionCount || 0));
    const prevQuestions = prev.questions || [];
    const isSubmitted = type === 'practical' ? true : (newQCount === 0 || prevQuestions.length >= newQCount);
    moduleConfigs.push({ moduleId, questionCount: newQCount, questions: prevQuestions, submitted: isSubmitted, submittedAt: isSubmitted ? (prev.submittedAt || nowISO()) : null, submittedBy: isSubmitted ? (prev.submittedBy || state.user.id) : null });
  });
  if (!form.title.value.trim()) { toast(t('msg_required'), 'bad'); return; }
  if (!moduleConfigs.length) { toast(t('msg_required'), 'bad'); return; }
  if (form.openAt.value && form.closeAt.value && form.openAt.value >= form.closeAt.value) { toast(t('qb_duration_mismatch'), 'bad'); return; }
  const data = {
    title: form.title.value.trim(), description: form.description.value.trim(), type, moduleConfigs,
    openAt: form.openAt.value || null, closeAt: form.closeAt.value || null,
    duration: form.duration.value && Number(form.duration.value) > 0 ? Number(form.duration.value) : null,
    rubricId: type === 'practical' && form.rubricId ? (form.rubricId.value || null) : null,
    published: form.published.value === 'true', updatedAt: nowISO()
  };
  if (id) { const fe = getFinalExam(id); if (!fe) return; Object.assign(fe, data); saveDB(); logAudit('Update Final Exam', 'Peperiksaan', id, data.title); toast(t('fe_saved')); }
  else { const nfe = Object.assign({ id: uid('fe'), createdBy: state.user.id, createdAt: nowISO() }, data); DB.finalExams.push(nfe); saveDB(); logAudit('Create Final Exam', 'Peperiksaan', nfe.id, nfe.title); toast(t('fe_saved')); }
  state.tempModuleConfigs = null;
  closeModal(); render();
}

function deleteFinalExam(id) {
  const fe = getFinalExam(id); if (!fe) return;
  if (!confirm(t('fe_delete_confirm', fe.title))) return;
  DB.finalExams = DB.finalExams.filter(x => x.id !== id);
  DB.feAttempts = (DB.feAttempts || []).filter(x => x.finalId !== id);
  DB.fePractical = (DB.fePractical || []).filter(x => x.finalId !== id);
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => !(x.type === 'final-practical' && x.finalId === id));
  saveDB(); logAudit('Delete Final Exam', 'Peperiksaan', id, fe.title); toast(t('fe_deleted')); render();
}

function toggleFinalPublish(id) {
  const fe = getFinalExam(id); if (!fe) return;
  if (!fe.published && fe.type === 'theory') {
    const submitted = feSubmittedModulesCount(fe);
    const total = (fe.moduleConfigs || []).length;
    const qs = feTotalQuestions(fe);
    if (submitted < total) { if (!confirm(t('fe_confirm_publish_incomplete', submitted, total, qs))) return; }
    else if (qs === 0) { if (!confirm(t('fe_confirm_publish_incomplete', submitted, total, 0))) return; }
  }
  if (!fe.published && fe.type === 'practical' && !fe.rubricId) { toast('⚠️ ' + t('grad_no_rubric'), 'bad'); return; }
  fe.published = !fe.published; fe.updatedAt = nowISO(); saveDB();
  logAudit(fe.published ? 'Publish Final' : 'Unpublish Final', 'Peperiksaan', id, fe.title);
  toast(fe.published ? t('fe_published') : t('fe_unpublished')); render();
}

  </div>
  <div class="info-box" style="font-size:.82rem"><p style="margin:0">💡 ${t('fe_multi_module_hint')}</p></div>

    ${allModules.map(({mc, m, canEdit}) => {
      const qCount = (mc.questions || []).length;

      return `<div class="fe-mod-submit-card ${cardCls}" style="${!canEdit ? 'opacity:.85;border-color:var(--line);background:#fbfdfc' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px"><div style="font-weight:700;font-size:.95rem">📦 ${tce(m ? m.name : mc.moduleId)}${canEdit ? '' : ' <span class="badge draft" style="font-size:.62rem">👁️</span>'}</div><div class="muted" style="font-size:.8rem;margin-top:2px">👤 ${tce(m ? moduleTrainerNames(m) : '—')} · ${qCount} / ${target} ${t('lbl_questions')} ${done ? ' · ✅ ' + t('fe_module_submitted') : ' · ⏳ ' + t('fe_module_pending')}</div></div>

function renderFeQuestionsBuilder() {
  const c = document.getElementById('feQuestionsSection'); if (!c) return;
  const qs = state.tempFeQuestions || [];
  const fe = getFinalExam(state.editingFinalExamId);
  const mc = fe ? (fe.moduleConfigs || []).find(x => x.moduleId === state.editingModuleId) : null;
  const target = mc ? (mc.questionCount || 0) : 0;
  const remaining = Math.max(0, target - qs.length);
  const bankCount = DB.questionBank.filter(b => b.moduleId === state.editingModuleId).length;
  c.innerHTML = `<div class="quiz-builder">
    <div class="info-box ${qs.length >= target ? 'ok' : 'warn'}" style="margin-bottom:12px"><p style="margin:0">${qs.length} / ${target} ${t('lbl_questions')} ${qs.length >= target && target > 0 ? '✓' : (remaining > 0 ? '— ' + remaining + ' ' + t('lbl_questions').toLowerCase() + ' lagi diperlukan' : '')}</p></div>
    ${qs.length ? qs.map((q, i) => `<div class="quiz-item"><div class="quiz-item-head"><strong>${i+1}. ${tce(q.q)}</strong><div class="toolbar" style="flex-wrap:nowrap"><button type="button" class="iconbtn" data-act="fe-q-up" data-idx="${i}" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" class="iconbtn" data-act="fe-q-down" data-idx="${i}" ${i === qs.length - 1 ? 'disabled' : ''}>▼</button><button type="button" class="iconbtn" data-act="fe-q-edit" data-idx="${i}">✏️</button><button type="button" class="iconbtn" data-act="fe-q-del" data-idx="${i}">🗑️</button></div></div><ul class="quiz-options">${q.options.map((o, oi) => `<li class="${oi === q.answer ? 'correct' : ''}">${'ABCD'[oi]}. ${tce(o)} ${oi === q.answer ? '✓' : ''}</li>`).join('')}</ul></div>`).join('') : `<p class="muted" style="font-size:.85rem">${t('fe_no_questions')}</p>`}
    <div class="toolbar" style="margin-top:8px"><button type="button" class="btn btn-sm btn-primary" data-act="fe-q-add-new">➕ ${t('qb_add_question')}</button><button type="button" class="btn btn-sm" data-act="fe-q-pick-bank">🗂️ ${t('qb_pick_bank')} (${bankCount})</button><span class="pill" style="margin-left:auto">${qs.length} / ${target}</span></div>
  </div>`;
}

function handleSaveFeQuestions() {
  const fe = getFinalExam(state.editingFinalExamId); if (!fe) return;
  const mc = (fe.moduleConfigs || []).find(x => x.moduleId === state.editingModuleId); if (!mc) return;
  mc.questions = state.tempFeQuestions || [];
  const target = mc.questionCount || 0;
  if (target === 0 || mc.questions.length >= target) { mc.submitted = true; if (!mc.submittedAt) mc.submittedAt = nowISO(); if (!mc.submittedBy) mc.submittedBy = state.user.id; }
  else { mc.submitted = false; mc.submittedAt = null; mc.submittedBy = null; }
  fe.updatedAt = nowISO();
  saveDB();
  logAudit('Update Exam Questions', 'Peperiksaan', fe.id, `${moduleName(state.editingModuleId)} — ${mc.questions.length}/${mc.questionCount}`);
  const feid = fe.id;
  openFinalExamQuestionsEditor(feid);
  toast(mc.submitted ? '✅ ' + t('fe_questions_submitted') : '💾 ' + t('fe_questions_saved'));
}

function handleSaveFeInlineQuestion(form) {
  const idx = form.dataset.idx; const isEdit = idx !== '';
  const options = [0, 1, 2, 3].map(i => form[`opt${i}`].value.trim());
  if (options.filter(Boolean).length < 2) { toast(t('qb_options_required'), 'bad'); return; }
  const answer = Number(form.querySelector('input[name="answer"]:checked').value);
  const newQ = { q: form.question.value.trim(), options, answer };

async function importFinalPracticalMarksExcel(file,feid) {

  const ws=wb.Sheets['Final Exam Marks']||wb.Sheets[wb.SheetNames[0]]; if(!ws) throw new Error('Final Exam Marks sheet not found.');
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  const hr=data.findIndex(r=>String(r[0]||'').trim().toLowerCase()==='participant id'); if(hr<0) throw new Error('Participant ID column not found. Download a fresh template.');
  const headers=data[hr].map(v=>String(v||'').trim()), idCol=headers.findIndex(h=>h.toLowerCase()==='participant id'), remCol=headers.findIndex(h=>h.toLowerCase()==='remarks');
  const cols=criteria.map(c=>headers.findIndex(h=>h===String(c.name||'').trim())); if(cols.some(i=>i<0)) throw new Error('Rubric columns do not match the current exam. Download a fresh template.');
  const allowed=new Map(participants.map(p=>[String(p.id),p])), seen=new Set(), parsed=[], errors=[]; let incomplete=0;
  for(let r=hr+1;r<data.length;r++){const row=data[r]||[],pid=String(row[idCol]||'').trim();if(!pid)continue;
    if(!allowed.has(pid)){errors.push(`Row ${r+1}: participant ${pid} is not enrolled.`);continue;} if(seen.has(pid)){errors.push(`Row ${r+1}: duplicate participant ${pid}.`);continue;}seen.add(pid);
    const scores=criteria.map((c,i)=>{const raw=row[cols[i]];if(raw===''||raw===null||raw===undefined)return null;const n=Number(raw);return (c.levels||[]).some(l=>Number(l.mark)===n)?n:null;});
    if(scores.some(x=>x===null)){incomplete++;continue;}
    let weighted=0,tw=0;criteria.forEach((c,i)=>{const mx=Math.max(...(c.levels||[]).map(l=>Number(l.mark)||0));tw+=Number(c.weight)||0;weighted+=mx>0?(scores[i]/mx)*(Number(c.weight)||0):0;});
    parsed.push({pid,scores,total:tw>0?(weighted/tw)*100:0,remarks:remCol>=0?String(row[remCol]||'').trim():''});
  }
  if(errors.length) throw new Error(`Import cancelled (${errors.length} issue(s)):\n${errors.slice(0,8).join('\n')}`);
  if(!parsed.length) throw new Error('No complete valid marks found.');
  const mids=feModuleIds(fe),fac=state.user.role==='facilitator'||(state.user.role!=='admin'&&mids.some(mid=>isFacilitatorOf(mid,state.user.id)));
  parsed.forEach(item=>{const payload={scores:item.scores,total:item.total,remarks:item.remarks};
    if(fac){if(!Array.isArray(DB.pendingApprovals))DB.pendingApprovals=[];let pa=DB.pendingApprovals.find(x=>x.type==='final-practical'&&x.finalId===feid&&x.participantId===item.pid&&x.status==='pending');if(pa){pa.data=payload;pa.submittedAt=nowISO();}else DB.pendingApprovals.push({id:uid('pa'),type:'final-practical',moduleId:mids[0]||null,finalId:feid,participantId:item.pid,data:payload,submittedBy:state.user.id,submittedAt:nowISO(),status:'pending',reviewedBy:null,reviewedAt:null,reviewRemarks:''});}
    else {let rec=(DB.fePractical||[]).find(x=>x.finalId===feid&&x.participantId===item.pid);if(rec){Object.assign(rec,payload,{by:state.user.id,at:nowISO()});}else DB.fePractical.push({id:uid('fep'),finalId:feid,participantId:item.pid,...payload,by:state.user.id,at:nowISO()});}
    logAudit(fac?'Bulk Final Practical Submitted':'Bulk Final Practical Marks Import','Peperiksaan',`${feid}:${item.pid}`,`${userName(item.pid)}: ${item.total.toFixed(1)}%`);
  });
  saveDB();toast(`${parsed.length} ${currentLang==='en'?'participant marks imported':'rekod markah peserta diimport'}.${incomplete?` ${incomplete} incomplete row(s) skipped.`:''}${fac?' Sent for trainer approval.':''}`);render();
}

function handleSaveFinalPractical(form) {
  const feid = form.dataset.feid, pid = form.dataset.pid;
  const fe = getFinalExam(feid); if (!fe) return;
  const rb = getRubricById(fe.rubricId);
  const rubric = rb ? (rb.criteria || []) : [];
  const scores = rubric.map((c, i) => { const sel = form.querySelector(`input[name="c${i}"]:checked`); return sel ? Number(sel.value) : 0; });
  let tw = 0, ts = 0;
  rubric.forEach((c, i) => { const mark = scores[i]; const mx = Math.max(...c.levels.map(l => l.mark)); tw += c.weight; ts += mx > 0 ? (mark / mx) * c.weight : 0; });
  const totalPct = tw > 0 ? (ts / tw) * 100 : 0;
  const remarks = form.remarks.value.trim();
  const data = { scores, total: totalPct, remarks };
  const examMids = feModuleIds(fe);
  const isFac = state.user.role === 'facilitator' || (state.user.role !== 'admin' && examMids.some(mid => isFacilitatorOf(mid, state.user.id)));
  const shouldSubmitForApproval = state.user.role === 'facilitator' || (state.user.role === 'trainer' && isFac) || (state.user.role !== 'admin' && isFac);
  const firstMid = examMids[0] || null;
  if (shouldSubmitForApproval) {
    let pa = (DB.pendingApprovals || []).find(x => x.type === 'final-practical' && x.finalId === feid && x.participantId === pid && x.status === 'pending');
    if (pa) { pa.data = data; pa.submittedAt = nowISO(); }
    else { if (!Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = []; DB.pendingApprovals.push({ id: uid('pa'), type: 'final-practical', moduleId: firstMid, finalId: feid, participantId: pid, data, submittedBy: state.user.id, submittedAt: nowISO(), status: 'pending', reviewedBy: null, reviewedAt: null, reviewRemarks: '' }); }
    saveDB(); logAudit('Submit Final Practical (Pending Approval)', 'Peperiksaan', `${feid}:${pid}`, `${userName(pid)}: ${totalPct.toFixed(1)}%`);
    closeModal(); render();
    saveCritical('⏳ ' + t('pa_submitted_for_approval'), 'warn');
    return;
  }
  let rec = (DB.fePractical || []).find(x => x.finalId === feid && x.participantId === pid);
  if (rec) { rec.scores = scores; rec.total = totalPct; rec.remarks = remarks; rec.by = state.user.id; rec.at = nowISO(); }
  else DB.fePractical.push({ id: uid('fep'), finalId: feid, participantId: pid, scores, total: totalPct, remarks, by: state.user.id, at: nowISO() });
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => !(x.type === 'final-practical' && x.finalId === feid && x.participantId === pid && x.status === 'pending'));
  saveDB(); logAudit('Final Practical Marks', 'Peperiksaan', `${feid}:${pid}`, `${userName(pid)}: ${totalPct.toFixed(1)}%`);
  closeModal(); render();
  saveCritical(t('pf_saved'));
}

function handleSaveModule(form) {
  const id = form.dataset.id;

  const facilitatorIds = [...form.querySelectorAll('input[name="facilitatorIds"]:checked')].map(x => x.value);
  const data = {
    name: form.name.value.trim(), description: form.description.value.trim(),
    trainerIds, facilitatorIds, trainerId: trainerIds[0] || null, facilitatorId: facilitatorIds[0] || null,
    published: form.published.value === 'true', startDate: (form.startDate && form.startDate.value) || null, endDate: (form.endDate && form.endDate.value) || null, startTime: (form.startTime && form.startTime.value) || null, endTime: (form.endTime && form.endTime.value) || null, updatedAt: nowISO()
  };
  if (!data.name) { toast(t('msg_required'), 'bad'); return; }
  if (!trainerIds.length) { toast(currentLang === 'en' ? 'Select at least one trainer.' : 'Pilih sekurang-kurangnya seorang jurulatih.', 'bad'); return; }
  if (trainerIds.some(x => facilitatorIds.includes(x))) { toast(currentLang === 'en' ? 'A person cannot be assigned as both trainer and facilitator in the same module.' : 'Individu yang sama tidak boleh dipilih sebagai jurulatih dan fasilitator bagi modul yang sama.', 'bad'); return; }
  if (id) {
    const m = getModule(id); const oldTrainerIds = moduleTrainerIds(m);
    Object.assign(m, data);
    DB.activities.filter(a => a.moduleId === id).forEach(a => { a.module = data.name; a.trainerId = data.trainerId; });
    saveDB(); logAudit('Update Module', 'Modul', id, data.name); toast(t('msg_updated'));
  } else {
    const nm = Object.assign({ id: uid('mod'), createdBy: state.user.id, createdAt: nowISO(), materials: [] }, data);
    DB.modules.push(nm); saveDB(); logAudit('Create Module', 'Modul', nm.id, nm.name); toast(t('msg_created_module'));

function deleteModule(id) {
  const m = getModule(id); if (!m) return;
  const acts = moduleActivitiesList(id);
  const ttCount = moduleTimetable(id).length;
  const feCount = moduleFinalExams(id).length;
  const msg = t('confirm_delete_module', m.name, acts.length, (m.materials||[]).length, enrolledParticipants(id).length) + (ttCount ? `\n\n📅 ${ttCount} ${t('tt_title').toLowerCase()}` : '') + (feCount ? `\n🎓 ${feCount} ${t('fe_title').toLowerCase()}` : '');
  if (!confirm(msg)) return;
  const aids = acts.map(a => a.id);
  DB.modules = DB.modules.filter(x => x.id !== id);
  DB.activities = DB.activities.filter(a => a.moduleId !== id);
  DB.attempts = DB.attempts.filter(x => !aids.includes(x.activityId));
  DB.attendance = DB.attendance.filter(x => !aids.includes(x.activityId));
  DB.practical = DB.practical.filter(x => !aids.includes(x.activityId));
  DB.enrollments = DB.enrollments.filter(e => e.moduleId !== id);
  DB.timetables = DB.timetables.filter(x => x.moduleId !== id);
  DB.finalExams = (DB.finalExams || []).filter(fe => { fe.moduleConfigs = (fe.moduleConfigs || []).filter(mc => mc.moduleId !== id); return fe.moduleConfigs.length > 0; });
  const remainingFeIds = (DB.finalExams || []).map(fe => fe.id);
  DB.feAttempts = (DB.feAttempts || []).filter(x => remainingFeIds.includes(x.finalId));
  DB.fePractical = (DB.fePractical || []).filter(x => remainingFeIds.includes(x.finalId));
  DB.questionBank = (DB.questionBank || []).filter(x => x.moduleId !== id);
  if (Array.isArray(DB.retests)) DB.retests = DB.retests.filter(x => !aids.includes(x.activityId));
  if (Array.isArray(DB.pendingApprovals)) DB.pendingApprovals = DB.pendingApprovals.filter(x => x.moduleId !== id);
  saveDB(); logAudit('Delete Module', 'Modul', id, m.name); toast(t('msg_deleted')); state.view = 'modules'; state.params = {}; render();
}
